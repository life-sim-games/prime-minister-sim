  if(S.partySupport && S.partySupport[o.from]!=null) S.partySupport[o.from] = clamp(S.partySupport[o.from]-0.4, 0, 100);
  if(S.partySupport && S.partySupport[S.pmParty]!=null) S.partySupport[S.pmParty] = clamp(S.partySupport[S.pmParty]+0.2, 0, 100);
  applySegAll(0.4);
  recordApproval(0.4, `${o.name}氏の電撃移籍を受け入れ、新しい顔ぶれが政権に新鮮味をもたらした`);
  showTVNews({
    band:"速報", kicker:"政界", title:`${esc(o.name)}氏が${esc(to.name)}へ電撃移籍`,
    sub:`${esc(o.fromName)}は反発 ― 議席も1つ移動`,
    body:`${esc(o.fromName)}の${esc(o.name)}氏が離党し、${esc(to.name)}への移籍が発表されました。同氏は大臣候補プールに加わり、議席も${esc(to.name)}に1つ移ります。${esc(o.fromName)}は「有権者への背信だ」と反発していますが、与党内には歓迎の声もあります。プロフィールの党歴には、ゲーム内移籍として記録されました。`,
    quoteWho:"野党幹部", quote:"選挙で託された議席を、党を変えて持ち歩くのはいかがなものか",
    btn:"政権運営に戻る", fn:"postCrisisCheck()"
  });
}
function declineTransferOffer(){
  const o = S.pendingTransferOffer; S.pendingTransferOffer = null;
  if(o){
    if(!Array.isArray(S.transferDeclined)) S.transferDeclined = [];
    if(!S.transferDeclined.includes(o.name)) S.transferDeclined.push(o.name);
    S.rosterLog.push(`${o.name}氏からの移籍の打診は、丁重に見送られた。`);
    if(S.rosterLog.length > 6) S.rosterLog.shift();
  }
  postCrisisCheck();
}

/* 実在議員の勇退確率（1回の判定＝年次または選挙の節目ごと）：75〜79歳8%／80〜84歳25%／85〜89歳50%／90歳以上90%。
   85〜89歳で半数が去るため、開始時86歳の議員が90歳に届くのは1割未満の稀なケースになる */
function retireChanceOf(age){
  if(age < 75) return 0;
  if(age < 80) return 0.08;
  if(age < 85) return 0.25;
  if(age < 90) return 0.50;
  return 0.90;
}

/* ---------------- 組閣 ---------------- */
/* 与党の党ID一覧：首相の所属政党＋現在の連立パートナー（主パートナーと追加パートナー） */
function govPartyIds(){
  const ids = [S.pmParty];
  coalitionPartnerIds().forEach(pid=>ids.push(pid));
  return [...new Set(ids)];
}
function isGovParty(partyId){ return govPartyIds().includes(partyId); }
/* その人物を今の政権で起用できるか：与党議員か、別枠の民間人のみ可。野党議員は不可 */
function isEligibleMinister(m){
  if(!m) return false;
  if(m.civilian || m.party==="civilian") return true;
  return isGovParty(m.party);
}
function isEligibleChief(c){
  if(!c) return false;
  if(S && (S.rosterRetired||[]).includes(c.name)) return false; /* 勇退・引退した議員は選対委員長にも戻らない */
  return c.party===S.pmParty;
}
let cabinetDraft = {};
let cabinetNotice = "";
let cabinetExpanded = {}; /* 組閣画面で「候補を全員見る」を開いたポスト（キー：ポストid／選対委員長は "__chief"） */

/* ---------------- おまかせ自動編成 ----------------
   組閣・内閣改造で「大臣を選ぶのが面倒」な人向けに、選び方（モード）を選んで
   ボタンを押すだけで全ポストを自動で埋める機能。適格ルールは手動選択と完全に同じ：
   与党議員は ministerCandidates の母集団から、民間人は civilianCandidates の別枠
   （各ポスト最大2人）から選び、isEligibleMinister で再確認する。首相本人と
   更迭対象者は除外し、同一人物は複数ポスト（選対委員長を含む）に重複させない。
   あくまで下書き（cabinetDraft）を書き換えるだけなので、編成後は各ポストを
   個別に手動変更でき、押し直せば再抽選・並べ直しができる。セーブ形式には影響しない */
const CABINET_AUTO_MODES = [
  {id:"fit", name:"適材適所", desc:"各ポストと専門分野の相性が良い人を優先して配置する"},
  {id:"skill", name:"実力順", desc:"実務能力が高い順に配置する"},
  {id:"pop", name:"人気順", desc:"人気・知名度が高い順に配置する"},
  {id:"exp", name:"経験順", desc:"当選回数や年齢など、経験の深い順に配置する"},
  {id:"random", name:"ランダム", desc:"適格な候補から完全にランダムに配置する。意外な顔ぶれになる"},
];
let cabinetAutoMode = "fit";
let cabinetAutoNote = "";
function cabinetAutoModeDef(){ return CABINET_AUTO_MODES.find(m=>m.id===cabinetAutoMode) || CABINET_AUTO_MODES[0]; }
function setCabinetAutoMode(v){ if(CABINET_AUTO_MODES.some(m=>m.id===v)) cabinetAutoMode = v; renderCabinetKeep(); }
/* ポストと人物の相性スコア（適材適所モード用）。
   通常ポストは専門一致度（主専門=100／副専門=72）を軸にし、官房長官は既存の適性判定
   （fitLabel／isOffSpecPick）とそろえて「官房・調整の専門か、答弁力＋人気」を軸にする */
function cabinetAutoFitScore(post, m){
  if(post.id==="kanbo"){
    if(m.spec==="官房") return 100;
    if(hasSpec(m, "官房")) return 84;
    const apt = (m.debate||0) + (m.pop||0);
    if(apt>=132) return 62;
    if(apt>=118) return 46;
    if(apt>=104) return 28;
    return 8;
  }
  const lv = specMatchLevel(m, post);
  if(lv===2) return 100;
  if(lv===1) return 72;
  return 0;
}
/* モードごとの並び替え比較関数（そのモードの指標が高い人を前にする） */
function cabinetAutoComparator(mode, post){
  if(mode==="pop") return (a,b)=> ((b.pop||0)-(a.pop||0)) || (effSkill(b)-effSkill(a)) || ((b.debate||0)-(a.debate||0));
  if(mode==="exp") return (a,b)=> (termsOf(b)-termsOf(a)) || ((ageOf(b)||0)-(ageOf(a)||0)) || ((b.ped||0)-(a.ped||0)) || (effSkill(b)-effSkill(a));
  if(mode==="skill") return (a,b)=> (effSkill(b)-effSkill(a)) || ((b.debate||0)-(a.debate||0)) || ((b.pop||0)-(a.pop||0));
  if(mode==="fit") return (a,b)=> (cabinetAutoFitScore(post,b)-cabinetAutoFitScore(post,a)) || ((b.ped||0)-(a.ped||0)) || (effSkill(b)-effSkill(a)) || ((b.pop||0)-(a.pop||0));
  return null; /* ランダムは呼び出し側でシャッフルする */
}
/* そのポストに自動編成で配置できる候補の一覧（適格判定は既存ルールをそのまま使う） */
function cabinetAutoCandidates(post){
  const dismissed = S.pendingDismissal ? S.pendingDismissal.name : null;
  const byName = new Map();
  ministerCandidates(post).forEach(m=>{ if(isEligibleMinister(m) && m.name!==S.pmName && m.name!==dismissed) byName.set(m.name, m); });
  civilianCandidates(post).forEach(m=>{ if(isEligibleMinister(m) && m.name!==dismissed && !byName.has(m.name)) byName.set(m.name, m); });
  return [...byName.values()];
}
function autoFillCabinet(){
  const modeDef = cabinetAutoModeDef();
  const mode = modeDef.id;
  /* 適材適所では、専門家の少ないポストから先に決めると全体の一致が取りやすい。
     ランダムではポストの順番自体もシャッフルし、毎回違う顔ぶれになりやすくする */
  let postOrder = POSTS.slice();
  if(mode==="fit"){
    const scarcity = {};
    POSTS.forEach(p=>{ scarcity[p.id] = cabinetAutoCandidates(p).filter(m=>cabinetAutoFitScore(p,m)>0).length; });
    postOrder.sort((p1,p2)=> scarcity[p1.id]-scarcity[p2.id]);
  } else if(mode==="random"){
    postOrder = shuffle(postOrder);
  }
  const used = new Set();
  const nextDraft = {};
  postOrder.forEach(post=>{
    let cands = cabinetAutoCandidates(post).filter(m=>!used.has(m.name));
    if(!cands.length) return;
    if(mode==="random") cands = shuffle(cands);
    else cands.sort(cabinetAutoComparator(mode, post));
    nextDraft[post.id] = cands[0];
    used.add(cands[0].name);
  });
  /* 万一、全ポストが埋まらない場合（適格候補がポスト数より少ない異常ケース）は、
     半端な編成で下書きを上書きせず、不足しているポストを伝える */
  const missing = POSTS.filter(p=>!nextDraft[p.id]);
  if(missing.length){ alertInPage(`適格な候補が不足しているため、おまかせ編成できませんでした（候補が足りないポスト：${missing.map(p=>p.name).join("、")}）`); return; }
  POSTS.forEach(p=>{ cabinetDraft[p.id] = nextDraft[p.id]; });
  /* 選挙対策委員長も自動で選ぶ（そのまま「組閣を確定」に進めるように）。
     大臣と同一人物にはしない。選対委員長には人気の指標が無いため、
     人気順・実力順・適材適所では「選挙のうまさ」、経験順では当選回数を軸にする */
  const chiefCands = ELECTION_CHIEFS.filter(c=>isEligibleChief(c));
  const chiefFree = chiefCands.filter(c=>!used.has(c.name));
  const chiefPool = chiefFree.length ? chiefFree : chiefCands;
  if(chiefPool.length){
    if(mode==="random") cabinetDraft.chief = pick(shuffle(chiefPool));
    else if(mode==="exp") cabinetDraft.chief = chiefPool.slice().sort((a,b)=> (termsOf(b)-termsOf(a)) || ((ageOf(b)||0)-(ageOf(a)||0)) || (b.skill-a.skill))[0];
    else cabinetDraft.chief = chiefPool.slice().sort((a,b)=> (b.skill-a.skill) || (termsOf(b)-termsOf(a)))[0];
  }
  cabinetAutoNote = `おまかせ自動編成（${modeDef.name}）で全ポストを埋めました。気に入らなければ、選び方を変えて押し直したり、各ポストを個別に変更したりできます。`;
  renderCabinetKeep();
}
function cabinetStep(first){
  ensureCabinetFields();
  cabinetFirstFlag = first;
  cabinetDraft = {};
  cabinetExpanded = {};
  cabinetNotice = "";
  cabinetAutoNote = "";
  const dropped = [];
  POSTS.forEach(p=>{
    const cur = S.cabinet[p.id] || null;
    if(cur && !isEligibleMinister(cur)){
      /* 連立離脱などで与党外になった閣僚は自動的に退任扱いにし、後任を選ばせる */
      dropped.push(`${p.name}の${cur.name}氏`);
      S.cabinet[p.id] = null;
      cabinetDraft[p.id] = null;
    } else {
      cabinetDraft[p.id] = cur;
    }
  });
  if(S.electionChief && !isEligibleChief(S.electionChief)){
    dropped.push(`選挙対策委員長の${S.electionChief.name}氏`);
    S.electionChief = null;
  }
  cabinetDraft.chief = S.electionChief || null;
  if(S.pendingDismissal){
    /* 更迭が決まったポストは空席として扱い、後任の選択を必須にする（本人は候補から除外する） */
    cabinetDraft[S.pendingDismissal.postId] = null;
  }
  if(dropped.length){
    cabinetNotice = `${dropped.join("、")}は、連立の枠組みが変わり与党の議員ではなくなったため退任した。後任を選んでください。`;
  }
  renderCabinet(first);
  const _cu = pushUndo("cabinet", first ? "組閣" : "内閣改造", {first: !!first, draft: deepCopy(cabinetDraft), notice: cabinetNotice});
  markUndoHere(_cu);
}

function pickFromPool(name){
  const post = POSTS.find(p=>p.id===poolPick.postId);

/* ポスト適性の表示文。官房長官だけは省庁の専門分野では測れないので、
   実際に効果へ効く「答弁力＋人気」で適性を段階表示する（専門が官房の人物はそのまま一致扱い）。
   以前は官房長官に対応する専門が無く、候補全員が「専門外の起用」と表示されていた */
function fitLabel(post, m){
  if(post.id==="kanbo"){
    if(hasSpec(m, "官房")) return m.spec==="官房" ? "専門分野が一致（官房・調整）" : "専門分野が一致（副専門：官房・調整）";
    const apt = (m.debate||0) + (m.pop||0);
    if(apt>=132) return "官房適性が高い（答弁・人気に優れる）";
    if(apt>=118) return "官房適性あり（答弁・人気）";
    if(apt>=104) return "官房適性は標準的";
    return "官房長官には荷が重いかも（答弁・人気が不安）";
  }
  const lv = specMatchLevel(m, post);
  if(lv===2) return "専門分野が一致";
  if(lv===1) return "専門分野が一致（副専門）";
  return "専門外の起用";
}
/* ニュース判定用の「専門外起用」かどうか。官房長官は専門（官房・調整）か、
   答弁・人気の適性が一定以上あれば専門外とはみなさない（fitLabel の段階表示と整合） */
function isOffSpecPick(post, m){
  if(!post || !m) return false;
  if(post.id==="kanbo") return !hasSpec(m, "官房") && ((m.debate||0) + (m.pop||0)) < 118;
  return specMatchLevel(m, post) === 0;
}

function personCard(m, onclickFn, label){

}
function ministerCandidates(post){
  const spec = POST_SPEC[post.id];
  /* 候補は与党（自党＋現在の連立パートナー）の議員だけ。野党議員は一切含めない。
     首相本人が閣僚候補に重複して出ることも防ぐ（首相候補と閣僚プールに同名の実在議員がいるため）。
     並び順は「自党を優先」：自党の専門一致→自党のその他→連立の専門一致→連立のその他の順。
     以前は連立側に加点していたため、専門ポストで連立候補が自党より上に来て
     「党内より連立が多い」見え方になっていたので改めた。
     同じ区分の中では、まず実績（ped：大臣経験者や党の要職を務めた人が前）で並べ、次に能力で並べる。
     実在議員の ped は公表経歴に基づき、架空議員は生成された略歴の範囲（最大で中堅級）に抑えるため、
     実績の薄い架空議員が実績豊富な実在議員より前に出ることはない。
     官房長官だけは従来どおり「答弁力＋人気」が評価の軸で、実績は後押しとして少しだけ効く */
  let pool = ministerPoolAll().filter(m=>isGovParty(m.party) && m.name!==S.pmName);
  pool.sort((a,b)=>{
    /* 専門一致は主専門＞副専門の順に優先する（副専門の一致は主専門より半歩だけ後ろ） */
    const ma = a.spec===spec ? 0 : (hasSpec(a, spec) ? 0.4 : 1);
    const mb = b.spec===spec ? 0 : (hasSpec(b, spec) ? 0.4 : 1);
    const ga = (a.party===S.pmParty?0:2) + ma;
    const gb = (b.party===S.pmParty?0:2) + mb;
    if(ga!==gb) return ga-gb;
    if(post.id==="kanbo"){
      const sa = (a.debate + a.pop) + (a.ped||0)*6 + expOf(a)*2;
      const sb = (b.debate + b.pop) + (b.ped||0)*6 + expOf(b)*2;
      if(sb!==sa) return sb-sa;
      return effSkill(b)-effSkill(a);
    }
    const pa = a.ped||0, pb = b.ped||0;
    if(pa!==pb) return pb-pa;
    const sa = effSkill(a)/100 + expOf(a)*0.1;
    const sb = effSkill(b)/100 + expOf(b)*0.1;
    return sb-sa;
  });
  return pool;
}
/* その人物が「途中からプールに加わった」メンバーか（選挙で当選した擁立候補・
   年次／選挙で加入した新人・新党の初期メンバーはいずれも S.rosterNew に入る）。
   静的な MINISTER_POOL の人物とは区別して、組閣画面で埋もれないよう扱う */
function isPoolAdded(m){
  if(!m || !S || !Array.isArray(S.rosterNew)) return false;
  return S.rosterNew.some(r=>r.name===m.name);
}
/* プール加入の出どころを示すタグ（組閣画面・プール一覧で使う） */
function poolJoinTag(m){
  if(!isPoolAdded(m)) return "";
  if(m.fromCandidate) return '<span class="tag navy">選挙で当選・プール入り</span>';
  if(isNewPartyId(m.party)) return '<span class="tag navy">新党メンバー</span>';
  return '<span class="tag navy">途中加入</span>';
}
/* 表示枠の抽出：基本は実在議員を優先し、素の架空議員は「表示される実在議員の人数」を
   超えない範囲でのみ補充する。ただし S.rosterNew 由来の途中加入メンバー（選挙で当選した
   擁立候補・新人・新党メンバー）は、実在議員に枠を埋められても埋もれないよう、
   枠の半分までを優先確保して必ず表示に入れる（残りも空きがあれば入る）。
   以前は自民党のような実在議員の多い党だと、選挙で加入した候補がどのポストでも
   一切表示されず「プールが増えていない」ように見える不具合があった。
   実在議員が1人もいない党（新党など）は全員が途中加入メンバーなので、そのまま全員が対象。
   返り値の並びは元の候補順（専門一致→実績順）を保つ */
function pickDisplayFrame(list, maxN){
  if(!list || !list.length || maxN<=0) return [];
  const chosen = new Set();
  const added = list.filter(m=>isPoolAdded(m));
  const reals = list.filter(m=>!m.fic && !isPoolAdded(m));
  const otherFic = list.filter(m=>m.fic && !isPoolAdded(m));
  const reserve = Math.min(added.length, Math.ceil(maxN/2));
  added.slice(0, reserve).forEach(m=>chosen.add(m.name));
  reals.forEach(m=>{ if(chosen.size<maxN) chosen.add(m.name); });
  added.slice(reserve).forEach(m=>{ if(chosen.size<maxN) chosen.add(m.name); });
  const realShown = list.filter(m=>chosen.has(m.name) && !m.fic).length;
  const ficCap = reals.length ? Math.max(realShown, reserve) : maxN;
  let ficShown = list.filter(m=>chosen.has(m.name) && m.fic).length;
  otherFic.forEach(m=>{ if(chosen.size<maxN && ficShown<ficCap){ chosen.add(m.name); ficShown++; } });
  return list.filter(m=>chosen.has(m.name));
}
function civilianCandidates(post){
  const spec = POST_SPEC[post.id];
  let pool = CIVILIAN_POOL.slice();
  pool.sort((a,b)=>{
    const as = (a.spec===spec?2:(hasSpec(a, spec)?1.2:0)) + a.skill/100;
    const bs = (b.spec===spec?2:(hasSpec(b, spec)?1.2:0)) + b.skill/100;
    return bs-as;
  });
  if(post.id==="kanbo") pool.sort((a,b)=>((b.debate+b.pop) - (a.debate+a.pop)));
  /* 別枠は各ポスト最大2人まで（専門一致を優先） */
  return pool.slice(0,2);
}

/* 内閣の年齢・当選回数構成が世代別支持に与える小さな影響と、新聞向けの反応文 */
function cabinetGenEffect(){
  const ms = POSTS.map(p=>S.cabinet[p.id]).filter(Boolean);
  if(!ms.length) return {eff:{}, note:""};
  const youngN = ms.filter(m=>ageOf(m)!=null && ageOf(m)<=52).length;
  const vetN = ms.filter(m=>!m.civilian && termsOf(m)>=8).length;

/* ---------------- 支持率計算 ---------------- */
function applySeg(eff){
  if(!eff) return;
  if(eff.all) SEGMENTS.forEach(g=>{ S.seg[g.id]=clamp(S.seg[g.id]+eff.all, 3, 97); });
  SEGMENTS.forEach(g=>{ if(eff[g.id]) S.seg[g.id]=clamp(S.seg[g.id]+eff[g.id], 3, 97); });
}
function applySegAll(v){ SEGMENTS.forEach(g=>{ S.seg[g.id]=clamp(S.seg[g.id]+v, 3, 97); }); }
function recalcApproval(){
  S.prevApproval = S.approval;
  /* 官房長官の下支え：人気と答弁が高いと下振れを緩和 */
  let target = overallFromSeg();
  const kanbo = S.cabinet.kanbo;
  if(kanbo) target += (kanbo.pop-55)/22 + (kanbo.debate-60)/40;
  target += (S.econ-50)/9 + (S.fisc-45)/14 + (50-S.infl)/20;
  /* イデオロギー：岩盤が固まっている政権は底堅く、中間層の好感は天井を押し上げる。
     政権の色が真ん中から極端に離れると、中間層側の天井が少し下がる */
  ensureIdeo();
  target += (S.ideoCore-55)/85 + (S.ideoCenter-50)/90;
  /* 実績の蓄積による下支え：決めてきた政策の数が多い政権ほど、多少の逆風では支持が崩れにくい（上限つきの小さな効果） */
  target += Math.min(1.2, (S.policiesDone ? S.policiesDone.length : 0) * 0.06);
  const _cd = ideoDist(govIdeoVec(), {cons:0,hawk:0,gov:0});
  if(_cd > 2.4) target -= (_cd-2.4)*0.7;
  if(S.twisted) target -= 1.2;
  if(!S.coalition && totalGovHR() < HR_TOTAL/2) target -= 0.8;
  S.approval = clamp(Math.round(target + rnd(-1.2,1.2)), 2, 96);
  S.maxApproval = Math.max(S.maxApproval, S.approval);
  S.minApproval = Math.min(S.minApproval, S.approval);
  S.approvalHist.push(S.approval);
  if(S.approval < 25) S.lowStreak++; else if(S.approval >= 30) S.lowStreak = 0;
  /* 党支持率の連動 */
  PARTIES.forEach(p=>{
    let drift = rnd(-0.7,0.7);
    if(p.id===S.pmParty) drift += (S.approval-42)/26;
    if(S.coalition && coalitionPartnerIds().includes(p.id)) drift += (S.approval-45)/40;
    if(p.id==="cdp") drift += (38-S.approval)/45;
    S.partySupport[p.id] = clamp(S.partySupport[p.id]+drift, 1, 55);
  });
}

/* ---------------- メイン画面 ---------------- */
function gaugeLabel(v, good, bad){ return v>=55?good:(v<=40?bad:"ふつう"); }

/* ---------------- 財政の健全さ：ゾーン・変動理由の記録・詳細 ----------------
   予算編成のときだけ見える数字にしないため、メイン画面のカードからいつでも詳細を開けるようにする。
   財政の健全さ（S.fisc）を変える経路は 予算決定・政策判断・イベント・危険予算の月次ペナルティ・
   安全圏予算の月次回復 で、その全てで recordFisc を呼び、変動理由が必ず追えるようにしている。
   回復側の設計：安全圏の予算は編成時に絶対評価で回復し（連続年数で積み上がる）、
   安全圏の予算が続く間は毎月+0.25ずつ、注意ゾーンの予算でも毎月+0.1ずつ回復する。
   注意ゾーンの編成時にも+1の回復を付け、「安全圏まで締めないと永遠に回復しない」詰まりをなくした。
   低下側の設計：危機的（40以下）まで落ちるのが早すぎるとの声を受け、全体にゆるやかにした。
   政策判断のマイナスは7割に圧縮、予算編成は下げ側の係数と上限を緩和（危険ゾーンの追加ペナルティ-2、
   1回の編成での下限-7）、危険予算の月次ペナルティは-0.2、補正予算は国債1兆円あたり-0.35・下限-5、
   イベント支出は4分の3に圧縮。あわせて財政を改善する判断では、痛みを伴う層の反発を8割に和らげた。
   回復側・初期値46・ゾーン境界（55／41）は据え置き */
function fiscZoneOf(v){ return v>=55 ? "safe" : (v>=41 ? "caution" : "danger"); }
function fiscZoneName(z){ return z==="safe" ? "安全圏" : z==="caution" ? "注意" : "危険"; }
function ensureFiscFields(){
  if(!S) return;
  if(!Array.isArray(S.fiscLog)) S.fiscLog = [];
  if(typeof S.fiscMonthStart!=="number") S.fiscMonthStart = S.fisc;
  if(typeof S.fiscPrevDelta!=="number") S.fiscPrevDelta = 0;
  if(typeof S.fiscSoundStreak!=="number") S.fiscSoundStreak = 0; /* 安全圏の予算を組んだ連続年数（旧セーブは0から） */
}
function recordFisc(delta, reason){
  if(!S || !delta || Math.abs(delta) < 0.05) return;
  ensureFiscFields();
  reason = String(reason||"");
  const last = S.fiscLog[S.fiscLog.length-1];

  if(last && last.reason === reason){
    last.delta = Math.round((last.delta + delta)*10)/10;
    last.when = `${S.year}年${S.month}月`;
    last.turn = S.turn;
    return;
  }
  S.fiscLog.push({turn:S.turn, when:`${S.year}年${S.month}月`, delta:Math.round(delta*10)/10, reason});
  if(S.fiscLog.length > 40) S.fiscLog = S.fiscLog.slice(-40);
}

/* ---------------- 支持率の変動理由の記録／「飽き」対策／国民・各党の声／野党との関係 ----------------

   支持率そのものの計算式は大きく変えず、記録と表示の追加が中心。
   あわせて長期政権の「飽き」への対抗手段（内閣改造の刷新感・新たな取り組み・実績の蓄積）を
   実際に効く形で用意し、理由表示にも出す */
function ensureApprovalFields(){
  if(!S) return;
  if(!Array.isArray(S.approvalLog)) S.approvalLog = [];
  if(typeof S.approvalShown!=="number") S.approvalShown = 0;
  if(S.lastVoices===undefined) S.lastVoices = null;
  if(!S.oppRel || typeof S.oppRel!=="object") S.oppRel = {};
  if(!S.coopHist || typeof S.coopHist!=="object") S.coopHist = {};
  if(typeof S.lastCoopTurn!=="number") S.lastCoopTurn = -99;
  if(typeof S.lastOfferTurn!=="number") S.lastOfferTurn = -99;
  if(typeof S.lastOfferCheckTurn!=="number") S.lastOfferCheckTurn = -1;
  if(S.pendingCoop===undefined) S.pendingCoop = null;
  if(S.pendingOffer===undefined) S.pendingOffer = null;
  if(typeof S.freshnessTurn!=="number") S.freshnessTurn = -99;
}
function recordApproval(delta, reason){
  if(!S || !reason) return;
  ensureApprovalFields();
  delta = Math.round((delta||0)*10)/10;
  const last = S.approvalLog[S.approvalLog.length-1];
  /* 同じ理由が同じ月に続く場合は1件にまとめて累計で見せる（財政ログと同じ扱い） */
  if(last && last.reason === reason && last.turn === S.turn){
    last.delta = Math.round((last.delta + delta)*10)/10;
    return;
  }
  S.approvalLog.push({turn:S.turn, when:`${S.year}年${S.month}月`, delta:delta, reason:String(reason)});
  if(S.approvalLog.length > 80){
    const drop = S.approvalLog.length - 80;
    S.approvalLog = S.approvalLog.slice(-80);
    S.approvalShown = Math.max(0, S.approvalShown - drop);
  }
}
function approvalDeltaText(d){

  return (d>0 ? "▲ +" : "▼ ") + Math.abs(Math.round(d*10)/10);
}

function segDeltaSince(snap){

  const fresh = (typeof S.freshnessTurn==="number" && S.turn - S.freshnessTurn <= 2);

/* ---------------- 国民の声・各党の声 ----------------

   各党の声は党としての受け止めの一般化にとどめ、実在個人の発言は作らない */
const CITIZEN_VOICE_LABEL = { youth:"若者", parents:"子育て世帯", elderly:"高齢者", business:"事業者", rural:"地方の住民", urban:"都市部の住民" };
const CITIZEN_VOICES = {
  youth:{ pos:["若い世代の声を聞いてくれた感じがする","この方向なら将来に期待が持てる"], neg:["若い世代には恩恵が薄い気がする","期待していたのと違う、という声も多い"] },
  parents:{ pos:["子育て中の身には本当に助かる","働きながら育てる負担が少し軽くなりそう"], neg:["子育て世帯への目配りが足りない","うちみたいな世帯には届かない内容だ"] },
  elderly:{ pos:["安心して暮らせる方向だと思う","年寄りのことも考えてくれている"], neg:["年金暮らしには厳しい話だ","年寄りが置いていかれる気がする"] },
  business:{ pos:["事業の見通しが立てやすくなった","現場の実感に合った判断だと思う"], neg:["事業者への負担や先行きの不透明感が増す","経済界としては首をかしげる内容だ"] },
  rural:{ pos:["地方のことも忘れていないと感じた","地域の暮らしに効いてくれそうだ"], neg:["地方はまた後回しか、という空気がある","都市部ばかり見ているように思う"] },
  urban:{ pos:["都市の生活実感に合っている","合理的で納得感のある判断だ"], neg:["都市の住民の負担が増えそうだ","説明が足りず、モヤモヤが残る"] },
};
function buildVoices(p, opt, segPer, excludePid, idx){
  const voices = [];
  const field = p.field || "";
  const sorted = SEGMENTS.map(g=>({id:g.id, d: segPer[g.id]||0})).sort((a,b)=>b.d-a.d);
  const usedSeg = new Set();
  const pushCitizen = (s)=>{
    if(!s || usedSeg.has(s.id)) return;
    usedSeg.add(s.id);
    const pool = CITIZEN_VOICES[s.id]; if(!pool) return;
    const arr = s.d>=0 ? pool.pos : pool.neg;
    voices.push({ who:`${CITIZEN_VOICE_LABEL[s.id]}の声`, text:`「${arr[Math.floor(Math.random()*arr.length)]}」`, tone: s.d>=0 ? "pos" : "neg" });
  };
  const top = sorted[0], bottom = sorted[sorted.length-1];
  if(top && top.d >= 1) pushCitizen(top);
  if(bottom && bottom.d <= -1) pushCitizen(bottom);
  if(!voices.length){
    /* 大きく動いた層がない月は、無風の受け止めとして中立の声を1件 */
    const mid = sorted.find(s=>Math.abs(s.d) < 1) || top;
    if(mid){ usedSeg.add(mid.id); voices.push({ who:`${CITIZEN_VOICE_LABEL[mid.id]}の声`, text:`「${field}の話は様子見。結果が出てくるか見たい」`, tone:"neu" }); }
  } else if(voices.length === 1){
    const second = sorted.find(s=>!usedSeg.has(s.id) && Math.abs(s.d) >= 0.5 && s.id !== (top?top.id:null));
    if(second) pushCitizen(second);
  }
  /* 各党の声：連立パートナー（いなければ与党内）の受け止め＋野党1党の反応 */
  const v = getOptIdeo(p, opt, idx||0);
  const partners = coalitionPartnerIds();
  if(partners.length){
    const pid = partners[0];
    const pp = partyById(pid);
    const d = ideoDist(v, partyIdeo(pid));
    if(pp) voices.push({ who:`${pp.name}（連立パートナー）の受け止め`, tone: d<=1.4 ? "pos" : (d>=2.7 ? "neg" : "neu"),
      text: d<=1.4 ? "連立内で重視してきた方向に沿う判断として、評価する声が上がっている" : (d>=2.7 ? "党内には慎重論もあり、連立内の調整の跡がうかがえる" : "政権としての判断を尊重する姿勢を示している") });
  } else {
    voices.push({ who:"与党内の受け止め", tone:"neu", text:"首相の方針に沿った判断として、おおむね好意的に受け止められている" });
  }
  const opps = PARTIES.filter(x=>x.id!==S.pmParty && x.id!=="other" && x.id!==excludePid && !partners.includes(x.id) && !govPartyIds().includes(x.id) && !isDormantParty(x.id) && ((S.hrSeats[x.id]||0)+(S.hcSeats[x.id]||0))>0);
  if(opps.length){
    const scored = opps.map(x=>({p:x, d:ideoDist(v, partyIdeo(x.id)), rel:(opt.eff&&opt.eff.rel&&opt.eff.rel[x.id])||0})).sort((a,b)=>(b.d + (b.rel<0?0.5:0)) - (a.d + (a.rel<0?0.5:0)));
    const o = scored[0];
    if(o){
      if(o.rel >= 2 || o.d <= 1.0) voices.push({ who:`${o.p.name}の反応`, tone:"pos", text:`「${field}では方向性が近い」として、珍しく評価する声が出ている` });
      else if(o.d >= 2.2 || o.rel <= -2) voices.push({ who:`${o.p.name}の反応`, tone:"neg", text:`「${field}への政権の姿勢は不十分だ」として、批判を強めている` });
      else voices.push({ who:`${o.p.name}の反応`, tone:"neu", text:"「内容を精査して対応を決める」として、静観の構えを見せている" });
    }
  }
  return voices;
}

function resolveNegotiate(choice){
  ensureGrowthFields();
  ensureApprovalFields();
  const ng = S.pendingNegotiate;
  if(!ng){ renderMain(); return; }
  const party = partyById(ng.partyId);
  const pname = party ? party.name : "野党";
  const ctx = ng.ctx;
  const p = POLICIES.find(x=>x.id===ctx.pid);
  const title = p ? p.title : "政策";
  S.pendingNegotiate = null;
  if(choice===1){
    addOppRel(ng.partyId, 6);
    S.policyLog.push({title:`${pname}の要求を呑み「${title}」を通す`, text:`ねじれ国会で、${pname}の条件を受け入れて「${title}」の成立にこぎ着けた。効果はやや弱まったが、同党との関係は改善した。`});
    completePolicyApplication(ctx, 0.65, `${pname}の要求を呑んだ分、政策の効果はやや弱まったが、ねじれ国会でも成立にこぎ着け、同党との関係は改善した。`, null);

    addOppRel(ng.partyId, 3);
    S.policyLog.push({title:`別の取引材料で${pname}の協力を取り付け`, text:`「${title}」の成立に向け、要求そのものではなく別の取引材料を提示して${pname}の協力を取り付けた。効果はほぼ維持できたが、財政が少し痛んだ。`});
    completePolicyApplication(ctx, 0.85, `別の取引材料を提示して${pname}の協力を取り付けた。効果はほぼ維持できたが、財政が少し痛んだ。`,
      { fisc:-2, fiscReason:"野党への取引材料として、取引に応じた財政負担が生じた" });

}
/* ---------------- 時間差政策（ストック型）の成熟処理 ----------------
   月末処理（endMonth）の中で、その月に dueTurn へ達した育成分を取り出して効果を適用し、
   ニュース待ちに積む。実際の新聞表示は世論調査の後（postCrisisCheck）で一度だけ行う */
/* 出生率の改善を適用する：少子化対策のストック政策が実を結んだときだけ呼ばれる。
   一定の改善幅（+0.01相当）に達したら、ニュース待ちに積んで支持率を押し上げる「ご褒美」にする。
   逆方向（悪化）では絶対に呼ばれない ― 悪化は endMonth の自然減で数字が静かに下がるだけ */
function applyBirthGain(gain){
  ensureBirthFields();
  S.birthRate = Math.round((S.birthRate + gain)*1000)/1000;
  if(S.birthRate - S.birthNewsMark >= 0.0095){
    const from = S.birthNewsMark, to = S.birthRate;
    const boost = (to - from) >= 0.0195 ? 3 : 2;
    applySegAll(boost);
    recordApproval(boost, `出生率の改善（${from.toFixed(2)}→${to.toFixed(2)}）が報じられ、少子化対策への評価が支持を押し上げた`);
    S.pendingBirthNews.push({ from:from, to:to, boost:boost });
    S.birthNewsMark = S.birthRate;
  }
}
function processStockMaturity(){
  ensureGrowthFields();
  ensureBirthFields();
  if(!S.stockPolicies.length) return;
  const due = S.stockPolicies.filter(sp=>sp.dueTurn <= S.turn);
  if(!due.length) return;
  S.stockPolicies = S.stockPolicies.filter(sp=>sp.dueTurn > S.turn);
  let birthGain = 0;
  due.forEach(sp=>{
    const snap = segSnap();
    applyEffects(sp.eff, null);
    const d = segDeltaSince(snap);
    if(Math.abs(d.avg) >= 0.2 || (sp.eff && sp.eff.econ)){
      recordApproval(Math.round(Math.max(d.avg, 0)*10)/10, `「${sp.title}」が実を結んだ`);
    }
    S.policyLog.push({title:`${sp.title}が実を結ぶ`, text:`かつて投資した「${sp.title}」の効果が表れた。${stockEffSummary(sp.eff)}。`});
    S.pendingStockNews.push({ title: sp.title, field: sp.field, summary: stockEffSummary(sp.eff) });
    if(sp.birth) birthGain += sp.birth;
  });
  if(birthGain > 0) applyBirthGain(birthGain);
}

/* ---------------- 野党側からの連立・協力の打診 ----------------
   少数与党・支持率の低迷・選挙接近のときに、野党側から「条件を飲むなら協力できる」
   という接近がまれに来る。受ける場合は既存の連立の仕組み（上限2党・条件・関係値）に乗せる */
function maybeIncomingOffer(){
  ensureApprovalFields();
  if(S.turn < 3) return false;
  if(S.turn === S.lastOfferCheckTurn) return false;
  S.lastOfferCheckTurn = S.turn;
  if(coalitionPartnerIds().length >= COALITION_MAX_PARTNERS) return false;
  if(S.turn - S.lastOfferTurn < 8) return false;
  const minority = totalGovHR() < Math.floor(HR_TOTAL/2)+1;
  const struggling = S.approval < 38;
  const electionNear = S.hrTermLeft <= 6 || S.hcTermLeft <= 4;
  if(!minority && !struggling && !electionNear) return false;
  if(Math.random() > (minority ? 0.16 : 0.11)) return false;
  const partners = coalitionPartnerIds();
  const cands = PARTIES.filter(x=>{
    if(x.id===S.pmParty || x.id==="other" || partners.includes(x.id) || isDormantParty(x.id)) return false;
    if(!coalitionInvitable(x)) return false;
    return coalitionDistTo(x.id) <= 3.4;
  });
  if(!cands.length) return false;
  cands.sort((a,b)=> (coalitionDistTo(a.id) - oppRelOf(a.id)*0.02) - (coalitionDistTo(b.id) - oppRelOf(b.id)*0.02));
  const party = cands[0];
  const t = coalitionOfferTerms(party.id);
  S.pendingOffer = { partyId: party.id, postDemand: t.postDemand,
    reason: minority ? "少数与党の政権運営が続く中" : (struggling ? "政権の支持率が低迷する中" : "選挙が近づく中") };
  S.lastOfferTurn = S.turn;
  renderIncomingOffer();
  return true;
}
function renderIncomingOffer(){
  ensureApprovalFields();
  const of = S.pendingOffer;
  if(!of){ renderMain(); return; }

  if(!party){ S.pendingOffer = null; renderMain(); return; }
  const cond = coalitionCondition(party.id);
  const need = Math.floor(HR_TOTAL/2)+1;
  const after = totalGovHR() + (S.hrSeats[party.id]||0);
  show(`
    <div class="newsflash mb"><div class="nf-k">永田町の動き</div><div class="nf-t">${esc(party.name)}から協力の打診</div></div>
    <div class="card">

      <div class="kv"><span>${esc(party.name)}との関係（これまでの好感度）</span><b>${oppRelOf(party.id)>0?"+" : ""}${Math.round(oppRelOf(party.id))}</b></div>

      <button class="btn ghost big mt" onclick="declineIncomingOffer()">今回は見送る</button>
    </div>
  `);
  setResume("offer", {partyId: of.partyId});

function acceptIncomingOffer(){
  ensureApprovalFields();
  const of = S.pendingOffer;
  if(!of){ renderMain(); return; }
  const party = partyById(of.partyId);
  S.pendingOffer = null;
  if(!party || coalitionPartnerIds().length >= COALITION_MAX_PARTNERS || coalitionPartnerIds().includes(of.partyId)){ renderMain(); return; }
  const cond = coalitionCondition(party.id);
  let rel = clamp(coalitionStability(party.id) + 6 + Math.round(oppRelOf(party.id)*0.2), 26, 94);
  coalitionPartnerIds().forEach(other=>{ rel -= Math.round(ideoDist(partyIdeo(other), partyIdeo(party.id))*2); });
  rel = clamp(rel - (of.postDemand||0)*2, 24, 94);
  const wasMinority = totalGovHR() < Math.floor(HR_TOTAL/2)+1;
  addCoalitionPartner(party.id, rel, S.turn);
  S.coalitionTerms[party.id] = {postDemand: of.postDemand||0, field: cond.field, label: cond.label, dueTurn: S.turn + 2, promiseLabel: cond.label, promiseTurn: S.turn};
  S.coalitionNextReview = S.turn + 3;
  const frame = coalitionPartnerIds().length>=2 ? coalitionSizeLabel(coalitionPartnerIds().length) : "";
  S.coalitionHist.push(`${S.year}年${S.month}月、${party.name}側からの打診を受けて連立に参加${coalitionFrameLabel(coalitionPartnerIds().length)}`);
  const gain = wasMinority && totalGovHR()>=Math.floor(HR_TOTAL/2)+1 ? 1.6 : 0.8;
  applySegAll(gain);
  recordApproval(gain, `${party.name}が連立に加わり、政権基盤が安定したとの見方が広がった`);
  S.policyLog.push({title:`${party.name}が連立に参加（相手側からの打診）`, text:`条件（${cond.label}${of.postDemand?`／閣僚ポスト${of.postDemand}つ`:""}）を受け入れ、${frame?frame:"連立の拡大"}が成立。与党の衆院議席は${totalGovHR()}議席になった。`});
  addOppRel(party.id, 10);
  showTVNews({
    band:"速報", kicker:"野党側からの打診が実る", title:`${esc(party.name)}が連立に参加`, sub: frame? `${frame}が成立 ― 相手側からの打診実る` : "打診を受けての連立拡大",
    body:`${esc(party.name)}側からの条件つきの打診を受け、${esc(S.pmName)}首相が連立参加を受け入れました。与党の衆院議席は${totalGovHR()}議席となり、${totalGovHR()>=Math.floor(HR_TOTAL/2)+1?"過半数を確保しました":"基盤は厚みを増しました"}。${esc(party.name)}は協力の条件として「${esc(cond.label)}」${of.postDemand?`と閣僚ポスト${of.postDemand}つの配分`:''}を求め、政府側が受け入れました。${of.postDemand?`ポストの調整は、近く行う内閣改造で焦点になります。`:""}相手からの接近を実らせた形ですが、政策の調整相手が増える分、政権の自由度は少し下がります。`,
    quoteWho:`${party.name}の幹部`, quote:"政策の一致を条件に、責任ある与党の一角として政権を支える",
    btn:"政権運営に戻る", fn:"renderMain()"
  });
}

      ・<b>国債依存度を40%以下（注意ゾーン）に収めるだけでも、ゆっくり回復する</b>：安全圏ほど速くはないが、注意ゾーンの編成でも編成の時点で少し回復し、その後も毎月わずかずつ（年あたり約+1）戻っていく。まずは危険ゾーンを脱出するだけでも立て直しは始まる。<br>
      ・<b>基礎的財政収支（プライマリーバランス）の赤字を小さくする</b>：借金と利払いを除いたその年の収支が改善する編成にすると上がる。黒字の年は回復幅がさらに大きくなる。<br>
      ・<b>財政コストの大きい政策を続けない</b>：支出の大きい選択が続くと下がり続ける。歳出の見直しや改革系の選択は上げる方向に働く。フォローアップで「見直して規模を縮小する」を選ぶのも効く。<br>
      ・<b>景気を良くして税収を増やす</b>：経済対策や成長投資で景気（経済の調子）が上向くと、税収が増えて国債依存度と基礎的財政収支が改善し、財政も立て直しやすくなる。<br>

      一度の予算で跳ね上がることはないが、安全圏の予算と月々の回復が積み重なれば、数年単位で着実に戻っていく。</p>
    </div>

function renderPool(from){
  poolBackTo = from || "main";

  POSTS.forEach(p=>{ const m = S.cabinet[p.id]; if(m && !m.civilian) servingMap[m.name] = p.name; });

  const groups = govPartyIds().map(pid=>{
    const members = ministerPoolAll().filter(m=>m.party===pid && m.name!==S.pmName);
    members.sort((a,b)=>{
      const sa = servingMap[a.name]?0:1, sb = servingMap[b.name]?0:1;
      if(sa!==sb) return sa-sb;
      const aa = isPoolAdded(a)?0:1, ab = isPoolAdded(b)?0:1;
      if(aa!==ab) return aa-ab;
      const pa = a.ped||0, pb = b.ped||0;
      if(pa!==pb) return pb-pa;
      return effSkill(b)-effSkill(a);
    });
    const p = partyById(pid);
    const role = pid===S.pmParty ? "自党" : "連立パートナー";
    return {pid, p, role, members};
  });
  const total = groups.reduce((s,g)=>s+g.members.length, 0);
  show(`
    <h2 class="section-title">大臣候補プール <small>組閣・内閣改造で選べる与党議員 全${total}人</small></h2>

    </div>
    ${groups.map(g=>`
      <h2 class="section-title"><span class="party-dot" style="background:${g.p?g.p.color:"#666"};display:inline-block;vertical-align:middle"></span> ${esc(g.p?g.p.name:g.pid)} <small>${g.role}／${g.members.length}人${g.p&&g.p.isNewParty?'／<span class="newparty-badge">新党</span>':""}</small></h2>
      <div class="pick-list mb">${g.members.map(m=>poolMemberHtml(m, servingMap[m.name])).join("") || '<p class="mini">候補がいません</p>'}</div>
    `).join("")}
    <button class="btn big mt" onclick="backFromPool()">${poolBackTo==="cabinet"?"組閣・内閣改造に戻る":(poolBackTo==="diet"?"国会勢力図に戻る":"政権運営に戻る")}</button>

  `);
}

const BUDGET_DEFAULTS = {welfare:36, public:6, defense:7.5, child:8.5, econ:5, science:4, local:15.5, disaster:3};
const BUDGET_OTHER_FIXED = 4.5; /* 国会運営・外交・予備費など、毎年ほぼ固定の経費（兆円） */
const BUDGET_OTHER_REV = 8.0;   /* 税金以外の歳入（手数料・国有財産収入など、兆円） */
function budgetField(id){ return BUDGET_FIELDS.find(f=>f.id===id); }
function fmtT(v){ const r = Math.round(v*10)/10; return (r%1===0 ? r.toFixed(0) : r.toFixed(1)) + "兆円"; }
function normalizeBudgetObject(raw, ver){
  const out = {};
  if(!raw || typeof raw!=="object"){ BUDGET_FIELDS.forEach(f=>{ out[f.id]=BUDGET_DEFAULTS[f.id]; }); return out; }
  if(ver===2){
    BUDGET_FIELDS.forEach(f=>{ const v = Number(raw[f.id]); out[f.id] = isFinite(v) ? clamp(Math.round(v*2)/2, f.min, f.max) : BUDGET_DEFAULTS[f.id]; });
    return out;
  }
  /* 旧形式（%配分）：各分野の比率を保ったまま、配分対象の総額85.5兆円に換算する */
  let tot = 0; BUDGET_FIELDS.forEach(f=>{ const v = Number(raw[f.id]); if(isFinite(v) && v>0) tot += v; });
  if(tot<=0){ BUDGET_FIELDS.forEach(f=>{ out[f.id]=BUDGET_DEFAULTS[f.id]; }); return out; }
  BUDGET_FIELDS.forEach(f=>{ const v = Number(raw[f.id]); const amt = isFinite(v)&&v>0 ? v/tot*85.5 : BUDGET_DEFAULTS[f.id]; out[f.id] = clamp(Math.round(amt*2)/2, f.min, f.max); });
  return out;
}
function ensureBudgetState(){
  if(!S) return;
  if(S.budget){ S.budget = normalizeBudgetObject(S.budget, S.budgetVer); S.budgetVer = 2; if(!S.budgetMetrics) S.budgetMetrics = budgetMetrics(S.budget); }
}
/* 予算の全体像を試算する。税収は景気（S.econ）で、国債費（借金の利払い・返済）は財政の健全さ（S.fisc）が低いほど重くなる前提 */
function budgetMetrics(draft){
  const disc = BUDGET_FIELDS.reduce((s,f)=>s+(Number(draft[f.id])||0),0);
  const fiscNow = S ? S.fisc : 46, econNow = S ? S.econ : 52;
  const debtService = Math.round((25.5 + Math.max(0, 45 - fiscNow)*0.05)*10)/10;
  const total = Math.round((disc + debtService + BUDGET_OTHER_FIXED)*10)/10;
  const tax = Math.round((67 + econNow*0.23)*10)/10; /* 税収は景気に敏感に連動させる（景気改善が財政の立て直しに届くように） */
  const revenue = Math.round((tax + BUDGET_OTHER_REV)*10)/10; /* 国債を除く歳入 */
  const bond = Math.round((total - revenue)*10)/10;           /* 不足分＝新規国債の発行額（マイナスなら剰余） */
  const dep = total>0 ? Math.max(0, bond)/total*100 : 0;      /* 国債依存度（%） */
  const pb = Math.round((revenue - (total - debtService))*10)/10; /* 基礎的財政収支：借金と利払いを除いた収支 */
  return {disc:Math.round(disc*10)/10, debtService, otherFixed:BUDGET_OTHER_FIXED, total, tax, otherRev:BUDGET_OTHER_REV, revenue, bond, dep:Math.round(dep*10)/10, pb};
}
function budgetZones(m){
  const depZone = m.dep<=30 ? "safe" : (m.dep<=40 ? "caution" : "danger");
  const pbZone = m.pb>=-3 ? "safe" : (m.pb>=-10 ? "caution" : "danger");
  const rank = {safe:0, caution:1, danger:2};
  const overall = rank[depZone]>=rank[pbZone] ? depZone : pbZone;
  return {depZone, pbZone, overall};
}
function zoneBadge(z){ return z==="safe" ? '<span class="zone safe">安全圏</span>' : z==="caution" ? '<span class="zone caution">注意</span>' : '<span class="zone danger">危険</span>'; }
function budgetBaseline(){ return S && S.budget ? normalizeBudgetObject(S.budget, S.budgetVer) : Object.assign({}, BUDGET_DEFAULTS); }
function budgetIdeoDot(f, partyId){
  const iv = partyIdeo(partyId);
  return (f.ideo.gov||0)*(iv.gov||0) + (f.ideo.hawk||0)*(iv.hawk||0);
}
/* 分野の増減に対する反応予測。confirmBudget の実際の効果計算（党内・連立・層別）と同じ材料から作るので、予測と結果が大きく食い違わない */
function budgetReactionHtml(f, draft){
  const base = budgetBaseline();
  const d = Math.round(((Number(draft[f.id])||0) - (base[f.id]||0))*10)/10;
  if(Math.abs(d) < 0.4) return `<b>みんなの反応（見込み）</b> 前年度並みの配分で、世論・党内・野党・連立とも大きな反応は見込まれない。`;
  const up = d > 0;
  const dir = up ? "増やす" : "減らす";
  /* 満足度の動きは confirmBudget の実際の計算とそろえる（防衛は高齢者へ弱め、防災は満足度への直接効果なし） */
  const segDelta = f.id==="defense" ? Math.round(d*0.15*10)/10 : Math.round(d*0.6*10)/10;
  const segLine = f.id==="disaster"
    ? `<span class="br-delta">満足度への直接の動きは小さい見込み（災害が起きたときの備えとして効く）</span>`
    : `<span class="br-delta ${segDelta>=0?"up":"down"}">${esc(f.segName)}の満足度は ${segDelta>=0?"+":""}${segDelta}pt 程度動く見込み</span>`;
  const opp = PARTIES.filter(p=>!govPartyIds().includes(p.id) && p.id!=="other").sort((a,b)=>(S.hrSeats[b.id]||0)-(S.hrSeats[a.id]||0))[0];
  const pub = up ? f.pubUp : f.pubDown;
  const oppTxt = (up ? f.oppUp : f.oppDown);
  const dotP = budgetIdeoDot(f, S.pmParty);
  let intra;
  if(up) intra = dotP>=0.5 ? "自党の立ち位置に沿う増額で、党内では歓迎が優勢" : dotP<=-0.5 ? "自党の考え方（財政・安保観）とずれる増額で、党内に慎重論が出る" : "党内で大きな異論は出にくい";
  else intra = dotP>=0.5 ? "自党が重視する分野の削減で、党内から反発が出る" : dotP<=-0.5 ? "自党の考え方に沿う削減で、党内では理解が広がりやすい" : "党内で大きな異論は出にくい";
  let coalTxt;
  if(!S.coalition) coalTxt = "連立相手はいないため、調整は不要";
  else{
    coalTxt = coalitionPartnerIds().map(pid=>{
      const cp = partyById(pid);
      const cond = coalitionCondition(pid);
      const condMap = {child:"child", welfare:"welfare", defense:"defense", local:"local"};
      if(condMap[cond.field]===f.id){
        return up ? `連立の${cp.name}は協力の条件（${cond.label}）に沿うため歓迎し、関係は安定寄り` : `連立の${cp.name}は協力の条件（${cond.label}）に関わる削減に反発し、関係が悪化する恐れ`;
      }
      const dotC = budgetIdeoDot(f, pid);
      return (up ? (dotC>=0.5 ? `連立の${cp.name}の立ち位置にも近く、理解を得やすい` : dotC<=-0.5 ? `連立の${cp.name}の立ち位置とはずれるため、説明と調整が必要` : `連立の${cp.name}とは大きな対立にはなりにくい`)
                     : (dotC>=0.5 ? `連立の${cp.name}が重視する分野の削減で、不満が出る恐れ` : `連立の${cp.name}とは大きな対立にはなりにくい`));
    }).join("／");
  }
  return `<b>みんなの反応（見込み）</b> ${esc(pub)}。<br><b>党内</b> ${esc(intra)}。<br><b>野党</b> ${esc(oppTxt)}。<br><b>連立</b> ${esc(coalTxt)}。<br>${segLine} <span class="tiny">（${esc(f.name)}を${Math.abs(d).toFixed(1)}兆円${dir}前提）</span>`;
}
function budgetSummaryHtml(draft){
  const m = budgetMetrics(draft);

  const prevM = budgetMetrics(budgetBaseline());
  const dTotal = Math.round((m.total - prevM.total)*10)/10;

  const depPct = clamp(m.dep/50*100, 0, 100);

    ? `<b>判定：安全圏。</b> 国債への頼り方は落ち着いた水準で、財政の健全さは回復に向かう見込み（編成時の回復に加え、この予算が続く間は毎月少しずつも回復する）。この調子なら将来の政策の自由度も保ちやすい。`

    : `<b>判定：危険ゾーン。</b> このまま決定すると、国債の発行が膨らんで市場の警戒を招き、金利の上昇や支持率への悪影響が出る恐れがある。財政の健全さも大きく下がる見込み。`;

      <div class="bsum-cell"><div class="k">国債費（過去の借金の利払い・返済で固定）</div><div class="v">${fmtT(m.debtService)}</div><div class="tiny">財政が悪化するほど利払いが重くなり、この額は膨らむ</div></div>
      <div class="bsum-cell"><div class="k">国債依存度（歳出のうち借金でまかなう割合）${zoneBadge(z.depZone)}</div><div class="v">${m.dep.toFixed(1)}<small> %</small></div><div class="tiny">30%以下が安全圏 ／ 40%を超えると危険</div></div>
      <div class="bsum-cell"><div class="k">基礎的財政収支（プライマリーバランス）${zoneBadge(z.pbZone)}</div><div class="v" style="color:${m.pb< -10?"var(--red)":"var(--navy)"}">${m.pb>=0?"＋":"−"}${fmtT(Math.abs(m.pb))}</div><div class="tiny">借金と利払いを除いた収支。−3兆円以内が安全圏 ／ −10兆円を下回ると危険</div></div>
    </div>

      ・<b>歳入</b>は「入ってくるお金」。中心は税収で、景気が良い年ほど増えます。<br>
      ・歳出が歳入を上回った分は<b>国債（国の借金）</b>を発行してまかないます。借金そのものが即アウトではありませんが、頼りすぎると利払いが膨らみ、将来使えるお金が減っていきます。<br>
      ・<b>国債依存度</b>は「歳出のうち借金でまかなう割合」。30%以下が安全圏、40%を超えると危険です。<br>
      ・<b>基礎的財政収支（プライマリーバランス）</b>は「借金と利払いを除いた、その年の収支」。マイナスが大きいほど、その年も借金が増え続けているという意味です。<br>
      スライダーを動かすと、下の試算と各分野の「みんなの反応（見込み）」がその場で変わります。決める前に結果が見えるので、数字と相談しながら配分してください。

function refreshBudgetPreview(changedId){
  const sum = document.getElementById("budgetSummary");
  if(sum) sum.innerHTML = budgetSummaryHtml(budgetDraft);
  const t = document.getElementById("budgetTotal");
  if(t) t.textContent = fmtT(budgetTotalNow());
  const base = budgetBaseline();
  BUDGET_FIELDS.forEach(f=>{
    const bv = document.getElementById("bv-"+f.id);
    if(bv) bv.textContent = `${fmtT(budgetDraft[f.id])}（全体の${(budgetDraft[f.id]/budgetTotalNow()*100).toFixed(1)}%）`;
    const bd = document.getElementById("bd-"+f.id);
    if(bd){ const d = Math.round((budgetDraft[f.id]-base[f.id])*10)/10; bd.textContent = d!==0 ? `（${d>0?"+":""}${d.toFixed(1)}兆円）` : "（±0）"; bd.className = "br-delta " + (d>0?"up":(d<0?"down":"")); }
  });
  if(changedId){
    const r = document.getElementById("react-"+changedId);

function setBudget(id, v){

function confirmBudget(){
  ensureBudgetState();
  ensureApprovalFields();
  const _segSnapBudget = segSnap();
  const prev = budgetBaseline();
  const prevM = budgetMetrics(prev);
  pushUndo("budget", "予算配分", {draft: deepCopy(budgetDraft)});
  const m = budgetMetrics(budgetDraft);
  const z = budgetZones(m);
  S.budget = Object.assign({}, budgetDraft);
  S.budgetVer = 2;
  S.budgetMetrics = m;
  S.budgetDone = true;
  let notes = [];
  let partyDelta = 0; const coalDeltas = {};
  BUDGET_FIELDS.forEach(f=>{
    const d = Math.round(((S.budget[f.id]||0) - (prev[f.id]||0))*10)/10;
    if(d===0) return;
    if(f.seg){ S.seg[f.seg] = clamp(S.seg[f.seg] + d*0.6, 3, 97); }
    if(f.id==="econ") S.econ = clamp(S.econ + d*0.5, 5, 97);
    if(f.id==="science") S.econ = clamp(S.econ + d*0.3, 5, 97);
    if(f.id==="defense"){ S.seg.elderly = clamp(S.seg.elderly + d*0.15, 3, 97); }
    partyDelta += clamp(d * budgetIdeoDot(f, S.pmParty) * 0.8, -3, 3);
    coalitionPartnerIds().forEach(pid=>{
      const cond = coalitionCondition(pid);
      const condMap = {child:"child", welfare:"welfare", defense:"defense", local:"local"};
      if(condMap[cond.field]===f.id) coalDeltas[pid] = (coalDeltas[pid]||0) + clamp(d*1.2, -5, 5);
      else coalDeltas[pid] = (coalDeltas[pid]||0) + clamp(d * budgetIdeoDot(f, pid) * 0.7, -3, 3);
    });
  });
  if(partyDelta) S.partyRel = clamp(S.partyRel + clamp(partyDelta, -6, 6), 0, 100);
  Object.keys(coalDeltas).forEach(pid=>{ if(coalDeltas[pid]) addCoalitionRel(pid, clamp(coalDeltas[pid], -7, 7)); });
  /* 財政への影響：国債依存度と基礎的財政収支が前年度の編成からどう動いたかで決める。危険ゾーンは追加のペナルティ */
  let fiscDelta = clamp((prevM.dep - m.dep)*0.22 + (m.pb - prevM.pb)*0.15, -6, 5); /* 下げ側の係数・下限は緩和済み（危機的に落ちるまでの猶予を広げる）。上げ側は据え置き */
  if(z.overall==="danger"){
    fiscDelta -= 2;
    S.econ = clamp(S.econ - 2, 5, 97);
    S.infl = clamp(S.infl - 3, 5, 97);
    applySegAll(-1.5);
    S.partyRel = clamp(S.partyRel - 2, 0, 100);
    notes.push(`国債依存度${m.dep.toFixed(1)}%の危険ゾーンの予算に、市場が警戒感を示した（金利が上昇し、財政・景気・支持に悪影響）`);
  } else if(m.dep > 35){
    fiscDelta -= 0.5;
    applySegAll(-0.5);
    notes.push(`国債依存度${m.dep.toFixed(1)}%と高めの編成に、財政規律を問う声が上がった`);
  } else if(z.overall==="safe"){
    notes.push(`国債依存度${m.dep.toFixed(1)}%・基礎的財政収支${m.pb>=0?"＋":"−"}${fmtT(Math.abs(m.pb))}と安全圏の編成で、財政の健全さが回復した（国債依存度が安全圏の編成は${(S.fiscSoundStreak||0)+1}年連続になる）`);
  } else {
    notes.push(`国債依存度${m.dep.toFixed(1)}%・基礎的財政収支−${fmtT(Math.abs(m.pb))}の注意ゾーンの編成となった`);
  }
  /* 安全圏の編成そのものへの評価：前年との差分だけでは「良い予算を続ける」ことが報われないため、
     国債依存度が安全ゾーンの年は絶対評価として回復を上乗せし、連続するほど少しずつ積み上がるようにする。
     判定は国債依存度に紐づける（基礎的財政収支の単年のブレで立て直しが止まらないように） */
  ensureFiscFields();
  if(z.depZone==="safe"){
    S.fiscSoundStreak = (S.fiscSoundStreak||0) + 1;
    fiscDelta += 3 + Math.min(3, (S.fiscSoundStreak-1)*0.5); /* 1年目+3、続けるほど最大+6 */
    if(m.pb >= 0) fiscDelta += 1.5; /* 基礎的財政収支が黒字の年はさらに評価する */
  } else if(z.depZone==="caution"){
    /* 注意ゾーンでも編成の時点で少し回復させる。安全圏まで締めないと一切戻らない設計だと、
       中途半端な緊縮が報われず立て直しが詰まるため */
    S.fiscSoundStreak = 0;
    fiscDelta += 1;
  } else {
    S.fiscSoundStreak = 0;
  }
  fiscDelta = clamp(fiscDelta, -7, 9); /* 1回の編成で財政が極端に振れないよう上限を設ける（下げ側は-7までに緩和、回復側は+9まで） */
  const _fiscBeforeBudget = S.fisc;
  S.fisc = clamp(S.fisc + fiscDelta, 3, 97);
  recordFisc(S.fisc - _fiscBeforeBudget, S.fisc < _fiscBeforeBudget
    ? `${S.year}年度予算の編成で低下。国債依存度${m.dep.toFixed(1)}%（${z.overall==="safe"?"安全圏":z.overall==="caution"?"注意ゾーン":"危険ゾーン"}）・基礎的財政収支${m.pb>=0?"＋":"−"}${fmtT(Math.abs(m.pb))}と、借金への依存が高まった`
    : `${S.year}年度予算の編成で改善。国債依存度${m.dep.toFixed(1)}%（${z.overall==="safe"?"安全圏":z.overall==="caution"?"注意ゾーン":"危険ゾーン"}）・基礎的財政収支${m.pb>=0?"＋":"−"}${fmtT(Math.abs(m.pb))}と、借金への依存を抑えた`);
  const top2 = BUDGET_FIELDS.slice().sort((a,b)=>S.budget[b.id]-S.budget[a.id]).slice(0,2);
  S.policyLog.push({title:`${S.year}年度予算を決定`, text:`歳出総額${fmtT(m.total)}、国債発行${m.bond>0?fmtT(m.bond):"なし"}（依存度${m.dep.toFixed(1)}%、${z.overall==="safe"?"安全圏":z.overall==="caution"?"注意ゾーン":"危険ゾーン"}）。配分の柱：${top2.map(f=>f.name).join("・")}。${notes.join("。")}`});
  const _segDeltaBudgetDec = segDeltaSince(_segSnapBudget);
  if(Math.abs(_segDeltaBudgetDec.avg) >= 0.3){
    recordApproval(_segDeltaBudgetDec.avg, _segDeltaBudgetDec.avg > 0
      ? `${S.year}年度予算の配分（柱は${top2.map(f=>f.name).join("・")}）が、恩恵を受ける層に評価された`
      : `${S.year}年度予算の編成に、市場の警戒や削られた分野の層から反発が出た`);
  }
  setResume("main", {});
  showPaper({
    kicker:"速報", title:`${S.year}年度予算が成立へ`, sub: z.overall==="danger" ? "国債依存度の高さに懸念広がる" : "配分の重点は " + top2[0].name,
    body:`政府は${S.year}年度予算を決定した。歳出総額は${fmtT(m.total)}で、社会保障${fmtT(S.budget.welfare)}、地方${fmtT(S.budget.local)}、子育て・教育${fmtT(S.budget.child)}、防衛${fmtT(S.budget.defense)}など。
    税収などの歳入${fmtT(m.revenue)}では足りず、国債を${m.bond>0?fmtT(m.bond):"発行せず"}まかなう。国債依存度は${m.dep.toFixed(1)}%（${z.overall==="safe"?"安全圏":z.overall==="caution"?"注意ゾーン":"危険ゾーン"}）、基礎的財政収支は${m.pb>=0?"＋":"−"}${fmtT(Math.abs(m.pb))}の見込みだ。
    ${notes.join("。")}。
    ${S.twisted?"ただし参院はねじれ国会のため、審議の行方には不透明感が残る。":""}`,
    btn:"政権運営に戻る", fn:"renderMain()"
  });
}

/* ---------------- 補正予算（発足直後・1回だけ） ----------------
   年度予算は毎年4月だけなので、発足時期によっては最初の予算決定まで数か月待つことになる。
   現実の新内閣が発足直後に補正予算や経済対策を打つことに倣い、組閣直後に1回だけ、
   年度予算より小ぶり（数兆円〜十数兆円規模）な追加歳出パッケージを編成できるようにする。
   画面の作り（実額ベースの試算・危険ゾーン・反応予測・「予算の見方」ガイド）は年度予算とそろえる。
   効果は年度予算と同じ材料（分野別の層別満足度・党内/連立のイデオロギー距離・連立の協力条件）で計算し、
   財政の健全さの変動は recordFisc で理由つきで記録する。初期値46そのものは変更しない。 */
const SUPP_MODES = [
  {id:"stimulus", name:"景気対策に振る", total:12, cap:18, bondRatio:1.0, extraSaving:0, econBase:2.2,
   desc:"追加歳出は全額を国債でまかなう大型の経済対策。景気と支持への効き目は大きいが、財政の健全さは目に見えて下がる。"},
  {id:"balanced", name:"バランス型", total:7, cap:12, bondRatio:0.6, extraSaving:0, econBase:1.1,
   desc:"国債は6割にとどめ、残りは既存予算の見直しと予備費でまかなう。景気の下支えと財政への配慮を両立させる無難な組み立て。"},
  {id:"sound", name:"財政健全化に寄せる", total:3, cap:6, bondRatio:0.25, extraSaving:3, econBase:0,
   desc:"追加歳出は重点分野だけに絞り、あわせて既存歳出の見直し（削減）も進める。目立たないが、財政の健全さははっきり改善する。"},
];
function suppModeDef(id){ return SUPP_MODES.find(m=>m.id===id) || SUPP_MODES[1]; }
function suppCap(modeId){ return suppModeDef(modeId).cap || 18; }
const SUPP_DEFAULTS = {
  stimulus:{welfare:1.5, public:2, defense:0.5, child:2, econ:3, science:1, local:1.5, disaster:0.5},
  balanced:{welfare:1, public:1, defense:0.5, child:1.5, econ:1.5, science:0.5, local:0.5, disaster:0.5},
  sound:{welfare:0.5, public:0, defense:0, child:1, econ:0.5, science:0.5, local:0, disaster:0.5},
};
function suppDefaults(modeId){ return Object.assign({}, SUPP_DEFAULTS[modeId] || SUPP_DEFAULTS.balanced); }
function suppTotalOf(draft){
  if(!draft) return 0;
  return Math.round(BUDGET_FIELDS.reduce((s,f)=>s+(Number(draft[f.id])||0),0)*10)/10;
}
/* 合計が方向性ごとの上限（cap）を超えないよう抑える。分野ごとの上限6兆円に加え、
   合計が上限を超える場合は大きい分野から0.5兆円ずつ削って上限以内に収める。
   計算（suppMetrics）・決定処理・復元処理・UI（setSupp）のすべてがこの関数を通るので、
   通常操作でも旧データの読み込みでも上限を超える補正予算は作れない。 */
function capSuppDraft(draft, modeId){
  const cap = suppCap(modeId);
  const out = {};
  BUDGET_FIELDS.forEach(f=>{ const v = draft ? Number(draft[f.id]) : NaN; out[f.id] = isFinite(v) ? clamp(Math.round(v*2)/2, 0, 6) : 0; });
  let total = suppTotalOf(out);
  let guard = 0;
  while(total > cap + 1e-9 && guard < 200){
    guard++;
    let big = null;
    BUDGET_FIELDS.forEach(f=>{ if(out[f.id] > 0 && (!big || out[f.id] > out[big.id])) big = f; });
    if(!big) break;
    out[big.id] = Math.round((out[big.id] - 0.5)*10)/10;
    total = Math.round((total - 0.5)*10)/10;
  }
  return out;
}
function normalizeSuppDraft(raw, modeId){
  const mid = modeId || (typeof suppMode !== "undefined" && suppMode ? suppMode : "balanced");
  return capSuppDraft(raw, mid);
}
function suppCapNoteText(){
  const m = suppMetrics();
  const cap = suppCap(suppMode);
  const remain = Math.round((cap - m.allocated)*10)/10;
  return remain <= 0
    ? `上限（${fmtT(cap)}）に達しています。これ以上増やすには、他の分野を減らしてください。`
    : `上限は${fmtT(cap)}です。あと${fmtT(remain)}まで配分できます。`;
}
function ensureSuppFields(){
  if(!S) return;
  /* 旧セーブ（補正予算より前）は resumeGame 側で suppPending=false に倒してあるので、ここでは形だけそろえる */
  if(typeof S.suppDone!=="boolean") S.suppDone = false;
  if(typeof S.suppPending!=="boolean") S.suppPending = false;
  if(S.suppBudget===undefined) S.suppBudget = null;
}
let suppDraft = null;
let suppMode = "balanced";
/* 試算：追加歳出の合計、財源の内訳（新規国債／見直し・予備費）、健全化型の追加の歳出見直しを差し引いた実質の財政負担、
   そして年間の国債依存度が補正後にどうなるか（年度予算の試算に上乗せして見せる） */
function suppMetrics(){
  const mode = suppModeDef(suppMode);
  /* 計算側でも上限を強制する：上限を超えた下書きが万一入ってきても、試算は上限以内で返す */
  const draft = capSuppDraft(suppDraft || suppDefaults(suppMode), mode.id);
  const allocated = suppTotalOf(draft);
  const bond = Math.round(allocated * mode.bondRatio * 10)/10;
  const review = Math.round((allocated - bond)*10)/10;
  const netBond = Math.round((bond - mode.extraSaving)*10)/10; /* マイナスなら実質は財政改善。財政の健全さへの影響（fiscDelta）の材料であり、ゾーン判定には使わない */
  const baseM = budgetMetrics(budgetBaseline());
  const depAfter = (baseM.total + allocated) > 0 ? Math.round(Math.max(0, baseM.bond + netBond) / (baseM.total + allocated) * 1000)/10 : 0;
  const fiscDelta = clamp(Math.round((-netBond * 0.35 + (mode.id==="sound" ? 3 : 0)) * 10)/10, -5, 5); /* 下げ側は緩和済み（係数0.45→0.35、下限-6→-5）。健全化型の+3は据え置き */
  /* ゾーン判定は年度予算・「予算の見方」ガイドと統一し、国債依存度（補正後）だけで決める：
     30%以下＝安全圏／30%超〜40%以下＝注意／40%超＝危険。追加発行額（netBond）では判定しない */
  const zone = depAfter <= 30 ? "safe" : (depAfter <= 40 ? "caution" : "danger");
  return {allocated, bond, review, extraSaving: mode.extraSaving, netBond, baseDep: baseM.dep, depAfter, fiscDelta, zone, cap: mode.cap, remain: Math.round((mode.cap - allocated)*10)/10, draft};
}
function suppSummaryHtml(){
  const m = suppMetrics();
  const mode = suppModeDef(suppMode);
  const verdict = m.zone==="safe"
    ? `<b>判定：安全圏（国債依存度 ${m.depAfter.toFixed(1)}%）。</b> 年度予算と同じものさしで、依存度30%以下は安全圏。財政の健全さへの影響は ${m.fiscDelta>=0?"+":""}${m.fiscDelta} 程度の見込み${m.netBond<0?"で、歳出見直しが発行分を上回るため、むしろ健全さは改善する":"で、悪影響は限定的だ"}。`
    : m.zone==="caution"
    ? `<b>判定：注意ゾーン（国債依存度 ${m.depAfter.toFixed(1)}%）。</b> 年度予算と同じものさしで、依存度が30%を超え40%以下なら注意ゾーン。国債の追加発行で財政の健全さは ${m.fiscDelta>=0?"+":""}${m.fiscDelta} 程度動く見込み。景気や支持への効果との釣り合いを見て判断したい。`
    : `<b>判定：危険ゾーン（国債依存度 ${m.depAfter.toFixed(1)}%）。</b> 年度予算と同じものさしで、依存度が40%を超えると危険ゾーン。財政の健全さは ${m.fiscDelta>=0?"+":""}${m.fiscDelta} 程度動く見込みで、市場の警戒や、将来の予算の自由度を削る点には覚悟がいる。`;
  return `
    <div class="bsum-grid">

function suppReactionHtml(f){
  const v = suppDraft ? (Number(suppDraft[f.id])||0) : 0;
  if(v < 0.25) return `<b>みんなの反応（見込み）</b> この分野への重点配分はなし。関係する層や連立相手からの反応は見込まれない。`;
  const segDelta = f.id==="defense" ? Math.round(v*0.15*10)/10 : Math.round(v*0.55*10)/10;
  const segLine = f.id==="disaster"
    ? `<span class="br-delta">満足度への直接の動きは小さい見込み（災害が起きたときの備えとして効く）</span>`
    : `<span class="br-delta up">${esc(f.segName)}の満足度は +${segDelta}pt 程度上がる見込み</span>`;
  const dotP = budgetIdeoDot(f, S.pmParty);
  const intra = dotP>=0.5 ? "自党の立ち位置に沿う配分で、党内では歓迎が優勢" : dotP<=-0.5 ? "自党の考え方とはずれる配分で、党内に慎重論も出る" : "党内で大きな異論は出にくい";
  let coalTxt;
  if(!S.coalition) coalTxt = "連立相手はいないため、調整は不要";
  else{
    coalTxt = coalitionPartnerIds().map(pid=>{
      const cp = partyById(pid);
      const cond = coalitionCondition(pid);
      const condMap = {child:"child", welfare:"welfare", defense:"defense", local:"local"};
      if(condMap[cond.field]===f.id) return `連立の${cp.name}は協力の条件（${cond.label}）に沿うため歓迎し、関係は安定寄り`;
      const dotC = budgetIdeoDot(f, pid);
      return dotC>=0.5 ? `連立の${cp.name}の立ち位置にも近く、理解を得やすい` : dotC<=-0.5 ? `連立の${cp.name}の立ち位置とはずれるため、説明と調整が必要` : `連立の${cp.name}とは大きな対立にはなりにくい`;
    }).join("／");
  }
  return `<b>みんなの反応（見込み）</b> ${esc(f.pubUp)}。<br><b>党内</b> ${esc(intra)}。<br><b>野党</b> ${esc(f.oppUp)}。<br><b>連立</b> ${esc(coalTxt)}。<br>${segLine} <span class="tiny">（${esc(f.name)}に${v.toFixed(1)}兆円を重点配分する前提）</span>`;
}

function refreshSuppPreview(changedId){

  });

function setSupp(id, v){
  if(!suppDraft) suppDraft = suppDefaults(suppMode);
  let req = parseFloat(v);
  if(!isFinite(req)) req = 0;
  req = clamp(Math.round(req*2)/2, 0, 6);
  /* 合計が方向性の上限を超える分は受け付けない：この分野に回せるのは「上限 − 他分野の合計」まで */
  const cap = suppCap(suppMode);
  const others = Math.round(BUDGET_FIELDS.reduce((s,f)=>s + (f.id===id ? 0 : (Number(suppDraft[f.id])||0)), 0)*10)/10;
  const maxForThis = Math.max(0, Math.floor((cap - others)*2)/2);
  suppDraft[id] = Math.min(req, maxForThis);
  if(suppTotalOf(suppDraft) > cap) suppDraft = capSuppDraft(suppDraft, suppMode); /* 念のための最終ガード */
  refreshSuppPreview(id);
}

function confirmSuppBudget(){
  ensureSuppFields();
  ensureApprovalFields();
  const _segSnapSupp = segSnap();
  if(S.suppDone) { renderMain(); return; }
  suppDraft = normalizeSuppDraft(suppDraft, suppMode);
  const m = suppMetrics();
  const mode = suppModeDef(suppMode);
  pushUndo("suppBudget", "補正予算", {draft: deepCopy(suppDraft), mode: suppMode});
  if(m.allocated <= 0){ alertInPage("重点分野への配分がすべて0です。配分するか、「今回は補正予算を組まない」を選んでください"); return; }
  /* 分野別の効果：年度予算と同じ材料で、層別満足度・景気・党内・連立に効かせる */
  let partyDelta = 0; const coalDeltas = {};
  BUDGET_FIELDS.forEach(f=>{
    const d = Number(suppDraft[f.id])||0;
    if(!d) return;
    if(f.seg){ S.seg[f.seg] = clamp(S.seg[f.seg] + d*0.55, 3, 97); }
    if(f.id==="econ") S.econ = clamp(S.econ + d*0.55, 5, 97);
    if(f.id==="science") S.econ = clamp(S.econ + d*0.3, 5, 97);
    if(f.id==="defense"){ S.seg.elderly = clamp(S.seg.elderly + d*0.15, 3, 97); }
    partyDelta += clamp(d * budgetIdeoDot(f, S.pmParty) * 0.8, -3, 3);
    coalitionPartnerIds().forEach(pid=>{
      const cond = coalitionCondition(pid);
      const condMap = {child:"child", welfare:"welfare", defense:"defense", local:"local"};
      if(condMap[cond.field]===f.id) coalDeltas[pid] = (coalDeltas[pid]||0) + clamp(d*1.2, -5, 5);
      else coalDeltas[pid] = (coalDeltas[pid]||0) + clamp(d * budgetIdeoDot(f, pid) * 0.7, -3, 3);
    });
  });
  if(mode.econBase) S.econ = clamp(S.econ + mode.econBase, 5, 97);
  if(m.zone==="danger"){ /* zoneは国債依存度ベース（40%超）で判定済み。年度予算の危険ゾーンと同じ扱い */
    S.infl = clamp(S.infl - 2, 5, 97);
    applySegAll(-1);
  } else if(mode.id==="stimulus"){
    applySegAll(0.8);
  } else if(mode.id==="sound"){
    applySegAll(-0.4); /* 目立たない組み立てなので、支持への追い風は小さい */
  }
  if(partyDelta) S.partyRel = clamp(S.partyRel + clamp(partyDelta, -6, 6), 0, 100);
  Object.keys(coalDeltas).forEach(pid=>{ if(coalDeltas[pid]) addCoalitionRel(pid, clamp(coalDeltas[pid], -7, 7)); });
  /* 財政の健全さ：実質の財政負担（国債発行−歳出見直し）から決め、理由つきで財政ログに残す */
  const fiscBefore = S.fisc;
  S.fisc = clamp(S.fisc + m.fiscDelta, 3, 97);
  const fiscApplied = Math.round((S.fisc - fiscBefore)*10)/10;
  recordFisc(fiscApplied, fiscApplied < 0
    ? `発足直後の補正予算（${mode.name}）で低下。追加歳出${fmtT(m.allocated)}のうち国債${fmtT(m.bond)}を新規発行し、年間の国債依存度は${m.depAfter.toFixed(1)}%に上がる見込み`
    : `発足直後の補正予算（${mode.name}）で改善。追加歳出${fmtT(m.allocated)}に対し国債の発行を${fmtT(m.bond)}に抑え${m.extraSaving?`、既存歳出の見直し${fmtT(m.extraSaving)}も進めた`:"、既存予算の見直しでまかなった"}`);
  S.suppBudget = {mode: suppMode, modeName: mode.name, alloc: Object.assign({}, suppDraft), total: m.allocated, bond: m.bond, netBond: m.netBond, depAfter: m.depAfter, fiscDelta: fiscApplied, when: `${S.year}年${S.month}月`};
  S.suppDone = true;
  S.suppPending = false;
  const top2 = BUDGET_FIELDS.slice().sort((a,b)=>(suppDraft[b.id]||0)-(suppDraft[a.id]||0)).filter(f=>(suppDraft[f.id]||0)>0).slice(0,2);
  S.policyLog.push({title:"発足直後の補正予算を決定", text:`方向性は「${mode.name}」。追加歳出${fmtT(m.allocated)}（新規国債${fmtT(m.bond)}）、重点は${top2.length?top2.map(f=>f.name).join("・"):"なし"}。財政の健全さは${fiscApplied>=0?"+":""}${fiscApplied}、経済の調子は${Math.round(S.econ)}になった。`});
  const _segDeltaSupp = segDeltaSince(_segSnapSupp);
  if(Math.abs(_segDeltaSupp.avg) >= 0.3){
    recordApproval(_segDeltaSupp.avg, _segDeltaSupp.avg > 0
      ? `発足直後の補正予算（${mode.name}）が、重点分野の層に評価された`
      : `発足直後の補正予算（${mode.name}）の組み立てに、反発や物足りなさの声が出た`);
  }
  recalcApproval();
  setResume("main", {});
  saveGame();
  showPaper({
    kicker:"速報", title:"補正予算が成立へ", sub: `発足直後の経済対策 ― 方向性は「${esc(mode.name)}」`,
    body:`${esc(S.pmName)}内閣は発足直後の補正予算（経済対策）を決定した。追加歳出は${fmtT(m.allocated)}で、重点は${top2.length?top2.map(f=>esc(f.name)).join("・"):"幅広い分野"}。
    財源は新規の国債発行${fmtT(m.bond)}と、既存予算の見直し・予備費${fmtT(m.review)}${m.extraSaving?`、さらに既存歳出の見直し${fmtT(m.extraSaving)}`:''}でまかなう。年間の国債依存度は${m.baseDep.toFixed(1)}%から${m.depAfter.toFixed(1)}%になる見込みだ。
    ${mode.id==="stimulus" ? "大型の景気対策に経済界と対象分野は歓迎の声を上げた一方、財政の健全さは目に見えて下がり、財政規律を問う声も出ている。" : mode.id==="sound" ? "派手さはないが、財政の健全さは改善した。野党からは「対策が小さい」との指摘も出たが、政権は「持続可能な組み立てだ」と説明している。" : "景気の下支えと財政への配慮を両立させた組み立てに、与野党双方から一定の理解が示された。財政の健全さへの影響は小さい。"}
    内閣支持率は${S.approval}%となった。次の予算編成は、年度予算を決める4月になる。`,
    btn:"政権運営を始める", fn:"renderMain()"

/* ---------------- 政策フェーズ ---------------- */
let policyChoices = [];
/* 実施済み政策の状態をそろえる。旧セーブ・旧スナップショットでは不足するので、
   policiesDone の記録から「どの政策を・どう決めたか」を復元して実施済み扱いにする */
function normalizePolicyState(){
  if(!S) return;
  S.usedVariants = S.usedVariants || {};
  S.policyEstablished = S.policyEstablished || {};
  if(!Array.isArray(S.policyHistory)) S.policyHistory = [];
  (S.policiesDone||[]).forEach(d=>{
    if(!d || d.followup) return;
    const p = POLICIES.find(x=>x.title===d.title);
    if(!p || p.stages || S.policyEstablished[p.id]) return;
    /* 方向転換した政策は復元しない：直近の政策履歴が「方向転換」なら、実施済み扱いは解除されたままにする */
    const hist = S.policyHistory.filter(h=>h && h.pid===p.id);
    if(hist.length && hist[hist.length-1].action==="pivot") return;
    let found = null, foundIdx = 0;
    const sets = [{opts:p.opts}].concat(p.alts||[]);
    for(const st of sets){
      const oi = (st.opts||[]).findIndex(o=>o.label===d.choice);
      if(oi>=0){ found = st.opts[oi]; foundIdx = oi; break; }
    }
    S.policyEstablished[p.id] = {
      label: d.choice,
      eff: found ? deepCopy(found.eff||{}) : {},
      cost: found ? (found.cost||0) : 0,
      needPost: found ? (found.needPost || (found.eff && found.eff.needPost) || p.needPost || null) : (p.needPost||null),
      ideo: found ? getOptIdeo(p, found, foundIdx) : {cons:0,hawk:0,gov:0},

/* 初回判断として出せる政策。実施済みの政策は二度と「初めての判断」としては出さない */
function initialPolicyPool(){
  normalizePolicyState();
  return POLICIES.filter(p=>{
    if(p.id==="tariff" && S.tariffDone) return false; /* 関税交渉は合意で終了。通常候補には出ない */
    if(S.policyEstablished[p.id]) return false; /* 実施済み：再登場はフォローアップ判断としてのみ */
    if(p.stages) return !(S.usedPolicies[p.id]!=null && S.turn - S.usedPolicies[p.id] < 14);
    return !(S.usedPolicies[p.id]!=null && S.turn - S.usedPolicies[p.id] < 9);
  });
}
/* フォローアップとして出せる政策：実施済みで、前回の判断（初回／前回フォローアップ）から間が空いたもの */
function followupPolicyPool(){
  normalizePolicyState();
  return POLICIES.filter(p=>{
    if(p.stages || p.id==="tariff") return false;
    if(!S.policyEstablished[p.id]) return false;
    return S.turn - (S.usedPolicies[p.id]!=null ? S.usedPolicies[p.id] : -99) >= 7;
  });
}
function followupEntry(p){
  const est = S.policyEstablished[p.id];
  return Object.assign({}, p, { isFollowup:true,
    desc:`実施済みの政策「${est?est.label:""}」について、その後の判断が求められている。続けるのか、広げるのか、見直すのか、方針を転換するのか、新しい取り組みへ発展させるのか――同じ首相として、積み上げた政策との向き合い方が問われる。` });
}
function availablePolicies(){
  const avail = initialPolicyPool();
  /* 分野クールダウン：最近取り上げた分野はしばらく候補に出にくくする */
  const fresh = avail.filter(p=> !(S.fieldUsed && S.fieldUsed[p.field]!=null && S.turn - S.fieldUsed[p.field] < 4));
  return fresh.length >= 3 ? fresh : avail;
}
/* 今月の候補を4〜5件組む。初回判断は分野が偏らないように選び、
   実施済み政策のフォローアップを最大2件まで混ぜる（出せるものがある月は最低1件は混ぜる） */
function composePolicyChoices(){
  normalizePolicyState();
  const initials = shuffle(availablePolicies());
  const fus = shuffle(followupPolicyPool().filter(p=> !(S.fieldUsed && S.fieldUsed[p.field]!=null && S.turn - S.fieldUsed[p.field] < 3)));
  const chosen = [];
  const usedFields = new Set();
  for(const p of fus){
    if(chosen.filter(c=>c.isFollowup).length >= 2) break;
    if(usedFields.has(p.field)) continue;
    chosen.push(followupEntry(p)); usedFields.add(p.field);
  }
  for(const p of initials){
    if(chosen.length >= 5) break;
    if(usedFields.has(p.field)) continue;
    chosen.push(p); usedFields.add(p.field);
  }
  for(const p of initials){
    if(chosen.length >= 5) break;
    if(!chosen.some(c=>c.id===p.id)) chosen.push(p);
  }
  for(const p of fus){
    if(chosen.length >= 5) break;
    if(!chosen.some(c=>c.id===p.id)) chosen.push(followupEntry(p));
  }
  return shuffle(chosen);
}

/* 同じ政策でも、まだ使っていない切り口（バリエーション）から選ぶ。
   一度「初回判断」で使った切り口は、その政策では二度と初回判断に出さない */
function pickVariant(p){
  const sets = [{desc:p.desc, opts:p.opts}].concat(p.alts||[]);
  if(sets.length===1) return {obj:p, idx:0};
  normalizePolicyState();
  const used = S.usedVariants[p.id] || [];
  let candidates = sets.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!candidates.length){
    const last = (S.policyVariant||{})[p.id];
    candidates = sets.map((_,i)=>i).filter(i=>i!==last);
    if(!candidates.length) candidates = [0];
  }
  const idx = pick(candidates);
  S.policyVariant = S.policyVariant || {};
  S.policyVariant[p.id] = idx;
  const v = sets[idx];
  return {obj: Object.assign({}, p, {desc:v.desc, opts:v.opts}), idx: idx};

function applyPolicyOption(pid, idx, isStaged){
  const p = POLICIES.find(x=>x.id===pid);
  const opt = isStaged ? p.stages[S.activePolicy.stage].opts[idx] : (window._policyOpts||p.opts)[idx];
  ensureApprovalFields();
  const _segSnapPolicy = segSnap(); /* この判断でどの層がどれだけ動いたかを後で測る（理由表示と「声」の生成用） */
  let eff = JSON.parse(JSON.stringify(opt.eff||{}));
  /* 担当大臣の能力で効果を補正。担当ポストは選択肢→選択肢の効果→政策の順に解決する。
     専門の一致度で効き目に小さな差を付ける：主専門一致＝そのまま／副専門一致＝85%／専門外＝50% */
  const _needPost = opt.needPost || (opt.eff && opt.eff.needPost) || p.needPost || null;
  if(_needPost){
    const m = S.cabinet[_needPost];
    if(m){
      const lvl = specMatchLevel(_needPost, m);
      const factor = lvl>=2 ? 1 : (lvl===1 ? 0.85 : 0.5);
      const bonus = (effSkill(m)-68)/28 * factor;
      if(eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k]>0) eff.seg[k]=Math.round(eff.seg[k]*(1+bonus)); });
      if(eff.econ) eff.econ = Math.round(eff.econ*(1+bonus));

  }
  /* 財務大臣の能力で財政ダメージを軽減 */
  const fiscHit = (eff.fisc||0) + (opt.cost? -opt.cost*0.35 : 0); /* 財政緩和（2026-11-05追加調整）：政策コストの負担係数を0.4→0.35に微減 */
  if(fiscHit < 0 && S.cabinet.zaimu) { eff.fisc = fiscHit * (1 - (S.cabinet.zaimu.skill-65)/160); }
  else if(fiscHit) eff.fisc = fiscHit;
  if(opt.cost && !eff.fisc) eff.fisc = -opt.cost*0.35;
  /* 財政の下がり方をゆるやかにする：政策判断によるマイナスは0.62倍に圧縮する（プラス側・回復側は据え置き）。
     あわせて、財政を改善する判断を選んだときは痛みを伴う層の反発を8割に和らげ、
     「締めるほど支持が落ちる」板挟みを少し緩める */
  if(eff.fisc < 0) eff.fisc = Math.round(eff.fisc * 0.62 * 10)/10; /* 財政緩和（2026-11-05追加調整）：政策判断による低下の圧縮を×0.7→×0.62に緩和 */
  else if(eff.fisc > 0 && eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k] < 0) eff.seg[k] = Math.round(eff.seg[k] * 0.8 * 10)/10; });
  const _fiscBeforePolicy = S.fisc;
  /* 首相の得意分野の政策は効果が少し強くなる（プラスの効果を3割増し） */
  let specNote = "";
  if(S.pmSpecFields && S.pmSpecFields.includes(p.field)){
    if(eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k]>0) eff.seg[k]=Math.round(eff.seg[k]*1.3); });
    if(eff.econ>0) eff.econ = Math.round(eff.econ*1.3);
    specNote = " 首相の得意分野とあって、政策の手応えはひときわ大きかった。";

  /* ストック型政策（時間差で効く政策）：正の seg／econ 効果は即時分として25%だけを今の eff に残し、
     残り75%（＋指定があれば成熟ボーナス）は成熟分として stockPolicies に積む。

  let stockNote = "";
  if(opt.stock && !isStaged){
    ensureGrowthFields();
    const delay = ri(opt.stock.delay[0], opt.stock.delay[1]);
    const mature = { seg:{}, econ:0 };
    let hasMature = false;
    if(eff.seg) Object.keys(eff.seg).forEach(k=>{
      if(eff.seg[k] > 0){
        const imm = Math.round(eff.seg[k]*0.25*10)/10;
        let mat = Math.round((eff.seg[k]-imm)*10)/10;

      if(mat > 0){ mature.econ = mat; hasMature = true; }
    }
    if(opt.stock.birth) hasMature = true;
    if(hasMature){
      const due = ymAfter(delay);
      S.stockPolicies.push({ title:`${p.title}（${opt.label}）`, field:p.field, dueTurn: S.turn + delay, eff: mature, birth: (opt.stock.birth||0) });
      stockNote = ` この政策は時間差で効く投資型のため、効果の大半はこれから育っていく。効果が実るのは${due.label}頃（あと約${delay}か月）の見込みだ。`;
    }
  }
  /* 後半処理（効果適用〜月末）へ渡す文脈。ねじれ国会の取引が発火した場合は、この文脈を
     S.pendingNegotiate に保存して後半を保留し、取引の決着後に completePolicyApplication で再開する */
  const _ctx = { pid:p.id, idx:idx, isStaged:!!isStaged, mode:(window._policyMode || (isStaged ? "staged" : "initial")),
    variantIdx:(window._policyVariantIdx!=null ? window._policyVariantIdx : null),
    opt: deepCopy(opt), eff: eff, fiscBefore: _fiscBeforePolicy, specNote: specNote, stockNote: stockNote,
    segSnap: _segSnapPolicy, fromNegotiate:false };
  /* ねじれ国会での野党との取引：参院で野党が多数の月に政策を実行すると、最大野党が
     「通してほしければ条件を呑め」と持ちかけることがある（確率30%・クールダウン3か月） */
  if(!isStaged && S.twisted){
    ensureGrowthFields();
    const _opp = negotiateOpponent();
    if(_opp && S.turn - S.lastNegotiateTurn >= 3 && Math.random() < 0.30){
      S.lastNegotiateTurn = S.turn;
      const _kind = negotiateKinds()[ri(0,2)];
      _ctx.fromNegotiate = true;
      S.pendingNegotiate = { partyId:_opp.id, kind:_kind.id, demand:_kind.text(p, opt, _opp), ctx:_ctx };
      renderNegotiateOffer();
      return;
    }
  }
  completePolicyApplication(_ctx, 1, null, null);
}
/* 政策適用の後半処理：効果の適用から、記録・連立反応・ねじれの扱い・野党協力の判定・月末処理まで。
   factor は取引で効果が弱まる場合の倍率（正の seg／econ 効果のみに効く）。
   extra は取引に伴う追加の副作用 {segAll, segReason, fisc, fiscReason} */
function completePolicyApplication(ctx, factor, note, extra){
  const p = POLICIES.find(x=>x.id===ctx.pid);
  const opt = ctx.opt;
  const idx = ctx.idx, isStaged = ctx.isStaged;
  let eff = deepCopy(ctx.eff);
  if(factor && factor < 1){
    if(eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k] > 0) eff.seg[k] = Math.round(eff.seg[k]*factor*10)/10; });
    if(eff.econ > 0) eff.econ = Math.round(eff.econ*factor*10)/10;
  }
  const _fiscBeforePolicy = ctx.fiscBefore;
  const specNote = ctx.specNote || "";
  const _segSnapPolicy = ctx.segSnap || segSnap();
  applyEffects(eff, opt);
  /* 財政の変動理由を記録する（支出の大きい政策か、財政を改善する判断か） */
  if(Math.abs(S.fisc - _fiscBeforePolicy) >= 0.05){
    recordFisc(S.fisc - _fiscBeforePolicy, S.fisc < _fiscBeforePolicy
      ? (opt.cost ? `政策「${p.title}」で「${opt.label}」を選んだ。約${opt.cost}兆円規模の支出が財政を圧迫した` : `政策「${p.title}」で「${opt.label}」を選んだ。財政負担の大きい判断だった`)
      : `政策「${p.title}」で「${opt.label}」を選んだ。財政を改善する方向の判断だった`);
  }
  /* 野党との取引に伴う追加の副作用（強行時の反発／取引材料としての財政負担） */
  if(extra){
    if(extra.segAll){ applySegAll(extra.segAll); if(extra.segReason) recordApproval(extra.segAll, extra.segReason); }
    if(extra.fisc){
      const _fiscBeforeDeal = S.fisc;
      S.fisc = clamp(S.fisc + extra.fisc, 3, 97);
      recordFisc(S.fisc - _fiscBeforeDeal, extra.fiscReason || "野党への取引材料として財政負担が生じた");
    }
  }
  /* イデオロギー：この選択の立ち位置が、近い層・遠い層、岩盤と中間層、政権の色に効く */
  const ideoNote = applyIdeoPolicy(p, opt, idx);
  /* 連立条件チェック */
  checkCoalitionReaction(p, opt);
  /* ねじれ国会：法案系政策は効果が薄まることがある */
  let twistNote = "";
  if(S.twisted && !ctx.fromNegotiate && Math.random()<0.35){
    applySegAll(-1);
    twistNote = "ただし参院のねじれで関連法案の審議が難航し、効果は一部にとどまった。";
  }
  twistNote += specNote;
  if(ideoNote) twistNote += " " + ideoNote;
  if(ctx.stockNote) twistNote += ctx.stockNote;
  if(note) twistNote += " " + note;
  S.usedPolicies[p.id] = S.turn;
  S.fieldUsed = S.fieldUsed || {};
  S.fieldUsed[p.field] = S.turn;
  /* 実施の記録：初回判断は「実施済み政策」として固定し、使ったバリエーションも記録する。
     以後この政策は初回判断としては再出題されず、再登場は元の判断と矛盾しないフォローアップになる */
  normalizePolicyState();
  const _mode = isStaged ? "staged" : (ctx.mode || window._policyMode || "initial");
  const _isFollowup = _mode === "followup";
  if(!isStaged && !_isFollowup){
    const vi = (ctx.variantIdx!=null ? ctx.variantIdx : window._policyVariantIdx);
    if(vi!=null){
      if(!S.usedVariants[p.id]) S.usedVariants[p.id] = [];
      if(!S.usedVariants[p.id].includes(vi)) S.usedVariants[p.id].push(vi);
    }
    if(!S.policyEstablished[p.id]){
      S.policyEstablished[p.id] = { label: opt.label, eff: deepCopy(opt.eff||{}), cost: opt.cost||0,
        needPost: opt.needPost || (opt.eff && opt.eff.needPost) || p.needPost || null, ideo: getOptIdeo(p, opt, idx),
        when: `${S.year}年${S.month}月`, variant: (vi!=null?vi:0) };
    }
  }
  /* フォローアップの発展形：方向転換と新たな取り組みは「実施済み」の状態そのものを書き換える */
  if(!isStaged && _isFollowup && opt._action==="pivot"){
    /* 方向転換：実施済み扱いを解除する。この政策は未使用のバリエーションから
       「新たな初回判断」として後日再び出題され得る（直近の実施クールダウンは通常どおり効く） */
    delete S.policyEstablished[p.id];
  } else if(!isStaged && _isFollowup && opt._action==="evolve"){
    /* 新たな取り組み：発展形が新たな「実施済み」になり、以後のフォローアップはこの形を前提に組まれる */
    const _est = S.policyEstablished[p.id];
    if(_est){
      S.policyEstablished[p.id] = { label: _est.label + "（発展版）", eff: deepCopy(opt.eff||{}), cost: opt.cost||0,
        needPost: opt.needPost || (opt.eff && opt.eff.needPost) || _est.needPost || null, ideo: getOptIdeo(p, opt, idx),
        when: `${S.year}年${S.month}月`, variant: _est.variant||0, evolved:true };
    }
  }
  S.policyHistory.push({ pid:p.id, title:p.title, choice:opt.label,
    action: isStaged ? "negotiation" : (_isFollowup ? (opt._action||"continue") : "new"),
    followup: _isFollowup, when:`${S.year}年${S.month}月`, turn:S.turn });
  S.policiesDone.push({title:p.title, choice:opt.label, when:`${S.year}年${S.month}月`, followup:_isFollowup, action: _isFollowup ? (opt._action||"continue") : undefined});
  S.policyLog.push({title:`${p.title}${_isFollowup?"（フォローアップ）":""}：${opt.label}`, text:opt.msg + twistNote});
  /* 支持率の変動理由として記録し、国民の声・各党の声を生成する（実際に動いた層と矛盾しない内容にする） */
  const _segDeltaPolicy = segDeltaSince(_segSnapPolicy);
  if(Math.abs(_segDeltaPolicy.avg) >= 0.3){
    recordApproval(_segDeltaPolicy.avg, _segDeltaPolicy.avg > 0
      ? `政策「${p.title}」で「${opt.label}」を選んだ判断が、支持層に好意的に受け止められた`
      : `政策「${p.title}」で「${opt.label}」を選んだ判断に、支持層の反発が出た`);
  }
  /* 「新たな取り組み」は政権に新鮮味をもたらし、長期政権の「飽き」への対抗手段にもなる */
  if(!isStaged && _isFollowup && opt._action==="evolve"){
    applySegAll(0.8);
    S.freshnessTurn = S.turn;
    recordApproval(0.8, `実施済み政策を土台にした「新たな取り組み」が政権に新鮮味をもたらし、「飽き」を和らげた`);
  }
  if(isStaged) S.lastVoices = buildVoices(p, opt, _segDeltaPolicy.per, null, idx);
  if(isStaged){
    S.activePolicy.stage++;
    if(S.activePolicy.stage >= p.stages.length){
      S.activePolicy = null;
      if(p.id==="tariff"){
        /* 関税交渉は合意で決着。以後は通常の政策候補に出てこない */
        S.tariffDone = true; S.tariffDoneTurn = S.turn;
        window._tariffMsg = `「${p.title}」は合意に達し、決着した。${opt.msg}${twistNote}`;
        showPaper({
          kicker:"一面", title:"日米関税交渉、合意が成立", sub:"数か月に及んだ交渉に決着",
          body:`米国との関税交渉が最終合意に達した。${esc(opt.msg)} 首相は会見で「国益を守り抜いた合意だ」と強調し、産業界からは安堵の声が広がった。市場も合意を好感している。今後よほどのことがない限り、この交渉が再び政策の俎上に上ることはない見通しだ。`,
          btn:"政権運営に戻る", fn:"afterTariffPaper()"
        });
        return;
      }
      finishMonth(`「${p.title}」の交渉が決着した。${opt.msg}${twistNote}`);
    } else {
      finishMonth(`「${p.title}」は第${S.activePolicy.stage}回交渉を終え、継続中（残り${p.stages.length - S.activePolicy.stage}回）。${opt.msg}`);
    }
  } else {
    const _finalMsg = `${opt.msg}${twistNote}`;
    /* 野党の賛成表明（極まれ）：今回の判断と立ち位置が合う野党が協力を持ちかけることがある。
       声の生成ではその党を通常の反応から外し、表明への対応を選んでから月を終える */
    const _coopParty = ctx.fromNegotiate ? null : coopCandidate(p, opt, idx);
    S.lastVoices = buildVoices(p, opt, _segDeltaPolicy.per, _coopParty ? _coopParty.id : null, idx);
    if(_coopParty){
      S.pendingCoop = { partyId: _coopParty.id, policyMsg: _finalMsg, title: p.title };
      renderCoopOffer();
      return;
    }
    finishMonth(_finalMsg);
  }
}
function afterTariffPaper(){
  finishMonth(window._tariffMsg || "関税交渉が合意に達した。");
}
function applyEffects(eff, opt){
  if(eff.seg) applySeg(eff.seg);
  if(eff.all) applySegAll(eff.all);
  if(opt && opt.eff && opt.eff.all) applySegAll(0); /* applySeg済み */
  if(eff.econ) S.econ = clamp(S.econ + eff.econ, 5, 97);
  if(eff.fisc) S.fisc = clamp(S.fisc + eff.fisc, 3, 97);
  if(eff.infl) S.infl = clamp(S.infl - eff.infl, 5, 97);
  if(eff.rel) Object.keys(eff.rel).forEach(pid=>{ S.partySupport[pid] = clamp(S.partySupport[pid] + eff.rel[pid]*0.5, 1, 55); });
  if(eff.partyRel) S.partyRel = clamp(S.partyRel + eff.partyRel, 0, 100);
  if(eff.coalRel && S.coalition) adjustAllCoalitionRel(eff.coalRel);
}
function coalitionPolicyHit(cond, p, opt){
  let hit = 0;
  if(cond.field==="child" && p.id==="child" && (opt.eff.fisc||0) >= 0 && opt.cost===0) hit = -6;
  if(cond.field==="child" && p.id==="child" && opt.cost>=2) hit = +7;
  if(cond.field==="energy" && p.id==="nuclear" && opt.label.includes("進める") && !opt.label.includes("慎重")) hit = -10;
  if(cond.field==="tax" && p.id==="tax" && opt.label.includes("減税")) hit = +7;
  if(cond.field==="tax" && p.id==="tax" && opt.label.includes("行わず")) hit = -6;
  if(cond.field==="defense" && p.id==="defense" && opt.label.includes("抑え")) hit = -8;
  if(cond.field==="defense" && p.id==="defense" && opt.cost>=3) hit = +6;
  if(cond.field==="local" && p.id==="local" && opt.cost>=2) hit = +6;
  if(cond.field==="reform" && (opt.eff.fisc||0) >= 2) hit = +5;
  if(cond.field==="welfare" && (opt.cost||0)>=2) hit = +5;
  return hit;
}
/* 協力の条件への反応は、すべての連立パートナーそれぞれについて判定する */
function checkCoalitionReaction(p, opt){
  coalitionPartnerIds().forEach(pid=>{
    const cond = coalitionCondition(pid);
    const hit = coalitionPolicyHit(cond, p, opt);
    if(hit){
      addCoalitionRel(pid, hit);
      /* 内訳表示のため、条件への適合・違反をパートナーごとの実績として残す */
      coalitionRelLogPush(pid, hit, `政策「${p.title}」で「${opt.label}」を選んだ判断が、協力条件「${cond.label}」に${hit>0?"沿った":"反した"}`);
    }
  });
}
function skipPolicy(){
  ensureApprovalFields();
  const _skipD = rnd(-1.6,-0.4);
  applySegAll(_skipD);
  recordApproval(_skipD, "政策判断を見送ったことで、決断力を疑問視する声が出た");
  S.lastVoices = [{ who:"国民の声", text:"「様子見が続くと、何も決めない政権に見えてくる」", tone:"neg" }];
  S.policyLog.push({title:"政策判断を見送り", text:"「様子見」と報じられ、決断力を疑問視する声が出た。"});
  finishMonth("今月は大きな政策判断を見送った。世論はやや冷ややかだ。");
}

/* 党首討論のTVニュースを閉じた後、通常の月末処理へ戻る */
function finishDebateEvent(){ endMonth(window._pendingPolicyMsg, window._debateMsg || "党首討論が行われた。"); }

/* ---------------- 月末処理 ---------------- */
function finishMonth(policyMsg){
  S.eventCulprit = null;
  /* ランダムイベント判定 */
  const ev = rollEvent();
  if(ev){ renderEvent(ev, policyMsg); return; }
  endMonth(policyMsg, null);
}
function rollEvent(){
  /* 災害の翌月以降は、復旧のフォローイベントが優先的に起こる */
  if(S.pendingRecovery && Math.random() < 0.65){
    const rec = EVENTS.find(e=>e.id==="recovery");
    if(rec) return rec;
  }
  const ministers = POSTS.map(p=>S.cabinet[p.id]).filter(Boolean);
  const avgRisk = ministers.length? ministers.reduce((s,m)=>s+effRisk(m),0)/ministers.length : 20;
  for(const ev of shuffle(EVENTS)){
    if(ev.coalitionOnly && !S.coalition) continue;
    if(ev.recovery) continue; /* 復旧イベントは上の優先判定でのみ発生 */
    if(ev.months && !ev.months.includes(S.month)) continue; /* 季節に寄せる（台風は夏〜秋、豪雪は冬など） */
    if(ev.tariffReopen && !(S.tariffDone && S.turn - (S.tariffDoneTurn||0) >= 18)) continue; /* 合意後は長期間あけて、稀にだけ */
    if(ev.scandal && S.turn - (typeof S.lastScandalTurn==="number"? S.lastScandalTurn : -100) < 5) continue; /* 不祥事・失言は直近5か月以内には続けて起きない */
    if(ev.id==="leader_debate" && S.turn - (typeof S.lastDebateTurn==="number"? S.lastDebateTurn : -100) < 4) continue; /* 党首討論は直近4か月以内には続けて起きない */
    if(ev.id==="birthrate"){
      /* 出生数イベントは、出生率が政権開始時を下回っているときだけ発生する（改善している政権で「過去最少」は矛盾するため） */
      const bs = (typeof S.birthStart==="number")? S.birthStart : 1.00;
      const br = (typeof S.birthRate==="number")? S.birthRate : bs;
      if(!(br < bs - 0.0005)) continue;
    }
    let p = ev.prob;
    if(ev.scandal) p *= (0.45 + avgRisk/55 + S.pmRisk/200);
    if(ev.party && S.approval>45) p *= 0.5;
    if(ev.id==="birthrate"){
      const bs2 = (typeof S.birthStart==="number")? S.birthStart : 1.00;
      const br2 = (typeof S.birthRate==="number")? S.birthRate : bs2;
      if(br2 <= bs2 - 0.02) p = Math.max(p, 0.10); /* 低下が深いほど少し出やすくする */
    }
    if(Math.random() < p) return ev;
  }
  return null;
}
/* 災害の発生地域・規模を決め、見出しと本文を組み立てる（再開時も同じ内容になるよう状態に保持） */
function disasterInfo(ev){
  if(S.eventDisaster && S.eventDisaster.id===ev.id) return S.eventDisaster;
  const region = ev.regions ? pick(ev.regions) : "全国";
  let headline, text;
  if(ev.id==="quake"){ const sc = pick(ev.scales||["6強"]); headline = `${region}で震度${sc}の地震`; text = `${region}で震度${sc}を観測する強い地震が発生し、建物の倒壊や交通の寸断が各地で報じられている。政府の初動が問われる局面だ。`; }
  else if(ev.id==="typhoon"){ headline = `大型台風が${region}に上陸`; text = `大型で強い台風が${region}に上陸し、暴風と大雨で交通機関が大きく乱れている。河川の増水と土砂災害への警戒も続いている。`; }
  else if(ev.id==="flood"){ headline = `記録的豪雨、${region}で水害相次ぐ`; text = `${region}で線状降水帯による記録的な豪雨となり、河川の氾濫と浸水、土砂災害が相次いでいる。避難と救助が急がれる。`; }
  else if(ev.id==="snow"){ headline = `${region}で記録的な豪雪`; text = `${region}を中心に記録的な大雪となり、交通の寸断と家屋の倒壊、孤立する集落が出ている。除雪と生活支援が急務だ。`; }
  else if(ev.id==="volcano"){ headline = `${region}の火山が噴火`; text = `${region}の火山が噴火し、周辺住民の避難が始まっている。噴火の推移と降灰の影響はまだ見通せない。`; }
  else if(ev.id==="heat"){ headline = `全国で記録的な猛暑`; text = `全国各地で猛烈な暑さが続き、熱中症による救急搬送が急増している。電力需給も綱渡りの状況だ。`; }
  else { headline = ev.title; text = ev.text; }
  S.eventDisaster = {id:ev.id, region:region, headline:headline, text:text, kindName:ev.kindName||"災害"};
  return S.eventDisaster;
}
/* 党首討論の相手（野党第一党の党首）と論題（その時期の状況に寄せたもの）を決める。再開時も同じ内容になるよう状態に保持 */
function debateSetup(){
  if(S.eventDebate) return S.eventDebate;
  const opps = PARTIES.filter(p=> !govPartyIds().includes(p.id) && p.id!=="other" && !isDormantParty(p.id));
  opps.sort((a,b)=> (S.partySupport[b.id]||0) - (S.partySupport[a.id]||0));
  const opp = opps[0] || partyById("cdp");
  const cand = opp ? PM_CANDIDATES.find(c=>c.party===opp.id) : null;
  let topic = "政権運営全般";
  if(S.fisc < 41) topic = "財政再建と財源のあり方";
  else if(S.infl < 40) topic = "物価高への対策";
  else if(S.approval < 35) topic = "政権への不信と説明責任";
  else if(S.policyLog && S.policyLog.length) topic = S.policyLog[S.policyLog.length-1].title.split("：")[0];
  S.eventDebate = { oppParty: opp?opp.id:"cdp", oppPartyName: opp?opp.name:"野党第一党",
    oppName: cand?cand.name:"野党党首", oppDebate: cand?(cand.debate||65):65, topic };
  return S.eventDebate;
}
/* 問題を起こした閣僚を、現閣僚の中からリスクの高い人ほど選ばれやすく決める */
function chooseCulprit(){
  const ms = POSTS.map(p=>({postId:p.id, postName:p.name, m:S.cabinet[p.id]})).filter(x=>x.m);
  if(!ms.length) return null;
  let tot = 0; ms.forEach(x=>{ tot += effRisk(x.m) + 6; });
  let r = Math.random()*tot;
  for(const x of ms){ r -= effRisk(x.m) + 6; if(r<=0) return {postId:x.postId, postName:x.postName, name:x.m.name}; }
  const last = ms[ms.length-1];
  return {postId:last.postId, postName:last.postName, name:last.m.name};
}
function renderEvent(ev, policyMsg){
  let culprit = null;
  if(ev.scandal){
    if(!S.eventCulprit) S.eventCulprit = chooseCulprit();
    culprit = S.eventCulprit;
    S.lastScandalTurn = S.turn; /* 不祥事の発生月を記録し、しばらくは続けて起きないようにする */
  }
  let text = ev.text;
  let title = ev.title;
  if(ev.disaster){
    const di = disasterInfo(ev);
    text = di.text; title = di.headline;
  }

        与党の衆院議席は${gov}議席となり、${gov>=needHR?"自党だけでも過半数は維持した":"過半数を割り込んだ。今後の法案審議は野党の協力なしには進まない"}。

        政権の立て直しには、新たな協力関係の構築か、解散・総選挙での信を問う判断が求められる。`,

      quoteWho:"野党幹部", quote:"更迭は当然だが、任命責任は免れない。後任の人選を厳しく見る",

      btn:"政権運営に戻る", fn:"postCrisisCheck()"
    });
    return;
  }
  /* 出生率改善のニュース：少子化対策のストック政策が実を結んで出生率が上向いたときだけ、
     世論調査を終えたこのタイミングで新聞の一面として一度だけ報じる。
     悪化した場合はここでは何も出さない（数字が静かに下がるだけ） */
  if(S.pendingBirthNews && S.pendingBirthNews.length){
    const bn = S.pendingBirthNews[S.pendingBirthNews.length-1]; S.pendingBirthNews = [];
    setResume("postCrisis", {});

      kicker:"一面", title:`出生率が${bn.to.toFixed(2)}に上昇`, sub:"少子化対策が実を結ぶ ― 長年の低下傾向に明るい兆し",
      body:`厚生労働省の発表によると、合計特殊出生率が${bn.from.toFixed(2)}から${bn.to.toFixed(2)}へ上向いた。出生率は長く低下傾向が続いてきただけに、反転の兆しとして注目を集めている。専門家は「保育の受け皿や教育基盤への継続的な投資など、少子化対策が時間をかけて実を結び始めた」と分析する。世論調査でも、少子化対策への評価を背景に政権への支持が上向いており、地道な取り組みが報われた形だ。`,
      btn:"政権運営に戻る", fn:"postCrisisCheck()"
    });
    return;
  }
  /* 実在議員の勇退ニュース：判定は年次・選挙の節目（rosterTurnover）で行われ、
     世論調査を終えたこのタイミングで新聞の一面として一度だけ報じる */
  if(S.pendingRetireNews && S.pendingRetireNews.length){
    const news = S.pendingRetireNews; S.pendingRetireNews = [];
    setResume("postCrisis", {});
    const lead = news[0];
    const names = news.map(n=>`${esc(n.name)}氏（${esc(partyById(n.party)?partyById(n.party).name:n.party)}・${n.age}歳・当選${n.terms}回）`).join("、");

      kicker:"政界", title: news.length>1 ? "ベテラン議員が相次ぎ勇退を表明" : `${esc(lead.name)}氏が勇退を表明`,

      btn:"政権運営に戻る", fn:"postCrisisCheck()"
    });
    return;
  }
  /* 議員の移籍・知事選出馬辞職のニュース：判定は年次・選挙の節目（turnoverMoves）で行われ、
     世論調査を終えたこのタイミングで新聞の一面として一度だけ報じる */
  if(S.pendingTurnoverNews && S.pendingTurnoverNews.length){
    const news = S.pendingTurnoverNews; S.pendingTurnoverNews = [];
    setResume("postCrisis", {});
    const tr = news.find(n=>n.kind==="transfer");
    const gv = news.find(n=>n.kind==="governor");
    const parts = [];
    if(tr) parts.push(`${esc(tr.name)}氏が、所属していた${esc(tr.from)}を離党し、${esc(tr.to)}へ移籍しました。議席は移籍に伴い${esc(tr.to)}へ1つ移ります。${tr.wasGov && !tr.nowGov ? "与党から野党への移籍で、同氏は大臣候補からは外れます。" : (!tr.wasGov && tr.nowGov ? "野党から与党への移籍で、同氏は新たな大臣候補に加わります。" : "")}プロフィールの党歴にも移籍が反映されています。`);
    if(gv) parts.push(`${esc(gv.name)}氏（${esc(partyById(gv.party)?partyById(gv.party).name:gv.party)}）が、${gv.pref?esc(gv.pref)+"知事選":"地元の知事選"}への出馬のため議員を辞職しました。知事選は${gv.won?"当選し、新知事に就任します":"激戦の末、落選に終わりました"}。${gv.replacement?`与党では、辞職に伴い${esc(gv.replacement)}氏ら新人が大臣候補に加わりました。`:""}同氏は今後、大臣候補には戻りません。`);
