<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>首相シミュレーション 〜政権運営と支持率〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --bg2:#ece7db; --card:#fffdf8; --card2:#f8f4ec;
  --ink:#1c1a16; --ink2:#5a554b; --ink3:#8a8378;
  --line:#d8d0bf; --line2:#c4bba6;
  --navy:#1d3557; --navy2:#2a4a73; --red:#b3271e; --red2:#8f1d16;
  --gold:#a07d2c; --green:#2e6b3e; --blue:#2456a6;
  --good:#2e6b3e; --bad:#b3271e;
  --shadow:0 2px 10px rgba(40,32,18,.10);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17150f; --bg2:#100e0a; --card:#221f18; --card2:#2a271e;
    --ink:#efe9dc; --ink2:#c9c0ab; --ink3:#9a917c;
    --line:#3d382c; --line2:#57503e;
    --navy:#7fa3d0; --navy2:#a8c2e2; --red:#e0655c; --red2:#e0655c;
    --gold:#cfa64e; --green:#7cc48e; --blue:#8db1e8;
    --good:#7cc48e; --bad:#e0655c;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0}
.hidden{display:none!important}

/* ---------- 共通 ---------- */
.btn{
  display:inline-block;border:1.5px solid var(--navy);background:var(--navy);color:#fff;
  padding:11px 20px;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:.02em;
  transition:transform .08s, opacity .15s;text-align:center;
}
.btn:active{transform:scale(.97)}
.btn.sub{background:transparent;color:var(--navy)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:16px}
.undo-bar{margin:0 0 14px}
.undo-bar .btn{font-size:13.5px;padding:9px 16px}
.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.share-row .btn{flex:1 1 130px;padding:11px 8px;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
.tag.red{background:var(--red);color:#fff;border-color:var(--red)}
.tag.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini{font-size:12px;color:var(--ink2)}
.tiny{font-size:11px;color:var(--ink3)}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.flex{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1}

/* ---------- タイトル ---------- */
.masthead{padding:34px 0 6px;text-align:center;border-bottom:3px double var(--ink);margin-bottom:6px}
.masthead .date-line{font-size:12px;color:var(--ink2);letter-spacing:.15em}
.masthead h1{font-size:clamp(30px,7.5vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.25;margin:8px 0 4px}
.masthead .sub{font-family:"Shippori Mincho",serif;font-size:clamp(14px,3.6vw,19px);color:var(--red);font-weight:700;letter-spacing:.3em}
.rule{border-top:1px solid var(--ink);margin:4px 0 18px}
.title-lead{font-size:14px;color:var(--ink2);text-align:center;max-width:620px;margin:0 auto 18px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr}}
.mode-card{cursor:pointer;text-align:left;padding:18px}
.mode-card:hover{border-color:var(--navy)}
.mode-card h3{font-size:19px;margin-bottom:6px}
.mode-card p{font-size:13px;color:var(--ink2);margin:0}
.fiction-note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:22px;line-height:1.7}

/* ---------- 選択リスト ---------- */
.pick-list{display:flex;flex-direction:column;gap:10px}
.pick{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);color:var(--ink);
}
.pick:hover{border-color:var(--navy)}
.pick.sel{border-color:var(--red);background:var(--card2)}
.pick .avatar{
  flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"Shippori Mincho",serif;font-weight:800;font-size:19px;color:#fff;background:var(--navy);
}
.pick h4{margin:0 0 2px;font-size:16px}
.pick .desc{font-size:12.5px;color:var(--ink2)}
.stat-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2)}
.chip b{color:var(--ink)}
.chip.warn b{color:var(--red)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:10px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hud-date{font-family:"Shippori Mincho",serif;font-weight:800;font-size:19px}
.hud-pm{font-size:13px;color:var(--ink2)}
.approval-box{display:flex;align-items:center;gap:14px;margin-top:8px}
.approval-num{font-family:"Shippori Mincho",serif;font-size:44px;font-weight:800;line-height:1;color:var(--navy)}
.approval-num.low{color:var(--red)}
.approval-lab{font-size:11px;color:var(--ink2);letter-spacing:.1em}
.delta{font-weight:700;font-size:14px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.gauge{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.gauge>i{display:block;height:100%;background:var(--navy);transition:width .6s}
.gauge>i.low{background:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat-cell .k{font-size:11px;color:var(--ink2)}
.stat-cell .v{font-size:17px;font-weight:900}
.stat-cell .v small{font-size:11px;font-weight:500;color:var(--ink2)}
button.stat-cell{text-align:left;font:inherit;color:inherit;width:100%}
.fisc-cell{cursor:pointer}
.fisc-cell:hover{border-color:var(--navy)}
.fisc-cell.danger{border-color:var(--red);background:rgba(179,39,30,.07)}
.fisc-cell.caution{border-color:var(--gold)}
.fisc-cell .tap-hint{font-size:10px;color:var(--ink3);font-weight:500;float:right}
.fisc-sub{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.55}
.fisc-sub b.up{color:var(--good)}.fisc-sub b.down{color:var(--bad)}
.fisc-warn{background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-top:8px;text-align:center;cursor:pointer;border:none;width:100%;font-family:inherit}
.resign-zone{margin-top:12px;background:var(--card);border:2px solid var(--red);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.resign-zone .rz-text{flex:1 1 220px;min-width:0}
.resign-zone .rz-title{font-weight:900;font-size:16px;color:var(--red);line-height:1.3}
.resign-zone .rz-desc{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.resign-zone .btn{flex:0 0 auto;white-space:nowrap}
@media(max-width:560px){.resign-zone .btn{flex:1 1 100%;width:100%}}
.fisc-log-item{border-left:3px solid var(--line2);padding:5px 0 5px 12px;margin-top:7px;font-size:13px}
.fisc-log-item.down{border-left-color:var(--red)}
.fisc-log-item.up{border-left-color:var(--green)}
.fisc-log-item .fd{font-weight:900}
.fisc-log-item .fd.up{color:var(--good)}.fisc-log-item .fd.down{color:var(--bad)}
.fisc-log-item .fr{color:var(--ink2);font-size:12.5px}

/* ---------- 支持率の理由・声（世論調査） ---------- */
.reason-item{border-left:3px solid var(--line2);padding:5px 0 5px 12px;margin-top:7px;font-size:13px}
.reason-item.down{border-left-color:var(--red)}
.reason-item.up{border-left-color:var(--green)}
.reason-item .fd{font-weight:900}
.reason-item .fd.up{color:var(--good)}.reason-item .fd.down{color:var(--bad)}
.reason-item .fr{color:var(--ink2);font-size:12.5px}
.voice-item{padding:7px 0;border-bottom:1px dashed var(--line)}
.voice-item:last-child{border-bottom:none}
.voice-item .vw{font-weight:800;font-size:13px}
.voice-item .vt{font-size:13.5px;color:var(--ink)}
.voice-item .vt.neg{color:var(--ink2)}
.countdown{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cd{flex:1;min-width:150px;background:var(--navy);color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.cd b{font-size:16px}
.cd.urgent{background:var(--red)}
.twist-banner{background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-top:8px;text-align:center}

/* ---------- 狭い画面向けの圧縮（スマホ表示改善） ---------- */
/* 出生率タイル：広い画面では従来どおり全幅、狭い画面では他のタイルと並ぶ半幅に */
.birth-cell{grid-column:1/-1}
.ideo-toggle{display:none}
@media(max-width:560px){
  .birth-cell{grid-column:auto}
  /* HUDを約300px前後に圧縮：余白と文字を詰める */
  .hud{padding-top:6px}
  .hud-date{font-size:15px}
  .hud-pm{font-size:11px;line-height:1.45}
  .approval-box{gap:10px;margin-top:4px}
  .approval-num{font-size:31px}
  .approval-num>span{font-size:14px!important}
  .approval-lab{font-size:10px}
  .gauge{height:8px}
  .stat-grid{gap:6px;margin-top:6px}
  .stat-cell{padding:5px 8px;border-radius:7px}
  .stat-cell .k{font-size:10px}
  .stat-cell .v{font-size:14px}
  .stat-cell .v small{font-size:10px}
  .fisc-sub{font-size:10px;line-height:1.4;margin-top:2px}
  .fisc-warn{padding:6px 10px;font-size:12px;margin-top:6px}
  .countdown{gap:6px;margin-top:6px}
  .cd{min-width:0;padding:5px 9px;font-size:11px;border-radius:7px}
  .cd b{font-size:13px}
  .twist-banner{padding:6px 10px;font-size:12px;margin-top:6px}
  .resign-zone{padding:11px 12px}
  /* 政権の色カード：狭い画面では要約（ずれ・結束・好感）だけを初期表示し、タップで全文を開く */
  .ideo-card .ideo-detail{display:none}
  .ideo-card.open .ideo-detail{display:block}
  .ideo-toggle{display:block;width:100%;margin-top:10px;background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--navy)}
  .ideo-toggle .t-open{display:none}
  .ideo-card.open .ideo-toggle .t-open{display:inline}
  .ideo-card.open .ideo-toggle .t-closed{display:none}
}

/* ---------- 勢力図 ---------- */
.party-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.party-dot{flex:0 0 10px;width:10px;height:10px;border-radius:3px}
.party-name{flex:0 0 108px;font-weight:700;white-space:nowrap;overflow:hidden}
.party-bar{flex:1;height:9px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.party-bar>i{display:block;height:100%}
.party-num{flex:0 0 74px;text-align:right;color:var(--ink2);font-size:11.5px}
.gov-mark{font-size:10px;color:var(--red);font-weight:900}

/* ---------- 政策カード ---------- */
.policy-card{border:1.5px solid var(--line2)}
.policy-card .field{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--red)}
.policy-card h3{font-size:19px;margin:3px 0 6px}
.policy-card .pdesc{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.opt{
  display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:8px;padding:11px 13px;margin-top:8px;color:var(--ink);
}
.opt:hover{border-color:var(--navy)}
.opt .olab{font-weight:800;font-size:15px}
.opt .odet{font-size:12.5px;color:var(--ink2);margin-top:2px}
.opt .ocost{font-size:11.5px;margin-top:5px;color:var(--gold);font-weight:700}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.procon{grid-template-columns:1fr}}
.procon div{border-radius:8px;padding:8px 10px;font-size:12px}
.procon .pro{background:rgba(46,107,62,.10);border:1px solid rgba(46,107,62,.35)}
.procon .con{background:rgba(179,39,30,.08);border:1px solid rgba(179,39,30,.3)}
.procon b{display:block;font-size:11px;letter-spacing:.08em;margin-bottom:2px}

/* ---------- 新聞・速報 ---------- */
.newsflash{
  background:var(--red);color:#fff;border-radius:var(--radius);padding:14px 16px;text-align:center;
  box-shadow:var(--shadow);
}
.newsflash .nf-k{font-size:12px;letter-spacing:.4em;font-weight:900}
.newsflash .nf-t{font-family:"Shippori Mincho",serif;font-size:clamp(20px,5.4vw,28px);font-weight:800;margin-top:4px;line-height:1.35}
.paper{background:#fffdf6;color:#1c1a16;border:1px solid #c9c0aa;padding:18px 16px;box-shadow:0 4px 18px rgba(40,32,18,.18)}
@media (prefers-color-scheme: dark){.paper{background:#efe9dc}}
.paper .p-head{display:flex;justify-content:space-between;font-size:11px;color:#6b6353;border-bottom:2px solid #1c1a16;padding-bottom:4px}
.paper h2{font-size:clamp(24px,6.4vw,36px);line-height:1.3;margin:10px 0 6px;color:#14120e}
.paper .p-sub{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;color:#8f1d16;margin-bottom:8px}
.paper p{font-size:13.5px;color:#33302a;line-height:1.8;margin:6px 0}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.paper th,.paper td{border-bottom:1px solid #d8d0bf;padding:5px 6px;text-align:right}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper .win{font-weight:900;color:#8f1d16}

/* ---------- モーダル ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,12,8,.62);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 10px 40px}
.sheet{width:100%;max-width:680px}
.sheet .card{max-height:none}
.seg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2.5px 0}
.seg-row .sn{flex:0 0 84px;font-weight:700}
.seg-row .sb{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.seg-row .sb>i{display:block;height:100%;background:var(--blue)}
.seg-row .sv{flex:0 0 66px;text-align:right;color:var(--ink2);font-size:11.5px}

/* ---------- 予算 ---------- */
.budget-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.budget-row .br-top{display:flex;justify-content:space-between;align-items:baseline}
.budget-row .br-name{font-weight:800;font-size:15px}
.budget-row .br-val{font-weight:900;font-size:16px;color:var(--navy)}
.budget-row input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--navy)}
.budget-row .br-note{font-size:11.5px;color:var(--ink2)}
.budget-total{display:flex;justify-content:space-between;font-weight:900;font-size:16px;padding:10px 0}
.budget-total .over{color:var(--red)}
.budget-guide{font-size:13px;line-height:1.75}
.budget-guide b{color:var(--navy)}
.bsum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:560px){.bsum-grid{grid-template-columns:1fr 1fr}}
.bsum-cell{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.bsum-cell .k{font-size:11px;color:var(--ink2);line-height:1.45}
.bsum-cell .v{font-size:19px;font-weight:900;color:var(--navy)}
.bsum-cell .v small{font-size:11px;font-weight:500;color:var(--ink2)}
.zone{display:inline-block;font-size:11px;font-weight:900;padding:1px 8px;border-radius:20px;vertical-align:middle;margin-left:6px}
.zone.safe{background:rgba(46,107,62,.14);color:var(--green);border:1px solid rgba(46,107,62,.45)}
.zone.caution{background:rgba(160,125,44,.15);color:var(--gold);border:1px solid rgba(160,125,44,.5)}
.zone.danger{background:rgba(179,39,30,.13);color:var(--red);border:1px solid rgba(179,39,30,.5)}
.dep-bar{position:relative;height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:8px;background:linear-gradient(to right,rgba(46,107,62,.45) 0%,rgba(46,107,62,.45) 60%,rgba(160,125,44,.5) 60%,rgba(160,125,44,.5) 80%,rgba(179,39,30,.5) 80%,rgba(179,39,30,.5) 100%)}
.dep-bar>i{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.dep-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:2px}
.bverdict{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;border:1px solid var(--line)}
.bverdict.safe{background:rgba(46,107,62,.09)}
.bverdict.caution{background:rgba(160,125,44,.10)}
.bverdict.danger{background:rgba(179,39,30,.09)}
.br-react{font-size:12px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.65}
.br-react b{color:var(--ink);font-size:11px;letter-spacing:.04em}
.br-delta{font-size:11.5px;font-weight:700}
.br-delta.up{color:var(--red)}.br-delta.down{color:var(--blue)}
.supp-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.supp-modes{grid-template-columns:1fr}}
.supp-mode{text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:8px;padding:11px 13px;color:var(--ink);width:100%}
.supp-mode:hover{border-color:var(--navy)}
.supp-mode.sel{border-color:var(--red);background:var(--card);box-shadow:var(--shadow)}
.supp-mode .sm-name{font-weight:900;font-size:15px}
.supp-mode .sm-desc{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.6}

/* ---------- ログ ---------- */
.log-item{border-left:3px solid var(--line2);padding:6px 0 6px 12px;margin-top:8px;font-size:13px}
.log-item .lt{font-weight:800}
.log-item .ld{color:var(--ink2);font-size:12.5px}
.reaction{font-size:12.5px;padding:7px 10px;border-radius:8px;margin-top:6px;background:var(--card2);border:1px solid var(--line)}
.reaction b{font-size:11px;letter-spacing:.06em}

.section-title{font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.section-title small{font-size:12px;color:var(--ink2);font-family:"Noto Sans JP",sans-serif;font-weight:500}
.rank-badge{font-family:"Shippori Mincho",serif;font-size:74px;font-weight:800;line-height:1;color:var(--gold)}

   現在判明している全人物名から台帳を再構築するので、読み込んでも壊れない */
function allKnownPersonNames(){
  const s = new Set();
  const addList = l => { (l||[]).forEach(p=>{ if(p && p.name) s.add(p.name); }); };
  addList(typeof PM_CANDIDATES!=="undefined" ? PM_CANDIDATES : []);

  try{ (NEW_PARTY_TEMPLATES||[]).forEach(t=>{ if(t && t.leader) s.add(t.leader); }); }catch(e){}
  if(S){
    addList(S.rosterNew); addList(S.talentRoster);
    try{ Object.values(S.newPartyDefs||{}).forEach(d=>{ if(d && d.leader) s.add(d.leader); }); }catch(e){}
    (S.rosterRetired||[]).forEach(n=>{ if(n) s.add(n); });
    if(S.pmName) s.add(S.pmName);
    try{ Object.values(S.cabinet||{}).forEach(m=>{ if(m && m.name) s.add(m.name); }); }catch(e){}
    if(S.electionChief && S.electionChief.name) s.add(S.electionChief.name);

  return s;
}

function fillBio(list, minAge, maxAge){

/* プロフィールを取得する。実在の政治家は REAL_BIOS、架空の政治家は
   専門分野・能力値・当選回数と矛盾しないよう組み合わせから自動生成する */
function profileOf(p){
  if(!p) return {bg:"", trait:"", group:"", elec:""};
  if(p._prof) return p._prof;
  let pr;
  if(p.careerText){ pr = {bg:p.careerText, trait:(p.policyFocus?("力を入れる政策："+p.policyFocus):"現場の声を政治に届ける"), group:(p.type? p.type+"出身" : "現場出身"), elec:(termsOf(p)>=2?"地盤を固めつつある現職型":(p.category==="commoner"?"現場の共感で勝負する挑戦者型":"知名度で押し切る人気者型"))}; }
  else if(!p.fic && REAL_BIOS[p.name]){ pr = Object.assign({}, REAL_BIOS[p.name]); }
  else{
    const h = hashName(p.name);
    let bg = "";
    if(p.civilian){ bg = (p.note||"").replace(/^民間人：/,"").replace(/（架空の人物）/,""); }
    else if(p.note){ const m = p.note.match(/元[^\s／、。]+/); if(m) bg = m[0]; }
    if(!bg){
      const pools = {
        "財務":["元財務官僚","元金融機関勤務","元地方銀行員"],
        "外務":["元外交官","元商社マン","元国際機関職員"],
        "厚生労働":["元厚生労働省の官僚","医師出身","元社会保険労務士"],
        "経済産業":["元経済産業省の官僚","IT企業経営者出身","元商社マン"],
        "防衛":["元自衛官","元防衛省職員","安全保障の研究者出身"],
        "総務":["元総務省の官僚","元市長","元地方議員"],
        "官房":["元官房副長官","元首相秘書官","元内閣官房職員"],
        "法務":["弁護士出身","元検事","元法務省の官僚"],
        "文部科学":["元文部科学省の官僚","元大学教授","元教員"],
        "農林水産":["農家出身","元農林水産省の官僚","元農協職員"],
        "国土交通":["元国土交通省の官僚","元鉄道会社勤務","元自治体の土木部長"],
        "環境":["元環境省の官僚","環境NPO出身","元自治体の環境部長"],
        "デジタル":["IT企業経営者出身","元情報通信政策の実務家","エンジニア出身"],
        "復興・防災":["元消防庁職員","被災地の首長経験者","元自衛官"],
        "経済財政":["元財務官僚","エコノミスト出身","元経済官庁の官僚"],
        "地方創生":["元町長","地域おこし実践者","元自治体職員"],
      };
      const pool = pools[p.spec] || ["地方議員出身","元会社員","元公務員"];
      bg = pool[h % pool.length];
    }
    let trait;
    if(p.pop==null){ /* 選対委員長など能力が選挙skillのみの人物 */
      trait = p.skill>=80 ? "選挙実務に通じた参謀タイプ" : p.skill>=70 ? "堅実な選挙運びに定評がある" : "大胆な選挙戦術を好むタイプ";
    }
    else if(p.risk>=30) trait = "発言が注目を集めやすい個性派";
    else if(p.skill>=78) trait = "政策に通じた実務派";
    else if((p.debate||0)>=70) trait = "国会答弁に強い論客タイプ";
    else if(p.pop>=60) trait = "知名度と親しみやすさが武器";
    else if((p.terms||0)>=8) trait = "地元の信頼が厚いベテラン";
    else trait = "堅実な仕事ぶりの実務派";
    const groups = {ldp:["保守派","実務派","改革派","地方重視派"], gomei:["福祉・平和重視"], cdp:["リベラル派","社会保障重視","実務派"],
      ishin:["改革派"], dpfp:["中道・現実派"], inochi:["積極財政派"], jcp:["革新派"], sansei:["保守・草の根派"], minshu:["中道・リベラル"], mirai:["テクノロジー・課題解決型"], hoshu:["保守派"], sdp:["社会民主主義"], civilian:["専門家（無派閥）"]};
    const gpool = groups[p.party] || ["実務派"];
    const group = gpool[h % gpool.length];
    let elec;
    if(p.civilian) elec = "専門家型（選挙区なし）";
    else if(p.pop==null) elec = p.skill>=80 ? "選挙実務のベテラン型" : p.skill>=70 ? "組織戦に堅実な着実型" : "読みの外れることもある大胆型";
    else if((p.terms||0)>=8) elec = "地盤の固いベテラン型";
    else if(p.pop>=62) elec = "知名度で押し切る人気者型";
    else if((p.terms||0)<=2) elec = "風に乗る挑戦者型";
    else if(p.pop<=48) elec = "組織票が堅い着実型";
    else elec = "バランス型";
    pr = {bg, trait, group, elec};
  }
  p._prof = pr;
  return pr;
}
function profileLine(p){ const pr = profileOf(p); return `${pr.bg} ― ${pr.trait}`; }

/* 官房長官だけは省庁の専門分野ではなく「官房・調整」が対応する適性。
   効果自体は他の大臣と違い、答弁力と人気で効く（月次の下支え・答弁イベント） */
const POST_SPEC = {kanbo:"官房", zaimu:"財務", gaimu:"外務", kousei:"厚生労働", keisan:"経済産業", bouei:"防衛", soumu:"総務",

/* 専門分野の一覧（主専門＋副専門の判定、絞り込みUI、補充生成で共通に使う） */
const ALL_SPECS = ["官房","財務","外務","厚生労働","経済産業","防衛","総務","法務","文部科学","農林水産","国土交通","環境","デジタル","復興・防災","経済財政","地方創生"];
/* 専門分野 → 対応する大臣ポスト名（「専門はポスト名で見せる」ための対応表） */
const SPEC_POST_NAME = {};
POSTS.forEach(p=>{ SPEC_POST_NAME[POST_SPEC[p.id]] = p.name; });
/* その人物の専門一覧を返す。主専門は spec、副専門は specs 配列（最大で主＋副2つ＝3つまで）。
   旧データ（specsなし）は現在の spec を主専門としてそのまま扱う */
function specsOf(m){
  if(!m) return [];
  const out = [];
  if(m.spec) out.push(m.spec);
  if(Array.isArray(m.specs)) m.specs.forEach(s=>{ if(s && !out.includes(s)) out.push(s); });
  return out.slice(0, 3);
}
function hasSpec(m, spec){ return specsOf(m).includes(spec); }
/* ポストへの専門一致度：2=主専門が一致／1=副専門が一致／0=専門外 */
function specMatchLevel(m, post){
  if(!m || !post) return 0;
  const want = POST_SPEC[post.id];
  if(!want) return 0;
  if(m.spec === want) return 2;
  if(specsOf(m).includes(want)) return 1;
  return 0;
}
/* 専門をポスト名の並びで表す（例：「環境大臣・復興大臣」） */
function specPostNames(m){ return specsOf(m).map(s=>SPEC_POST_NAME[s] || (s + "分野")); }
function specPostsLabel(m){ const ns = specPostNames(m); return ns.length ? `専門ポスト：${ns.join("・")}` : ""; }

function ensureCandidateProfile(t){
  if(!t) return t;
  if(!t.category) t.category = COMMONER_TYPES.some(c=>c.type===t.type) ? "commoner" : "talent";
  const def = COMMONER_TYPES.find(c=>c.type===t.type) || null;
  const tp = TALENT_PROFILE[t.type] || null;
  const h = hashName(t.name + t.type);
  if(!t.spec) t.spec = def ? def.spec : ({ "元アナウンサー":"総務","作家・コメンテーター":"総務","気象予報士":"復興・防災","弁護士":"法務" }[t.type] || (t.skill>=55 ? "総務" : "経済産業"));
  if(!t.edu){
    const pool = (def && def.edu) || (tp && tp.edu) || ["大学卒","高校卒"];
    t.edu = pool[h % pool.length];
  }
  if(!t.careerText) t.careerText = def ? def.career : (tp ? tp.career : `${t.type}として活動してきた`);
  if(!t.policyFocus) t.policyFocus = def ? def.policy : (tp ? tp.policy : "暮らしと地域の課題");
  if(!t.reason){
    const base = def ? def.reason : (tp ? tp.reason : "現場の声を政治に届けたい");
    let pname = "";
    try{ const pp = S ? partyById(S.pmParty) : null; if(pp) pname = pp.name; }catch(e){}
    t.reason = base + (pname ? ` ― ${pname}の掲げる「${t.policyFocus}」に共感し、この党から挑戦を決めた。` : "");
  }
  if(t.debate==null) t.debate = clamp((t.skill||50) + 6 + (h % 13), 38, 88);
  return t;
}

/* 新党の動的状態を補完する：旧セーブでは新フィールドをデフォルトで作り、
   保存された新党の定義を PARTIES に復元する（何度呼んでも安全） */
function ensureDynamicParties(){
  if(!S) return;
  if(!Array.isArray(S.emergedParties)) S.emergedParties = [];
  if(!S.newPartyDefs || typeof S.newPartyDefs!=="object") S.newPartyDefs = {};
  if(!Array.isArray(S.dormantParties)) S.dormantParties = [];
  if(!Array.isArray(S.newPartyLog)) S.newPartyLog = [];
  if(typeof S.lastEmergenceTurn!=="number") S.lastEmergenceTurn = -999;
  Object.keys(S.newPartyDefs).forEach(id=>{
    if(!partyById(id)){
      const d = S.newPartyDefs[id];
      PARTIES.push({id:d.id, name:d.name, short:d.short, color:d.color, hr:0, hc:0, support:d.baseSupport||2, ideo:d.ideo, stance:d.stance, isNewParty:true, leader:d.leader, leaderTitle:d.leaderTitle||"", kindLabel:d.kindLabel, condField:d.condField, condLabel:d.condLabel, condDesc:d.condDesc});
    }
    if(S.hrSeats[id]==null) S.hrSeats[id] = 0;
    if(S.hcSeats[id]==null) S.hcSeats[id] = 0;
    if(S.partySupport[id]==null) S.partySupport[id] = S.newPartyDefs[id].baseSupport || 2;
  });
}
function isDormantParty(id){ return !!(S && Array.isArray(S.dormantParties) && S.dormantParties.includes(id)); }
/* 新党が登場した際に、その党の大臣候補（架空議員）を最低限そろえる。
   閣僚候補プール（S.rosterNew）に入れるので、連立を組めば組閣・改造で選べるようになる */
function seedNewPartyMinisters(pid){
  ensureRosterFields();
  const specs = shuffle(ALL_SPECS).slice(0, 6);
  const used = new Set(ministerPoolAll().map(m=>m.name));
  for(let k=0;k<specs.length;k++){
    const name = genSaveFicName(used, ri(34, 58));
    if(!name) continue;
    used.add(name);
    const h = hashName(name + pid);
    S.rosterNew.push({name, party:pid, spec:specs[k], skill:56+(h%17), pop:46+((h>>3)%20), debate:54+((h>>5)%18), risk:12+((h>>7)%20), fic:true, fresh:true,
      note:`架空の人物：${partyById(pid)?partyById(pid).name:pid}の議員（新党の初期メンバー）`, age: ri(34,58) - (S.year-2026), terms:1});
  }
}

function partyIdeo(id){ const p = partyById(id); return (p && p.ideo) ? p.ideo : {cons:0,hawk:0,gov:0}; }
function ideoDist(a,b){ if(!a||!b) return 0; let s=0; IDEO_AXES.forEach(ax=>{ const d=(a[ax.id]||0)-(b[ax.id]||0); s+=d*d; }); return Math.sqrt(s); }
function ideoWord(axId, v){
  const ax = IDEO_AXES.find(a=>a.id===axId); if(!ax) return "中道";
  if(v>=1.2) return ax.right+"色が強い"; if(v>=0.4) return "やや"+ax.right+"寄り";
  if(v<=-1.2) return ax.left+"色が強い"; if(v<=-0.4) return "やや"+ax.left+"寄り";
  return "中道";
}
function describeIdeo(vec){ if(!vec) return "中道"; return IDEO_AXES.map(ax=>ideoWord(ax.id, vec[ax.id]||0)).join("／"); }
function ideoBarHtml(vec, gov){
  if(!vec) return "";
  return IDEO_AXES.map(ax=>{
    const v = clamp(vec[ax.id]||0,-2,2); const pct = ((v+2)/4*100).toFixed(1);
    return `<div class="ideo-axis"><div class="ia-top"><span>${esc(ax.left)}</span><b>${esc(ax.name)}：${esc(ideoWord(ax.id,v))}</b><span>${esc(ax.right)}</span></div><div class="ideo-track"><span class="ideo-dot ${gov?"gov":""}" style="left:${pct}%"></span></div></div>`;
  }).join("");
}
function partyIdeoHtml(p){
  if(!p || !p.ideo) return "";
  return `<div class="mt">${ideoBarHtml(p.ideo,false)}<div class="ideo-legend">${esc(p.name)}の立ち位置（公知の政策スタンスをもとにした目安）：${esc(describeIdeo(p.ideo))}</div></div>`;
}
function govIdeoVec(){
  if(S && S.ideoGov) return S.ideoGov;
  return partyIdeo(S ? S.pmParty : "ldp");
}
function ensureIdeo(){
  if(!S) return;
  if(!S.ideoGov) S.ideoGov = Object.assign({}, partyIdeo(S.pmParty));
  if(S.ideoCore==null) S.ideoCore = 55;
  if(S.ideoCenter==null) S.ideoCenter = 50;
  if(!S.lastIdeoNote) S.lastIdeoNote = "";
}
function getOptIdeo(p, opt, idx){
  /* フォローアップ選択肢など、選択肢自身が立ち位置を持つ場合はそれを優先する（元の政策の方向性と整合させるため） */
  if(opt && opt._ideo) return Object.assign({cons:0,hawk:0,gov:0}, opt._ideo);
  const base = (POLICY_IDEO_INDEX[p.id] && POLICY_IDEO_INDEX[p.id][idx!=null?idx:0]) || {cons:0,hawk:0,gov:0};
  const v = Object.assign({cons:0,hawk:0,gov:0}, base);
  const label = (opt && opt.label) || "";
  POLICY_IDEO_KEYWORDS.forEach(([kw,ov])=>{ if(label.includes(kw)) Object.assign(v, ov); });
  return v;
}
function optIdeoLabel(p, opt, idx){
  const v = getOptIdeo(p, opt, idx);
  const parts = [];
  IDEO_AXES.forEach(ax=>{ const x=v[ax.id]||0; if(Math.abs(x)>=0.6) parts.push(ideoWord(ax.id,x)); });
  return parts.length ? parts.join("・") : "中道寄り";
}
/* 政策のイデオロギー効果：政権の色を動かし、近い層は押し上げ・遠い層は冷ます。
   岩盤（自党の立ち位置に近い層）は合う政策で固まり、中間層は真ん中に近い政策で取り込みやすくなる */
function applyIdeoPolicy(p, opt, idx){
  ensureIdeo();
  const v = getOptIdeo(p, opt, idx);
  const before = Object.assign({}, S.ideoGov);
  IDEO_AXES.forEach(ax=>{ const x=v[ax.id]||0; if(x!==0) S.ideoGov[ax.id] = clamp(before[ax.id] + (x-before[ax.id])*0.22, -2, 2); });
  const segExtra = {}; let topSeg=null, topVal=-99, lowSeg=null, lowVal=99;
  SEGMENTS.forEach(g=>{
    const c = SEG_IDEO[g.id]; if(!c) return;
    const bonus = clamp((1.9 - ideoDist(v,c))*0.55, -1.4, 1.4);
    if(Math.abs(bonus)>=0.3){ segExtra[g.id]=Math.round(bonus*10)/10; }
    if(bonus>topVal){ topVal=bonus; topSeg=g; } if(bonus<lowVal){ lowVal=bonus; lowSeg=g; }
  });
  if(Object.keys(segExtra).length) applySeg(segExtra);
  const distBase = ideoDist(v, partyIdeo(S.pmParty));
  const distCenter = ideoDist(v, {cons:0,hawk:0,gov:0});
  let coreD=0, centerD=0;
  if(distBase<=1.3) coreD=4; else if(distBase>=2.6) coreD=-5; else coreD=Math.round((1.8-distBase)*10)/10;
  if(distCenter<=0.9) centerD=3; else if(distCenter<=1.6) centerD=1; else if(distCenter>=2.7) centerD=-4;
  S.ideoCore = clamp((S.ideoCore||55)+coreD, 5, 97);
  S.ideoCenter = clamp((S.ideoCenter||50)+centerD, 5, 97);
  let coalNote = "";
  coalitionPartnerIds().forEach(pid=>{
    const pd = ideoDist(v, partyIdeo(pid));
    if(pd>=2.8){ addCoalitionRel(pid, -5); coalNote = ` 連立相手の${partyById(pid).name}の立ち位置から遠い政策で、関係に小さな軋みが出た。`; }
    else if(pd<=1.3){ addCoalitionRel(pid, 3); if(!coalNote) coalNote = " 連立相手の立ち位置にも近い政策で、連立内の受け止めは良好だった。"; }
  });
  const segName = (g)=> g ? g.name.split("（")[0] : "";
  let note = "";
  if(coreD>=3 && centerD<=-2) note = `世論調査では、${segName(topSeg)}など自党に近い層の支持が固まる一方、中間層・無党派にはやや遠い政策と受け止められた。`;
  else if(coreD>=3 && centerD>=2) note = `世論調査では、岩盤支持層と中間層の双方に届く判断で、支持の幅が広がった（特に${segName(topSeg)}）。`;
  else if(coreD>=3) note = `世論調査では、自党の立ち位置に近い政策で岩盤支持層の支持が固まった${topSeg&&topVal>0.2?`（特に${segName(topSeg)}）`:""}。中間層への広がりは限られた。`;
  else if(coreD<=-3) note = `世論調査では、自党の立ち位置から離れた政策に岩盤支持層が冷める動きが見られた${lowSeg&&lowVal<-0.2?`（特に${segName(lowSeg)}）`:""}。`;
  else if(centerD>=2 && coreD<=0) note = `世論調査では、中間層・無党派に届きやすい判断だった一方、岩盤支持層の熱は少し冷めた。`;
  else if(centerD>=2) note = `世論調査では、真ん中に近い政策として中間層・無党派の受け止めが良かった。`;
  else if(topSeg && lowSeg && topVal>=0.35 && lowVal<=-0.35) note = `世論調査では、${segName(topSeg)}の支持が固まる一方、${segName(lowSeg)}が離れる動きが見られた。`;
  else if(topSeg && topVal>=0.35) note = `世論調査では、立ち位置の近い${segName(topSeg)}を中心に支持が上向いた。`;
  else note = `世論調査では、イデオロギー上の大きな反発も熱狂もなく、受け止めは穏やかだった。`;
  note = "【政権の色】" + note + `（現在の政権の色：${describeIdeo(S.ideoGov)}／岩盤の結束 ${Math.round(S.ideoCore)}・中間層の好感 ${Math.round(S.ideoCenter)}）` + coalNote;
  S.lastIdeoNote = note;
  S.lastOptIdeo = v;
  return note;
}

/* ---------------- 連立パートナーの共通処理（パートナーは最大4党＝自党と合わせて五党連立まで） ----------------
   連立の上限は COALITION_MAX_PARTNERS に一元化し、協議・見直し・組み替え・打診の全経路がこれを参照する。
   データ構造はスロット方式：主パートナーは partyId/rel/since、追加パートナーは partner2〜partner4 と
   それぞれの Rel/Since。読み取りはすべてスロット経由に統一し、partner2 決め打ちを残さない */
const COALITION_MAX_PARTNERS = 4;
function coalitionSlotFields(i){
  if(i===0) return {id:"partyId", rel:"rel", since:"since"};
  const k = "partner" + (i+1);
  return {id:k, rel:k+"Rel", since:k+"Since"};
}
function coalitionSlotIndexOf(pid){
  if(!S || !S.coalition || !pid) return -1;
  for(let i=0; i<=COALITION_MAX_PARTNERS-1; i++){
    const f = coalitionSlotFields(i);
    if(S.coalition[f.id] === pid) return i;
  }
  return -1;
}
/* 連立の呼称：総党数（自党＋パートナー数）で出し分ける */
function coalitionSizeLabel(partnerCount){
  const total = partnerCount + 1;
  if(total<=2) return "連立";
  return ({3:"三党連立", 4:"四党連立", 5:"五党連立"})[total] || (total + "党連立");
}
/* 見出し等に添える呼称（パートナー1党だけなら何も付けない） */
function coalitionFrameLabel(partnerCount){
  if(partnerCount < 2) return "";
  return "（" + coalitionSizeLabel(partnerCount) + "）";
}
function ensureCoalitionFields(){
  if(!S) return;
  if(!S.coalitionTerms || typeof S.coalitionTerms!=="object") S.coalitionTerms = {};
  if(typeof S.coalitionNextReview!=="number") S.coalitionNextReview = 0;
  if(!Array.isArray(S.coalitionHist)) S.coalitionHist = [];
  if(!S.coalitionRelLog || typeof S.coalitionRelLog!=="object") S.coalitionRelLog = {};
  if(!S.coalitionGrace || typeof S.coalitionGrace!=="object") S.coalitionGrace = {};
  if(S.coalition){
    for(let i=1; i<=COALITION_MAX_PARTNERS-1; i++){
      const f = coalitionSlotFields(i);
      if(S.coalition[f.id]){
        if(typeof S.coalition[f.rel]!=="number") S.coalition[f.rel] = clamp((S.coalition.rel||55)-4*i, 15, 95);
        if(typeof S.coalition[f.since]!=="number") S.coalition[f.since] = S.coalition.since||0;
      }
    }
  }
}
function coalitionPartnerIds(){
  ensureCoalitionFields();
  if(!S || !S.coalition) return [];
  const ids = [];
  for(let i=0; i<=COALITION_MAX_PARTNERS-1; i++){
    const f = coalitionSlotFields(i);
    const pid = S.coalition[f.id];
    if(pid && !ids.includes(pid)) ids.push(pid);
  }
  return ids;
}
/* 閣僚ポスト要求の合計上限：パートナーが増えても要求の総量が組閣（全16ポスト）を破綻させないようにする */
const COALITION_POST_DEMAND_CAP = 8;
function totalPostDemand(exceptPid){
  if(!S || !S.coalitionTerms) return 0;
  return coalitionPartnerIds().reduce((s,pid)=> s + ((pid!==exceptPid && S.coalitionTerms[pid]) ? (S.coalitionTerms[pid].postDemand||0) : 0), 0);
}
function cappedPostDemand(pid, demand){
  const room = COALITION_POST_DEMAND_CAP - totalPostDemand(pid);
  return Math.max(0, Math.min(demand, room));
}
/* ---------------- 連立パートナーの「不満の見える化」 ----------------
   関係値を実際に動かした出来事を S.coalitionRelLog にパートナーごと記録し、
   内訳表示・予兆の警告・改善ヒントは、すべてこの実績と実数値から生成する（推測の汎用文は使わない） */
function coalitionRelLogPush(pid, delta, reason){
  if(!S || !pid || !delta || Math.abs(delta) < 0.05) return;
  ensureCoalitionFields();
  if(!S.coalitionRelLog[pid]) S.coalitionRelLog[pid] = [];
  const arr = S.coalitionRelLog[pid];
  const last = arr[arr.length-1];
  if(last && last.reason === reason && last.turn === S.turn){ last.delta = Math.round((last.delta + delta)*10)/10; return; }
  arr.push({turn:S.turn, delta:Math.round(delta*10)/10, reason:String(reason)});
  if(arr.length > 14) S.coalitionRelLog[pid] = arr.slice(-14);
}
/* 政権の色とその党の考えとの距離（実数値→段階表現）。月次の関係変動に使う閾値（2.6／1.2）と揃える */
function coalitionColorNote(pid){
  const d = ideoDist(govIdeoVec(), partyIdeo(pid));
  if(d > 2.6) return {d:d, text:`政権の色とは大きく離れている（距離 ${d.toFixed(1)}）。この距離のせいで、関係は毎月少しずつ冷えている`};
  if(d < 1.2) return {d:d, text:`政権の色とは近い（距離 ${d.toFixed(1)}）。考えの近さが、関係を毎月わずかに温めている`};
  return {d:d, text:`政権の色との距離は中程度（距離 ${d.toFixed(1)}）。色の違い自体は、いまのところ関係を大きく動かしていない`};
}
/* その党の大臣が、専門に合うポストに就いているか（ポスト配分の質） */
function coalitionPostFit(pid){
  const posts = ministersOfParty(pid);
  const fits = posts.filter(p=>{
    const m = S.cabinet[p.id];
    return m && specMatchLevel(p.id, m) >= 1;
  });
  return {count:posts.length, fitCount:fits.length,
    names: posts.map(p=>`${p.name}（${specMatchLevel(p.id, S.cabinet[p.id])>=2?"専門が一致":(specMatchLevel(p.id, S.cabinet[p.id])===1?"副専門が一致":"専門外")}）`)};
}
/* 不満の最大の理由（関係ログの直近のマイナス要因と、現在の構造要因から実態ベースで1つ選ぶ） */
function coalitionTopComplaint(pid){
  ensureCoalitionFields();
  const log = (S.coalitionRelLog && S.coalitionRelLog[pid]) || [];
  const recentNeg = log.slice(-6).filter(e=>e.delta < 0).sort((a,b)=>a.delta-b.delta)[0];
  const term = S.coalitionTerms && S.coalitionTerms[pid];
  const fit = coalitionPostFit(pid);
  if(term && term.postDemand > 0 && S.turn > term.dueTurn && fit.count < term.postDemand)
    return `約束した閣僚ポスト${term.postDemand}つに対し、実際に渡せているのは${fit.count}つだけ`;
  if(fit.count === 0) return "閣僚ポストを1つも得られておらず、蚊帳の外感が強い";
  if(recentNeg) return recentNeg.reason;
  const cn = coalitionColorNote(pid);
  if(cn.d > 2.6) return "政権の色が自党の考えから大きく離れている";
  return "目立った不満の種は見当たらない";
}
/* 具体的な改善ヒント（その党の条件・約束・専門から生成） */
function coalitionHintText(pid){
  const cond = coalitionCondition(pid);
  const term = S.coalitionTerms && S.coalitionTerms[pid];
  const fit = coalitionPostFit(pid);
  const hints = [];
  if(term && term.postDemand > 0 && fit.count < term.postDemand) hints.push(`約束した閣僚ポスト${term.postDemand}つを内閣改造で渡す（現在${fit.count}つ）`);
  else if(fit.count === 0) hints.push("内閣改造で閣僚ポストを1つは渡す");
  else if(fit.fitCount < fit.count) hints.push("専門に合うポストへ起用し直すと関係が安定しやすい");
  hints.push(`協力条件「${cond.label}」に沿う政策を実行する`);
  const cn = coalitionColorNote(pid);
  if(cn.d > 2.6) hints.push("その党の考えに近い政策判断を重ね、政権の色との距離を縮める");
  return hints.slice(0,3).join("／");
}
/* 関係の内訳表示（見直し画面のパートナーカード用）。すべて内部の実数値・実績から作る */
function coalitionDiscontentHtml(pid){
  ensureCoalitionFields();
  const rel = Math.round(coalitionRelOf(pid));
  const margin = Math.max(0, rel - 8);
  const log = ((S.coalitionRelLog && S.coalitionRelLog[pid]) || []).slice(-4).reverse();
  const term = S.coalitionTerms && S.coalitionTerms[pid];
  const fit = coalitionPostFit(pid);
  const cn = coalitionColorNote(pid);
  const grace = S.coalitionGrace && typeof S.coalitionGrace[pid]==="number";
  /* 約束（政策面）の履行状況：約束以降に条件へ沿った／反した政策判断があったかをログから判定する */
  let promiseHtml = "";
  if(term && term.promiseLabel){
    const since = log.filter(e=>e.turn >= (term.promiseTurn||0));
    const bad = since.find(e=>e.delta < 0), good = since.find(e=>e.delta > 0);
    const st = bad ? "反した判断があった" : (good ? "守れている（条件に沿う判断があった）" : "まだ目立った動きはない");
    promiseHtml = `<div class="kv"><span>約束「${esc(term.promiseLabel)}」の履行</span><b>${st}</b></div>`;
  }

    <div style="font-weight:700;font-size:13.5px">関係の内訳（なぜこの関係値なのか）</div>
    <div class="kv"><span>現在の関係値／離脱圏までの余裕</span><b>${rel} ／ あと${margin}${grace?` <span style="color:var(--red)">（離脱の予兆あり：${Math.max(0,(S.coalitionGrace[pid]||0)-S.turn)}か月以内に立て直せなければ離脱）</span>`:""}</b></div>
    <div class="kv"><span>政権の色との距離</span><b>${esc(cn.text)}</b></div>
    <div class="kv"><span>ポスト配分</span><b>${fit.count? esc(fit.names.join("、")) : "なし"}${term && term.postDemand?`（約束は${term.postDemand}つ以上${S.turn>term.dueTurn?"：猶予期間は終了している":"：あと"+Math.max(1,term.dueTurn-S.turn+1)+"か月以内に調整"}）`:""}</b></div>
    ${promiseHtml}
    ${log.length? `<div class="mini" style="margin-top:6px">最近の関係の動き：<br>${log.map(e=>`${e.delta>0?"▲ +":"▼ "}${Math.abs(e.delta)} ― ${esc(e.reason)}`).join("<br>")}</div>` : `<div class="mini" style="margin-top:6px">最近の関係の動き：記録はまだない（政策判断や月日の経過で記録される）。</div>`}
    <div class="mini" style="margin-top:6px"><b>不満の主な理由：</b>${esc(coalitionTopComplaint(pid))}<br><b>改善策：</b>${esc(coalitionHintText(pid))}</div>
  </div>`;
}
/* 連立に誘える党かどうか。判定は衆院の議席だけでなく参院も見る：
   参院選だけで議席を取った新党が、誘い先の画面から漏れないようにするため。
   既存政党はどちらかの院で8議席以上、新党はどちらかで1議席以上が目安 */
function coalitionInvitable(p){
  if(!p || !S) return false;
  const hr = S.hrSeats[p.id]||0, hc = S.hcSeats[p.id]||0;
  if(p.isNewParty) return hr>=1 || hc>=1;
  return hr>=8 || hc>=8 || (hr+hc)>=6;
}
function coalitionRelOf(pid){
  if(!S || !S.coalition) return 0;
  const i = coalitionSlotIndexOf(pid);
  if(i < 0) return 0;
  const f = coalitionSlotFields(i);
  return (typeof S.coalition[f.rel]==="number" ? S.coalition[f.rel] : S.coalition.rel||0);
}
function setCoalitionRel(pid, v){
  if(!S || !S.coalition) return;
  const i = coalitionSlotIndexOf(pid);
  if(i < 0) return;
  S.coalition[coalitionSlotFields(i).rel] = clamp(v, 0, 100);
}
function addCoalitionRel(pid, d){ if(d) setCoalitionRel(pid, coalitionRelOf(pid)+d); }
function adjustAllCoalitionRel(d){ coalitionPartnerIds().forEach(pid=>addCoalitionRel(pid, d)); }
/* パートナーを追加する。戻り値は追加できたら "main"|"second"|"third"|"fourth"、満員（上限4党）なら null */
function addCoalitionPartner(pid, rel, sinceTurn){
  ensureCoalitionFields();
  if(coalitionPartnerIds().includes(pid)) return "main";
  const slotNames = ["main","second","third","fourth"];
  if(!S.coalition){
    S.coalition = {partyId:pid, rel:rel, since:sinceTurn,
      partner2:null, partner2Rel:null, partner2Since:null, partner3:null, partner3Rel:null, partner3Since:null, partner4:null, partner4Rel:null, partner4Since:null};
    return "main";
  }
  for(let i=1; i<=COALITION_MAX_PARTNERS-1; i++){
    const f = coalitionSlotFields(i);
    if(!S.coalition[f.id]){ S.coalition[f.id] = pid; S.coalition[f.rel] = rel; S.coalition[f.since] = sinceTurn; return slotNames[i]; }
  }
  return null;
}
/* パートナーを外す。残ったパートナーはスロットを詰めて保持し、先頭が主パートナーになる
   （主パートナーが抜けても枠組みは残りのパートナーで存続する従来の挙動を、4党まで一般化） */
function removeCoalitionPartner(pid){
  ensureCoalitionFields();
  if(!S.coalition) return false;
  const ids = coalitionPartnerIds();
  if(!ids.includes(pid)) return false;
  const rest = ids.filter(x=>x!==pid).map(x=>({pid:x, rel:coalitionRelOf(x), since:coalitionSinceOf(x)}));
  if(!rest.length) S.coalition = null;
  else {
    const c = {partyId:rest[0].pid, rel:rest[0].rel, since:rest[0].since,
      partner2:null, partner2Rel:null, partner2Since:null, partner3:null, partner3Rel:null, partner3Since:null, partner4:null, partner4Rel:null, partner4Since:null};
    rest.slice(1).forEach((r,i)=>{
      const f = coalitionSlotFields(i+1);
      c[f.id] = r.pid; c[f.rel] = r.rel; c[f.since] = r.since;
    });
    S.coalition = c;
  }
  if(S.coalitionTerms) delete S.coalitionTerms[pid];
  return true;
}
function coalitionSinceOf(pid){
  if(!S || !S.coalition) return S?S.turn:0;
  const i = coalitionSlotIndexOf(pid);
  if(i < 0) return S.coalition.since||0;
  const f = coalitionSlotFields(i);
  return (typeof S.coalition[f.since]==="number" ? S.coalition[f.since] : S.coalition.since||0);
}
function ministersOfParty(pid){ return POSTS.filter(p=>S.cabinet[p.id] && !S.cabinet[p.id].civilian && S.cabinet[p.id].party===pid); }
function coalitionDistTo(pid){ return ideoDist(partyIdeo(S.pmParty), partyIdeo(pid)); }
function coalitionDistLabelTo(pid){
  const d = coalitionDistTo(pid);
  return d<=1.2 ? "近い（政策で揺れにくい）" : d<=2.4 ? "やや離れている" : "大きく離れている（政策のたびに関係が揺れやすい）";
}
function overallFromSeg(){
  let s=0,w=0; SEGMENTS.forEach(g=>{ s += S.seg[g.id]*g.w; w+=g.w; }); return s/w;
}

/* ---------------- 画面遷移 ---------------- */
const app = document.getElementById("app");
let _showSeq = 0;
function show(html, opts){
  const seq = ++_showSeq;
  const keepScroll = !!(opts && opts.keepScroll);
  const prevY = keepScroll ? (window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
  const bar = undoBarHtml();
  app.innerHTML = (bar ? bar : "") + html;
  if(keepScroll){
    window.scrollTo(0, prevY);
    if(window.requestAnimationFrame) requestAnimationFrame(()=>{ if(seq===_showSeq) window.scrollTo(0, prevY); });
  } else {
    window.scrollTo(0,0);
  }
}
function undoBarHtml(){
  if(!undoStack.length) return "";
  const t = undoTarget();
  if(!t) return "";
  return `<div class="undo-bar"><button class="btn ghost" onclick="goBack()">← 一つ前に戻る（${esc(t.label)}へ）</button></div>`;
}
function undoTarget(){
  for(let i=undoStack.length-1;i>=0;i--){ if(undoStack[i].uid !== currentUndoUid) return undoStack[i]; }
  return null;
}
/* 画面表示後にチェックポイントを積んだ場合、表示済みのバーの行き先表示を最新に直す */
function refreshUndoBar(){
  try{
    const b = app.querySelector(".undo-bar");
    const nb = undoBarHtml();
    if(b && nb) b.outerHTML = nb;
    else if(b && !nb) b.remove();
    else if(!b && nb) app.insertAdjacentHTML("afterbegin", nb);
  }catch(e){ /* バーを直せない環境では表示だけが古くなる（巻き戻し自体はボタン側で正しく動く） */ }
}
function markUndoHere(e){ if(e){ currentUndoUid = e.uid; refreshUndoBar(); } }

/* ---------------- 一つ前に戻る（決定ポイントへの巻き戻し） ----------------
   主な選択・決定画面に入るたびと、決定を確定するたびに、その時点の状態（Sのディープコピー）を
   チェックポイントとして履歴に積む。「← 一つ前に戻る」を押すと直前の決定ポイントの状態に戻り、
   その画面をやり直せる。履歴は自動保存にも含まれるので、戻った後に再読み込みしても
   巻き戻し後の状態から再開できる。
   境界：世論調査で「翌月へ進む」とその月は確定し、それ以前には戻れない。
   選挙は結果が確定した時点で巻き戻し不可になる（準備画面までは戻れる）。 */
let undoStack = [];
let undoSeq = 0;
let currentUndoUid = null; /* 今表示している画面自身のチェックポイントのuid（戻る対象から除く） */
let restoringUI = false;   /* 再開・巻き戻しの再描画中はチェックポイントを積まない */
function deepCopy(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function pushUndo(tag, label, ctx){
  if(restoringUI) return null;
  const e = { uid: ++undoSeq, tag: tag, label: label, ctx: ctx || {}, S: deepCopy(S) };
  const key = e.tag + "|" + JSON.stringify(e.S) + "|" + JSON.stringify(e.ctx);
  const top = undoStack[undoStack.length-1];
  if(top && (top.tag + "|" + JSON.stringify(top.S) + "|" + JSON.stringify(top.ctx)) === key) return top;
  undoStack.push(e);
  if(undoStack.length > 40) undoStack.shift();
  saveGame();
  return e;
}
function clearUndo(){ undoStack = []; currentUndoUid = null; }
function goBack(){
  /* 表示中の画面自身のチェックポイントは読み飛ばし、その前の決定ポイントに戻る */
  while(undoStack.length && undoStack[undoStack.length-1].uid === currentUndoUid) undoStack.pop();
  const e = undoStack.pop();
  if(!e) return;
  restoreUndo(e);
}
function restoreUndo(e){
  restoringUI = true;
  try{
    S = e.S ? deepCopy(e.S) : null;
    if(S && typeof ensureCoalitionFields==="function") ensureCoalitionFields();
    if(S && typeof ensureRosterFields==="function") ensureRosterFields();
    if(S && typeof ensureCabinetFields==="function") ensureCabinetFields();
    if(S && typeof ensureBudgetState==="function") ensureBudgetState();
    if(S && typeof normalizeTalentRoster==="function") normalizeTalentRoster();
    if(S && typeof normalizePolicyState==="function") normalizePolicyState();
    if(S && typeof ensureSuppFields==="function") ensureSuppFields();
    if(S && typeof ensureDynamicParties==="function") ensureDynamicParties();
    if(S && typeof ensureApprovalFields==="function") ensureApprovalFields();
    if(S && typeof ensureGrowthFields==="function") ensureGrowthFields();
    currentUndoUid = e.uid;
    if(e.tag === "realpick"){ S = null; startRealFlow(); }
    else if(e.tag === "fic"){
      setup = {mode:"fiction"}; ficDraft = deepCopy(e.ctx.draft);
      if(e.ctx.step===1) renderFicStep1(); else if(e.ctx.step===2) renderFicStep2(); else renderFicStep3();
    }
    else if(e.tag === "coalition"){ coalitionStep(); }
    else if(e.tag === "coalReview"){ renderCoalitionReview(); }
    else if(e.tag === "coalOffer"){ if(e.ctx.partyId) renderCoalitionOffer(e.ctx.partyId); else renderCoalitionReview(); }
    else if(e.tag === "coalRemove"){ if(e.ctx.partyId) renderCoalitionRemove(e.ctx.partyId); else renderCoalitionReview(); }
    else if(e.tag === "cabinet"){
      cabinetFirstFlag = !!e.ctx.first;
      cabinetDraft = deepCopy(e.ctx.draft) || {};
      cabinetNotice = e.ctx.notice || "";
      renderCabinet(cabinetFirstFlag);
    }
    else if(e.tag === "budget"){ budgetDraft = deepCopy(e.ctx.draft) || {}; renderBudget(); }
    else if(e.tag === "suppBudget"){ suppMode = e.ctx.mode || "balanced"; suppDraft = e.ctx.draft ? normalizeSuppDraft(e.ctx.draft, suppMode) : suppDefaults(suppMode); renderSuppBudget(); }
    else if(e.tag === "policyList"){ policyChoices = deepCopy(e.ctx.choices) || []; renderPolicyList(); }
    else if(e.tag === "policyOpts"){
      if(e.ctx.staged){ renderActivePolicy(); }
      else{
        const optsCopy = deepCopy(e.ctx.opts);
        renderOptionList({id:e.ctx.pid, field:e.ctx.field, title:e.ctx.title, desc:e.ctx.desc, opts:optsCopy}, optsCopy, e.ctx.question || null, false, {mode: e.ctx.mode || "initial", variantIdx: (e.ctx.variantIdx!=null?e.ctx.variantIdx:null)});
      }
    }
    else if(e.tag === "event"){
      const ev = EVENTS.find(x=>x.id===e.ctx.evId);
      if(ev) renderEvent(ev, e.ctx.policyMsg); else if(S) renderMain(); else showTitle();
    }
    else if(e.tag === "election"){
      electionCtx = deepCopy(e.ctx.ectx);
      if(electionCtx) startElection(electionCtx.kind, electionCtx.dissolved); else if(S) renderMain(); else showTitle();
    }
    else if(S){ renderMain(); }
    else { showTitle(); }
  }catch(err){ if(S) renderMain(); else showTitle(); }
  restoringUI = false;
}

function careerOrigin(id){ return CAREER_ORIGINS.find(o=>o.id===id); }
function careerPost(id){ return CAREER_POSTS.find(p=>p.id===id); }
function careerSpec(id){ return CAREER_SPECS.find(s=>s.id===id); }
/* 経歴から現在の年齢を逆算する：初当選年齢＋（当選回数−1）×4年＋首長経験などの年数 */
function careerAge(d){
  let age = d.firstAge + Math.max(0, d.terms-1)*4;
  d.posts.forEach(pid=>{ const p = careerPost(pid); if(p) age += p.ageAdd||0; });
  return clamp(age, 32, 82);
}
/* 経歴全体から能力値・初期支持の素を組み立てる */
function computeCareerStats(d){
  const o = careerOrigin(d.origin);
  const st = {skill:66, pop:60, debate:66, risk:22, base:50};
  const seg = {};
  const addD = (dd)=>{ if(!dd) return; ["skill","pop","debate","risk","base"].forEach(k=>{ if(dd[k]) st[k]+=dd[k]; }); };
  const addSeg = (ss)=>{ if(!ss) return; Object.keys(ss).forEach(k=>{ seg[k]=(seg[k]||0)+ss[k]; }); };
  addD(o.d); addSeg(o.seg);
  d.posts.forEach(pid=>{ const p = careerPost(pid); if(p){ addD(p.d); addSeg(p.seg); } });
  st.skill = clamp(Math.round(st.skill), 35, 96);
  st.pop = clamp(Math.round(st.pop), 35, 96);
  st.debate = clamp(Math.round(st.debate), 35, 96);
  st.risk = clamp(Math.round(st.risk), 5, 70);
  st.base = clamp(Math.round(st.base), 44, 60);
  return {stats:st, seg, age:careerAge(d)};
}

function careerSummaryText(c){
  if(!c) return "";
  const posts = (c.posts||[]).map(pid=>{ const p = careerPost(pid); return p?p.name:""; }).filter(Boolean);
  return `${c.originName}／初当選${c.firstAge}歳・当選${c.terms}回${posts.length?"／"+posts.join("・"):""}／得意分野：${c.specName}`;
}
/* 新聞の人物紹介風プロフィール本文 */
function careerProfileBody(){
  const c = S.pmCareer; if(!c) return "";
  const o = careerOrigin(c.originId);
  const st = computeCareerStats({origin:c.originId, firstAge:c.firstAge, terms:c.terms, posts:c.posts});
  const posts = (c.posts||[]).map(pid=>{ const p = careerPost(pid); return p?p.name:""; }).filter(Boolean);
  const segNames = {youth:"若年層", parents:"子育て世代", elderly:"高齢層", business:"ビジネス層", rural:"地方", urban:"都市部"};
  const segSorted = Object.keys(st.seg).sort((a,b)=>st.seg[b]-st.seg[a]);
  const strongSeg = segSorted.filter(k=>st.seg[k]>0).slice(0,2).map(k=>segNames[k]).join("・");
  const weakSeg = segSorted.filter(k=>st.seg[k]<0).slice(-1).map(k=>segNames[k])[0];
  return `【人物】${esc(S.pmName)}首相は${esc(c.originName)}。${esc(o?o.catch:"")}。`
    + `${c.firstAge}歳で初当選し、当選${c.terms}回。${posts.length?`これまでに${posts.join("、")}を歴任し、`:"華々しい役職歴こそないものの、"}着実に階段を上って首相の座をつかんだ。現在${S.pmAge}歳。`
    + `得意分野は${esc(c.specName)}で、この分野の政策では人一倍の手応えを発揮するとされる。`
    + `${strongSeg?`${strongSeg}からの期待が厚い一方、`:""}${weakSeg?`${weakSeg}の支持をどう広げるかが課題だ。`:"幅広い層への浸透が課題だ。"}`
    + `${o?`長所は「${esc(o.strong)}」。弱点として「${esc(o.weak)}」が挙げられる。`:""}`
    + `この経歴が政権運営の追い風になるか、それとも足かせになるかは、これからの判断次第だ。`;
}

/* ---------------- セットアップ共通 ---------------- */
function beginSetup(pm){
  /* 前の周回で登場した新党はグローバルの党リストから外し、素の顔ぶれで始める */
  for(let i=PARTIES.length-1;i>=0;i--){ if(PARTIES[i].isNewParty) PARTIES.splice(i,1); }
  S = newState();
  resumeScreen = null;
  PARTIES.forEach(p=>{ S.hrSeats[p.id]=p.hr; S.hcSeats[p.id]=p.hc; S.partySupport[p.id]=p.support; });
  S.pmName = pm.name; S.pmParty = pm.party; S.pmSkill = pm.skill; S.pmPop = pm.pop;
  S.pmDebate = pm.debate; S.pmRisk = pm.risk; S.fictional = pm.fictional;
  S.pmAge = pm.age||0; S.pmTerms = pm.terms||0;
  S.pmCareer = pm.career || null;
  S.pmSpecFields = pm.specFields || [];
  /* イデオロギー：政権の色は自党の位置から始まる。立ち位置がはっきりした党ほど岩盤は固まりやすく、
     中道に近い党ほど中間層の初期好感が高い */
  S.ideoGov = Object.assign({}, partyIdeo(pm.party));
  const _ideoDistinct = ideoDist(S.ideoGov, {cons:0,hawk:0,gov:0});
  S.ideoCore = clamp(Math.round(52 + _ideoDistinct*4), 40, 72);
  S.ideoCenter = clamp(Math.round(58 - _ideoDistinct*5), 34, 62);
  S.lastIdeoNote = "";
  const base = pm.base;
  SEGMENTS.forEach(g=>{ S.seg[g.id] = clamp(base + ri(-6,6) + (g.id==="youth"? (pm.pop-65)/4 : 0), 15, 90); });
  /* 経歴（出発点・役職）による層別の第一印象 */
  if(pm.segFx){ Object.keys(pm.segFx).forEach(k=>{ if(S.seg[k]!=null) S.seg[k] = clamp(S.seg[k] + pm.segFx[k], 15, 90); }); }
  /* 首相自身の年齢も世代別の第一印象に効く：若い首相は若年層に、ベテラン首相は高齢層に安心感 */
  if(S.pmAge && S.pmAge<=50){ S.seg.youth = clamp(S.seg.youth+3, 15, 90); S.seg.elderly = clamp(S.seg.elderly-1, 15, 90); }
  else if(S.pmAge && S.pmAge>=65){ S.seg.elderly = clamp(S.seg.elderly+2, 15, 90); S.seg.youth = clamp(S.seg.youth-1, 15, 90); }
  S.approval = Math.round(overallFromSeg()); S.prevApproval = S.approval;
  S.maxApproval = S.approval; S.minApproval = S.approval;
  S.approvalHist = [S.approval];
  /* 衆院は直近選挙後という設定で残り任期をランダム化、参院選も */
  S.hrTermLeft = ri(10, 44);
  S.hcTermLeft = ri(8, 34);
  coalitionStep();
}

/* ---------------- 連立選択（就任時：パートナーは最大4党＝五党連立まで選べる） ---------------- */
let coalitionDraft = []; /* 連立協議で選択中のパートナー党ID（最大で COALITION_MAX_PARTNERS 個） */
function coalitionStep(){
  /* 衆院で単独過半数を持っていても、連立協議は必ず表示する。
     参院では自党が少数であることが多く、連立には政権基盤の安定や参院対策として

}

    <div class="card mb"><b>選択中の枠組み：</b>${coalitionDraft.length? esc(selNames) + esc(coalitionFrameLabel(coalitionDraft.length)) : "まだ選んでいない"}
      <div class="kv"><span>連立後の衆院議席</span><b>${tot}議席（${tot>=need?"過半数を確保":"過半数まであと"+(need-tot)+"議席"}）</b></div>
      ${coalitionDraft.map(id=>{ const c = coalitionCondition(id); return `<div class="kv"><span>${esc(partyById(id).name)}の協力の条件</span><b>${esc(c.label)}</b></div>`; }).join("")}

        ${p.isNewParty?`<div class="desc">ゲーム中に登場した新党（${esc(p.kindLabel||"")}／党首：${esc(p.leader||"")}${p.leaderTitle?`＝${esc(p.leaderTitle)}`:""}）</div>`:""}
        <div class="desc">衆院${S.hrSeats[p.id]}議席・参院${S.hcSeats[p.id]||0}議席 ／ この党を加えると衆院合計 ${own + selSeats + (sel?0:(S.hrSeats[p.id]||0))}議席</div>

        <div class="desc">立ち位置：<b>${esc(describeIdeo(p.ideo))}</b> ／ 自党とのイデオロギー距離：<b>${ideoDistLabel(p.id)}</b></div>

function toggleCoalitionParty(partyId){
  const i = coalitionDraft.indexOf(partyId);
  if(i>=0) coalitionDraft.splice(i,1);
  else{
    if(coalitionDraft.length>=COALITION_MAX_PARTNERS){ alertInPage("連立パートナーは最大4党までです（自党と合わせて五党連立まで）"); return; }
    coalitionDraft.push(partyId);
  }
  renderCoalitionPicker(false, true);
}
function confirmCoalitionSelection(){
  if(!coalitionDraft.length) return;
  pushUndo("coalition", "連立協議", {});
  const ids = coalitionDraft.slice(0, COALITION_MAX_PARTNERS);
  S.coalition = {partyId:ids[0], rel: coalitionStability(ids[0]), since: 0,
    partner2:null, partner2Rel:null, partner2Since:null, partner3:null, partner3Rel:null, partner3Since:null, partner4:null, partner4Rel:null, partner4Since:null};
  let prev = ids[0];
  ids.slice(1).forEach((pid, i)=>{
    /* 追加パートナーは、直前のパートナーとの距離が遠いほど関係の土台が少し弱くなる（従来の partner2 と同じ考え方） */
    const cross = ideoDist(partyIdeo(prev), partyIdeo(pid));
    const f = coalitionSlotFields(i+1);
    S.coalition[f.id] = pid;
    S.coalition[f.rel] = clamp(coalitionStability(pid) - Math.round(cross*3), 22, 92);
    S.coalition[f.since] = 0;
    prev = pid;
  });
  /* 協議で提示された条件は、各パートナーとの「約束」として coalitionTerms に記録する
     （履行状況は見直し画面の「関係の内訳」で追え、ポストの約束は既存の関係減衰にも効く） */
  ids.forEach(pid=>{
    const t = coalitionOfferTerms(pid);
    S.coalitionTerms[pid] = {postDemand:t.postDemand, field:t.cond.field, label:t.cond.label, dueTurn:S.turn+2, promiseLabel:t.cond.label, promiseTurn:S.turn};
  });
  const names = ids.map(id=>partyById(id).name).join("・");
  S.coalitionHist.push(ids.length>=2 ? `${names}との${coalitionSizeLabel(ids.length)}で発足` : `${names}と連立を組んで発足`);
  coalitionDraft = [];
  cabinetStep(true);
}
function coalitionCondition(partyId){
  const _np = partyById(partyId);
  if(_np && _np.condField) return {field:_np.condField, label:_np.condLabel||"政策面での配慮", desc:_np.condDesc||"重視する政策への配慮を求める"};
  const map = {
    gomei:{field:"child", label:"子育て・福祉の拡充", desc:"子育て支援と社会保障の後退は認めない姿勢"},
    ishin:{field:"reform", label:"行財政改革の推進", desc:"改革に後ろ向きな政策が続くと不満が高まる"},
    dpfp:{field:"tax", label:"手取りを増やす減税路線", desc:"増税や負担増の政策には強く反発する"},
    cdp:{field:"energy", label:"原発に慎重なエネルギー政策", desc:"再稼働の強行は連立の継続を難しくする"},
    ldp:{field:"defense", label:"安全保障政策の着実な推進", desc:"防衛力強化の後退は認めない姿勢"},
    sansei:{field:"local", label:"地方と農業の保護", desc:"地方・農業を軽視する政策には反発する"},
    inochi:{field:"welfare", label:"積極財政と給付の拡充", desc:"緊縮路線とは相容れない"},
    jcp:{field:"defense", label:"防衛費抑制と平和外交", desc:"防衛増強の推進は連立の継続を難しくする"},
    minshu:{field:"child", label:"生活者ファーストと暮らし支援", desc:"食料品の消費税ゼロなど「生活者ファースト」の看板を軽んじる判断には反発する"},
    mirai:{field:"reform", label:"デジタル化と現役世代の負担軽減", desc:"行政のデジタル化と現役世代の社会保険料負担の軽減に後ろ向きな姿勢には敏感に反応する"},
    hoshu:{field:"defense", label:"安全保障の強化と伝統の尊重", desc:"スパイ防止法の制定など安保強化と、伝統的価値観の後退は認めない姿勢"},
    sdp:{field:"welfare", label:"社会保障の充実と平和主義", desc:"社会保障の切り下げや防衛増強の推進は連立の継続を難しくする"},
  };
  return map[partyId] || {field:"econ", label:"経済政策での協力", desc:"経済運営での協力を求める"};
}
function coalitionStability(partyId){
  const a = partyById(S.pmParty).stance, b = partyById(partyId).stance;
  let same = 0, keys = Object.keys(a);
  keys.forEach(k=>{ if(a[k]===b[k]) same++; });
  /* イデオロギー軸の距離が大きい連立ほど、土台の安定度は下がる */
  const dist = ideoDist(partyIdeo(S.pmParty), partyIdeo(partyId));
  /* 政策協力などで積み上がった野党との関係（好感度）も、連立の土台の安定に少し効く */
  const goodwill = (typeof oppRelOf==="function" && S && S.oppRel) ? (oppRelOf(partyId)||0) : 0;
  return clamp(Math.round(46 + same*8 - dist*5 + ri(0,8) + goodwill*0.25), 25, 92);
}
function ideoDistLabel(partyId){
  const d = ideoDist(partyIdeo(S.pmParty), partyIdeo(partyId));
  return d<=1.2 ? "近い（政策で揺れにくい）" : d<=2.4 ? "やや離れている" : "大きく離れている（政策のたびに関係が揺れやすい）";
}
function chooseCoalition(partyId){
  if(partyId){ coalitionDraft = [partyId]; confirmCoalitionSelection(); return; }
  pushUndo("coalition", "連立協議", {});
  coalitionDraft = [];
  const need = Math.floor(HR_TOTAL/2)+1;
  S.coalitionHist.push((S.hrSeats[S.pmParty]||0) >= need ? "単独政権で発足" : "少数与党で発足");
  cabinetStep(true);
}

/* ---------------- 連立の見直し（通常月からプレイヤー主導で追加・変更・除外） ----------------
   勧誘の実行とパートナーの除外は、その月の行動を消費し（月末処理へ進む）、
   さらに3か月間は再実行できないクールダウンが入る。眺めるだけ・やめるだけでは消費しない。 */
function coalitionReviewReady(){ return S.turn >= (S.coalitionNextReview||0); }
function coalitionReviewWaitMonths(){ return Math.max(0, (S.coalitionNextReview||0) - S.turn); }
function coalitionOfferTerms(pid){
  const cond = coalitionCondition(pid);
  const dist = coalitionDistTo(pid);
  /* イデオロギー距離が遠い相手ほど、ポストの要求が重くなり、成立の見通しも下がる */
  let postDemand = 0;
  if(dist>=2.5) postDemand = 2;
  else if(dist>=1.5) postDemand = 1;
  else if((S.hrSeats[pid]||0)>=90) postDemand = 1;
  /* パートナーが増えても、要求ポストの合計が上限（8ポスト）を超えないよう頭打ちにする。
     組閣は全16ポストしかなく、要求の総量が膨らむと配分自体が破綻するため */
  postDemand = cappedPostDemand(pid, postDemand);
  const success = clamp(Math.round(93 - dist*13 + (S.approval-50)*0.35 + (totalGovHR()<233?6:0) - postDemand*3), 42, 96);
  /* 交渉の場で相手が口にする提示条件：協力条件（その党のイデオロギー・看板分野）から生成する。
     受け入れると S.coalitionTerms に「約束」として記録され、履行状況が見直し画面の内訳で追える */
  return {cond, dist, postDemand, success,
    want: `協力条件「${cond.label}」に沿う政策を実行すること`,
    avoid: `協力条件「${cond.label}」に反する政策を強行しないこと`,

  /* 実行した時点で今月の行動を消費し、クールダウンに入る */
  S.coalitionNextReview = S.turn + 3;
  const success = Math.random()*100 < t.success;
  if(success){
    let rel = coalitionStability(pid);
    coalitionPartnerIds().forEach(other=>{ rel -= Math.round(ideoDist(partyIdeo(other), partyIdeo(pid))*2); });
    rel = clamp(rel - t.postDemand*2, 24, 92);
    const wasMinority = totalGovHR() < Math.floor(HR_TOTAL/2)+1;
    const slot = addCoalitionPartner(pid, rel, S.turn);
    S.coalitionTerms[pid] = {postDemand:t.postDemand, field:t.cond.field, label:t.cond.label, dueTurn:S.turn+2, promiseLabel:t.cond.label, promiseTurn:S.turn};

      quoteWho:`${p.name}の幹部`, quote:"条件を尊重してもらえるのなら、全力で政権を支えていく",

function executeCoalitionRemoval(pid){

/* ---------------- 内閣まわりのセーブ移行（16ポスト化・代数・歴代マイルストーン） ----------------
   7ポスト時代の旧セーブでは cabinet に新ポストのキーが無い。新ポストは「空席（null）」
   として補い、プレイヤーが内閣改造の既存フローで後から指名できるようにする。
   あわせて内閣の代数・改造回数・歴代超えニュースの既報リストもデフォルトで補う
   （旧セーブで過去に行った改造は遡って数えられない。代数=1・改造0回から数え直す仕様）。
   何度呼んでも安全（冪等） */
function ensureCabinetFields(){
  if(!S) return;
  if(!S.cabinet || typeof S.cabinet!=="object") S.cabinet = {};
  POSTS.forEach(p=>{ if(!(p.id in S.cabinet)) S.cabinet[p.id] = null; });
  if(typeof S.cabinetGen!=="number" || S.cabinetGen < 1) S.cabinetGen = 1;
  if(typeof S.reshuffleCount!=="number" || S.reshuffleCount < 0) S.reshuffleCount = 0;
  if(!Array.isArray(S.histMilestones)) S.histMilestones = [];
}
/* 時間差政策（ストック型）・ねじれ国会の野党取引より前のセーブには、新フィールドをデフォルトで
   補ってそのまま続けられるようにする（ensureCabinetFields と同じ流儀のマイグレーション） */
function ensureGrowthFields(){
  if(!S) return;
  if(!Array.isArray(S.stockPolicies)) S.stockPolicies = [];
  if(!Array.isArray(S.pendingStockNews)) S.pendingStockNews = [];
  if(typeof S.lastNegotiateTurn!=="number") S.lastNegotiateTurn = -99;
  if(S.pendingNegotiate===undefined) S.pendingNegotiate = null;
  if(S.surveyOmen===undefined) S.surveyOmen = null;
  if(S.omenOutcome===undefined) S.omenOutcome = null;
  if(S.lastElectionReasons===undefined) S.lastElectionReasons = null;
}
/* 出生率システムより前のセーブには、出生率フィールドをデフォルトで補ってそのまま続けられるようにする。
   出生率は悪化しても支持率には一切影響させず、改善したときだけニュースと支持率アップで報いる */
function ensureBirthFields(){
  if(!S) return;
  if(typeof S.birthRate!=="number") S.birthRate = 1.00;
  if(S.birthRate < 0.80) S.birthRate = 0.80;
  if(typeof S.birthStart!=="number") S.birthStart = S.birthRate;
  if(typeof S.birthNewsMark!=="number") S.birthNewsMark = S.birthStart;
  if(!Array.isArray(S.pendingBirthNews)) S.pendingBirthNews = [];
}
/* n か月後の年月（{y, m, label}）。ストック型政策の発現予定表示に使う */
function ymAfter(months){
  const t = S.year*12 + (S.month-1) + months;
  const y = Math.floor(t/12), m = t%12 + 1;
  return { y:y, m:m, label:`${y}年${m}月` };
}
/* 現在の S.year/S.month から見て、dueTurn（ターン番号）が何年何月か */
function ymOfTurn(turn){
  const ahead = turn - S.turn;
  return ymAfter(ahead);
}
/* ストック成熟時の見込み効果の要約文（対象層と景気の向き） */
function stockEffSummary(eff){
  if(!eff) return "効果は穏やか";
  const parts = [];
  if(eff.seg) Object.keys(eff.seg).forEach(k=>{
    if(eff.seg[k] > 0){ const g = SEGMENTS.find(x=>x.id===k); if(g) parts.push(`${g.name.split("（")[0]}の支持が上向く`); }
  });
  if(eff.econ > 0) parts.push("景気にも追い風");
  else if(eff.econ < 0) parts.push("景気には向かい風");
  return parts.length ? parts.join("／") : "効果は穏やか";
}

/* 現在の内閣名（現実の命名慣例）：改造0回=「第n次○○内閣」／1回=「第n次○○改造内閣」／
   2回以上=「第n次○○第m次改造内閣」 */
function cabinetName(){
  if(!S || !S.pmName) return "";
  const g = (typeof S.cabinetGen==="number" && S.cabinetGen >= 1) ? S.cabinetGen : 1;
  const m = (typeof S.reshuffleCount==="number" && S.reshuffleCount > 0) ? S.reshuffleCount : 0;
  if(m === 1) return `第${g}次${S.pmName}改造内閣`;
  if(m >= 2) return `第${g}次${S.pmName}第${m}次改造内閣`;
  return `第${g}次${S.pmName}内閣`;
}

/* ---------------- 議員ロスター（不祥事履歴・経験・新陳代謝） ---------------- */
function ensureRosterFields(){
  if(!S) return;
  if(!S.scandalHist || typeof S.scandalHist!=="object") S.scandalHist = {};
  if(!Array.isArray(S.rosterNew)) S.rosterNew = [];
  if(!Array.isArray(S.rosterRetired)) S.rosterRetired = [];
  if(!S.expBonus || typeof S.expBonus!=="object") S.expBonus = {};
  if(!Array.isArray(S.rosterLog)) S.rosterLog = [];
  if(!Array.isArray(S.pendingRetireNews)) S.pendingRetireNews = [];
  if(!S.partyHistExtra || typeof S.partyHistExtra!=="object") S.partyHistExtra = {};
  if(!Array.isArray(S.pendingTurnoverNews)) S.pendingTurnoverNews = [];
  if(!("pendingTransferOffer" in S)) S.pendingTransferOffer = null;
  if(!Array.isArray(S.transferDeclined)) S.transferDeclined = [];
}
function histOf(name){ ensureRosterFields(); return (name && S.scandalHist[name]) || []; }
function expOf(m){ return (m && S && S.expBonus && S.expBonus[m.name]) || 0; }
function effSkill(m){ return clamp((m.skill||0) + expOf(m), 30, 98); }
/* 不祥事の履歴がある議員は、再び問題を起こすリスクも少し上がる（上げ幅は控えめにして再発の連鎖を防ぐ） */
function effRisk(m){ if(!m) return 20; return clamp((m.risk||0) + histOf(m.name).length*4, 0, 95); }
function scandalHtml(m){
  const h = histOf(m.name);
  if(!h.length) return "";
  const items = h.slice(-3).map(x=>`${x.year}年${x.month}月に${x.label}`).join("／");
  return `<div class="desc" style="color:var(--red)"><b>過去の不祥事：</b>${esc(items)}${h.length>3?`（ほか${h.length-3}件）`:""} ― 起用には任命責任を問われるリスクがある</div>`;
}
function scandalChip(m){ const h = histOf(m.name); return h.length ? `<span class="chip warn">不祥事歴 <b>${h.length}件</b></span>` : ""; }
/* 有効な閣僚候補プール：素のプール＋途中加入の新人 − 引退者（ただし現職大臣は引退扱いにしない） */
function ministerPoolAll(){
  ensureRosterFields();
  const retired = new Set(S.rosterRetired||[]);
  const serving = new Set(POSTS.map(p=>S.cabinet[p.id]).filter(Boolean).map(m=>m.name));
  if(S.electionChief) serving.add(S.electionChief.name);
  return MINISTER_POOL.concat(S.rosterNew||[]).filter(m=> !retired.has(m.name) || serving.has(m.name));
}
function scarcestSpec(partyId){
  const specs = ALL_SPECS;
  const pool = ministerPoolAll().filter(m=>m.party===partyId);
  let best = specs[0], bn = 1e9;
  specs.forEach(sp=>{ const n = pool.filter(m=>m.spec===sp).length; if(n<bn){ bn=n; best=sp; } });
  return best;
}
function makeNewcomer(partyId){
  const used = new Set(ministerPoolAll().map(m=>m.name).concat((S.rosterRetired||[])));
  const dispAge = ri(29, 45);
  const name = genSaveFicName(used, dispAge) || ("無名 新人" + (S.rosterNew.length+1));
  return {
    name, party:partyId, spec: scarcestSpec(partyId),
    skill: ri(54, 67), pop: ri(48, 66), debate: ri(52, 68), risk: ri(12, 30),
    fic:true, fresh:true,
    note: `架空の人物：${S.year}年に初当選した新人議員`,
    age: dispAge - (S.year-2026), terms: 1,
  };
}
/* 選挙・年次の節目でロスターを入れ替える：与党各党に新人を1人ずつ補充し（最も候補が薄い分野へ）、
   現職大臣でない高齢・多選の議員は一定確率で引退する。在任閣僚は経験ボーナスを積む */
function rosterTurnover(reason){
  ensureRosterFields();
  const isElection = reason === "election";
  const added = [];
  govPartyIds().forEach(pid=>{
    if(!isElection && Math.random() < 0.35) return; /* 年次では控えめに */
    const nc = makeNewcomer(pid);
    S.rosterNew.push(nc);
    added.push(`${partyById(pid)?partyById(pid).short:pid}の${nc.name}（${nc.spec}担当・新人）`);
  });
  POSTS.forEach(p=>{ const m = S.cabinet[p.id]; if(m && !m.civilian) S.expBonus[m.name] = (S.expBonus[m.name]||0) + 1; });
  if(S.electionChief) S.expBonus[S.electionChief.name] = (S.expBonus[S.electionChief.name]||0) + 1;
  let retiredMsg = "";
  if(Math.random() < (isElection ? 0.6 : 0.35)){
    const serving = new Set(POSTS.map(p=>S.cabinet[p.id]).filter(Boolean).map(m=>m.name));
    /* 架空議員の引退はこちらで扱う。実在議員は下の「勇退」判定（年齢確率・ニュース付き）に一本化する */
    const cands = MINISTER_POOL.filter(m=> m.fic && !serving.has(m.name) && m.name!==S.pmName
      && !(S.electionChief && m.name===S.electionChief.name)
      && !S.rosterRetired.includes(m.name)
      && ((ageOf(m)||0) >= 72 || termsOf(m) >= 11));
    if(cands.length){
      const r = pick(cands);
      S.rosterRetired.push(r.name);
      retiredMsg = ` ${r.name}氏は高齢・多選を理由に政界を引退し、候補から外れた。`;
    }
  }
  /* 実在議員の勇退：75歳から年齢に応じて確率が上がり（75〜79歳8%／80〜84歳25%／85〜89歳50%／
     90歳以上90%）、90歳を超えて残るのは稀なケースになる。
     現職大臣・選対委員長・首相・党首級（首相候補）は対象外。一度に去るのは最大2人まで。
     勇退した議員は rosterRetired に残り続け、二度と候補に戻らない（セーブを再開しても復活しない）。
     与党の議員が勇退した場合は、その党の大臣候補プールに新人の架空議員を1人補充する（議席数は変えない） */
  const leaderNames = new Set(PM_CANDIDATES.map(c=>c.name));
  const servingNow = new Set(POSTS.map(p=>S.cabinet[p.id]).filter(Boolean).map(m=>m.name));
  const realCands = shuffle(MINISTER_POOL.filter(m=> !m.fic && !servingNow.has(m.name)
    && m.name!==S.pmName && !(S.electionChief && m.name===S.electionChief.name)
    && !leaderNames.has(m.name) && !S.rosterRetired.includes(m.name)));
  const retirees = [];
  realCands.forEach(m=>{
    if(retirees.length >= 2) return;
    if(Math.random() < retireChanceOf(ageOf(m)||0)) retirees.push(m);
  });
  retirees.forEach(m=>{
    S.rosterRetired.push(m.name);
    let replacement = "";
    if(isGovParty(m.party)){
      const nc = makeNewcomer(m.party);
      S.rosterNew.push(nc);
      replacement = nc.name;
      added.push(`${partyById(m.party)?partyById(m.party).short:m.party}の${nc.name}（${nc.spec}担当・新人／${m.name}氏の勇退に伴う補充）`);
    }
    S.pendingRetireNews.push({ name:m.name, party:m.party, age:ageOf(m)||0, terms:termsOf(m), replacement });
    retiredMsg += ` ${m.name}氏（${ageOf(m)}歳）が勇退し、政界を引退した。`;
  });
  if(added.length || retiredMsg){
    const msg = `${isElection?"選挙":"年次"}を経て、候補の顔ぶれが入れ替わった。${added.length?`新たに候補に加わった：${added.join("、")}。`:""}${retiredMsg}`;
    S.rosterLog.push(msg);
    if(S.rosterLog.length > 6) S.rosterLog.shift();
  }
  turnoverMoves();
}
/* ---------------- 議員の新陳代謝：政党移籍・知事選出馬による辞職 ----------------
   勇退と同じ設計：判定は年次・選挙の節目だけ（月次では起きない）、対象は現職大臣・選対委員長・
   首相・党首級（首相候補）を除くプール議員、退場は rosterRetired に記録してこのセーブでは復活しない。
   発生確率：移籍は節目ごとに30%で最大1人、知事選辞職は節目ごとに22%で最大1人 */
const GOVERNOR_PREF = { "細野 豪志":"静岡県", "石破 茂":"鳥取県", "河野 太郎":"神奈川県", "小泉 進次郎":"神奈川県",
  "林 芳正":"山口県", "茂木 敏充":"栃木県", "高市 早苗":"奈良県", "野田 佳彦":"千葉県", "玉木 雄一郎":"香川県",
  "泉 健太":"北海道", "枝野 幸男":"埼玉県", "辻元 清美":"大阪府", "前原 誠司":"京都府", "馬場 伸幸":"大阪府",
  "福島 瑞穂":"宮崎県", "萩生田 光一":"東京都", "加藤 勝信":"岡山県", "斎藤 健":"千葉県", "西村 康稔":"兵庫県" };
function turnoverEligible(){
  const serving = new Set(POSTS.map(p=>S.cabinet[p.id]).filter(Boolean).map(m=>m.name));
  const leaderNames = new Set(PM_CANDIDATES.map(c=>c.name));
  return ministerPoolAll().filter(m=> !m.civilian && m.party!=="civilian" && !serving.has(m.name)
    && m.name!==S.pmName && !(S.electionChief && m.name===S.electionChief.name)
    && !leaderNames.has(m.name) && !(S.rosterRetired||[]).includes(m.name));
}
function turnoverMoves(){
  ensureRosterFields();
  /* 政党移籍：移籍先はイデオロギー距離で制限する（考えが違いすぎる移籍は起こさない）。
     通常は距離2.4以内の党だけが移籍先になり得る。ただし本人が「現実派・中道寄り」と分かる人物
     （プロフィールの派閥・人物像に中道／現実／穏健／超党派／改革派などの色がある、または人望の厚い架空議員）は、
     距離3.4以内の橋渡し的な移籍があり得る。距離3.4を超える両極端のジャンプ（保守系↔リベラル系など）は常時禁止。
     議席は移籍元−1／移籍先＋1で総数を変えない。党歴には移籍先が「ゲーム内移籍」として自動で末尾に足される */
  if(Math.random() < 0.30){
    const cands = turnoverEligible();
    if(cands.length){
      const m = pick(cands);
      const from = partyById(m.party);
      const bridge = isBridgeType(m);
      const maxDist = bridge ? 3.4 : 2.4;
      const dests = PARTIES.filter(p=> p.id!==m.party && p.id!=="other" && !p.isNewParty && !isDormantParty(p.id))
        .map(p=>({p, d:ideoDist(partyIdeo(m.party), partyIdeo(p.id))}))
        .filter(x=> x.d <= maxDist)
        .sort((a,b)=>a.d-b.d).slice(0,2);
      if(from && dests.length){
        /* 自分の党への移籍は自動で成立させず、プレイヤーへの打診イベントにする（頻度は低く抑える） */
        const toMine = dests.find(x=>x.p.id===S.pmParty);
        if(toMine && !isGovParty(m.party) && !S.pendingTransferOffer && !(S.transferDeclined||[]).includes(m.name) && Math.random() < 0.55){
          S.pendingTransferOffer = { name:m.name, from:m.party, fromName:from.name };
          S.rosterLog.push(`${m.name}氏から${from.name}への移籍の打診があった。`);
          if(S.rosterLog.length > 6) S.rosterLog.shift();
        } else {
          const auto = dests.filter(x=>x.p.id!==S.pmParty);
          if(auto.length) doTransfer(m, pick(auto).p, false);
        }
      }
    }
  }
  /* 知事選出馬による議員辞職：地元都道府県の知事選に出る設定。当選・落選いずれでもプールには戻らない。
     与党議員の場合は勇退と同じ扱いで新人を1人補充し、議席数は変えない */
  if(Math.random() < 0.22){
    const cands = turnoverEligible().filter(m=>{ const a = ageOf(m); return a==null || (a>=38 && a<=70); });
    if(cands.length){
      const m = pick(cands);
      const won = Math.random() < 0.45;
      S.rosterRetired.push(m.name);
      let replacement = "";
      if(isGovParty(m.party)){
        const nc = makeNewcomer(m.party);
        S.rosterNew.push(nc);
        replacement = nc.name;
      }
      S.pendingTurnoverNews.push({ kind:"governor", name:m.name, party:m.party, pref:GOVERNOR_PREF[m.name]||"", won, replacement });
      S.rosterLog.push(`${m.name}氏が知事選出馬のため議員を辞職した（${won?"当選":"落選"}）。`);
      if(S.rosterLog.length > 6) S.rosterLog.shift();
    }
  }
}
/* 「橋渡し型」の人物か：プロフィールの派閥・人物像・経歴に、中道／現実／穏健／超党派／改革派といった
   色が見える人物（例：野党にいながら与党の考えを理解するタイプ）は、やや距離の離れた党への移籍もあり得る。
   架空議員は人望の厚い人物（人気64以上）を柔軟なタイプとして扱う */
function isBridgeType(m){
  if(!m) return false;
  try{
    const pr = profileOf(m);
    const text = `${pr.group||""} ${pr.trait||""} ${pr.bg||""} ${m.note||""}`;
    if(/中道|現実|穏健|超党派|改革派|是々非々|政策通/.test(text)) return true;
  }catch(e){}
  return !!m.fic && (m.pop||0) >= 64;
}
/* 移籍の実処理：所属の書き換え、議席の移動、党歴への「ゲーム内移籍」追加、ニュース待ちへの登録 */
function doTransfer(m, to, viaOffer){
  const from = partyById(m.party);
  if(!from || !to || to.id===m.party) return;
  const seatMap = (S.hrSeats && (S.hrSeats[m.party]||0) > 0) ? S.hrSeats : S.hcSeats;
  if(seatMap){ if((seatMap[m.party]||0) > 0) seatMap[m.party]--; seatMap[to.id] = (seatMap[to.id]||0) + 1; }
  const fromName = from.name;
  const wasGov = isGovParty(m.party);
  m.party = to.id;
  if(S.partyHistExtra[m.name]) S.partyHistExtra[m.name] += ` → ${to.name}`;
  else if(PARTY_HISTORY[m.name]) S.partyHistExtra[m.name] = ` → ${to.name}`;
  else S.partyHistExtra[m.name] = `${fromName} → ${to.name}`;
  if(!viaOffer){
    S.pendingTurnoverNews.push({ kind:"transfer", name:m.name, from:fromName, to:to.name, wasGov, nowGov:isGovParty(to.id) });
  }
  S.rosterLog.push(`${m.name}氏が${fromName}を離れ、${to.name}へ移籍した。`);
  if(S.rosterLog.length > 6) S.rosterLog.shift();
}
/* 自党への移籍打診：受け入れる／断る（postCrisisCheck から呼ばれる） */
function renderTransferOffer(){

function acceptTransferOffer(){
  const o = S.pendingTransferOffer; S.pendingTransferOffer = null;
  if(!o){ postCrisisCheck(); return; }
  const m = ministerPoolAll().find(x=>x.name===o.name);
  const to = partyById(S.pmParty);
  if(!m || !to){ postCrisisCheck(); return; }
