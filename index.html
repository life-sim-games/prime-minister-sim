      kicker:"政界", title: tr && gv ? "永田町に新陳代謝 ― 移籍と辞職" : (tr ? `${esc(tr.name)}氏が${esc(tr.to)}へ移籍` : `${esc(gv.name)}氏が知事選出馬で議員辞職`),
      sub:"議員の出入りで、候補の顔ぶれが変わる",
      body: parts.join(""),
      btn:"政権運営に戻る", fn:"postCrisisCheck()"
    });
    return;
  }
  /* 自党への移籍打診：自動では成立させず、プレイヤーが受け入れるか断るかを選ぶ */
  if(S.pendingTransferOffer && renderTransferOffer()) return;
  /* 空席ポストの補充（更迭・連立離脱で閣僚が退任した場合） */
  if(S.pendingReshuffle){
    S.pendingReshuffle = false;
    cabinetStep(false);
    return;
  }
  /* 選挙の到来チェック */
  if(S.hcTermLeft <= 0){ startElection("hc"); return; }
  if(S.hrTermLeft <= 0){ startElection("hr", false); return; }
  /* 終了条件：支持率低迷の継続 → 退陣圧力 */
  if(S.lowStreak >= 3 || (S.approval < 18 && S.lowStreak>=2)){
    gameOver("支持率の低迷が続き、党内から公然と退陣を求める声が上がった。首相は「責任を取る」として辞意を表明した。");
    return;
  }
  if(S.partyRel < 12){
    gameOver("党内基盤が崩壊し、総裁の座を維持できなくなった。首相は辞意を表明した。");
    return;
  }
  /* 党内基盤の自然変動：支持率が低いと確実に蝕まれる */
  if(S.approval < 36) S.partyRel = clamp(S.partyRel + rnd(-3.6,-0.8), 0, 100);
  else if(S.approval < 45) S.partyRel = clamp(S.partyRel + rnd(-1.4,0.7), 0, 100);
  else S.partyRel = clamp(S.partyRel + rnd(-0.2,1.6), 0, 100);
  /* 野党側からの連立・協力の打診（まれ）：少数与党・低迷・選挙接近のときに起こりうる */
  if(maybeIncomingOffer()) return;
  renderMain();
}

/* ---------------- 勢力チャート（半円・へミサイクル） ----------------
   新聞・ニュースで見る国会勢力図のように、議席を党派カラーの半円ドーナツで描く。
   左から与党ブロック（自党→連立相手）→野党（議席順）に敷き詰め、中央上に過半数ラインを示す。
   seatsMap/beforeMap は {partyId: 議席数}。beforeMap があれば凡例に増減も出す */
function _polar(cx, cy, r, deg){ const rad = deg*Math.PI/180; return [cx + r*Math.cos(rad), cy - r*Math.sin(rad)]; }
function _segPath(cx, cy, rO, rI, a0, a1){
  const [x0,y0] = _polar(cx,cy,rO,a0), [x1,y1] = _polar(cx,cy,rO,a1);
  const [x2,y2] = _polar(cx,cy,rI,a1), [x3,y3] = _polar(cx,cy,rI,a0);
  const large = (a0-a1) > 180 ? 1 : 0;
  return `M${x0.toFixed(1)},${y0.toFixed(1)} A${rO},${rO} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} A${rI},${rI} 0 ${large} 0 ${x3.toFixed(1)},${y3.toFixed(1)} Z`;
}
/* 勢力表示の並び順：与党ブロック（自党→連立パートナーの順）をひと続きに置き、
   続けて野党を議席の多い順に並べる。与党と野党が混ざらないので、過半数との
   位置関係と与党合計が一目で分かる。seatsMap があればその議席で野党を並べ替える */
function dietOrderedParties(seatsMap){
  const govIds = S ? govPartyIds() : [];
  const gov = govIds.map(id=>partyById(id)).filter(Boolean).filter(p=>!isDormantParty(p.id));
  const rest = PARTIES.filter(p=>!govIds.includes(p.id) && !isDormantParty(p.id)).sort((a,b)=>{
    const sa = seatsMap ? (seatsMap[a.id]||0) : ((S? (S.hrSeats[a.id]||0)+(S.hcSeats[a.id]||0) : 0));
    const sb = seatsMap ? (seatsMap[b.id]||0) : ((S? (S.hrSeats[b.id]||0)+(S.hcSeats[b.id]||0) : 0));
    return sb - sa;
  });
  return gov.concat(rest);
}
function hemicycleHtml(kind, seatsMap, beforeMap){
  const total = kind==="hc" ? HC_TOTAL : HR_TOTAL;
  const house = kind==="hc" ? "参議院" : "衆議院";
  const majority = Math.floor(total/2)+1;
  const entries = dietOrderedParties(seatsMap).filter(p=> (seatsMap[p.id]||0) > 0);
  const sum = entries.reduce((s,p)=>s+(seatsMap[p.id]||0),0) || total;
  const cx=200, cy=158, rO=118, rI=70;
  let acc = 0, paths = "", labels = "";
  entries.forEach(p=>{
    const seats = seatsMap[p.id]||0;
    const f0 = acc/sum, f1 = (acc+seats)/sum; acc += seats;
    let a0 = 180 - f0*180, a1 = 180 - f1*180;
    const gap = seats/sum*180 > 3 ? 0.7 : 0.25;
    a0 -= gap/2; a1 += gap/2; if(a0<=a1) return;
    paths += `<path d="${_segPath(cx,cy,rO,rI,a0,a1)}" fill="${p.color}" stroke="rgba(255,255,255,.65)" stroke-width="0.7"><title>${esc(p.name)} ${seats}議席</title></path>`;
    if(seats/sum*180 >= 13){
      const mid = (a0+a1)/2; const [lx,ly] = _polar(cx,cy,(rO+rI)/2,mid);
      labels += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.5">${seats}</text>`;
    }
  });
  const [mx1,my1] = _polar(cx,cy,rO+9,90), [mx2,my2] = _polar(cx,cy,rI-9,90);
  const legend = entries.map(p=>{
    const seats = seatsMap[p.id]||0;
    let d = "";
    if(beforeMap){ const dv = seats - (beforeMap[p.id]||0); if(dv>0) d = ` <span class="d-up">+${dv}</span>`; else if(dv<0) d = ` <span class="d-dn">${dv}</span>`; }
    const isGov = S && govPartyIds().includes(p.id);
    return `<span class="hl"><span class="party-dot" style="background:${p.color}"></span>${esc(p.short)}${p.isNewParty?'<span class="newparty-badge">新党</span>':""} <b>${seats}</b>${d}${isGov?" 与":""}</span>`;
  }).join("");
  return `<div class="hemi-wrap"><div class="hemi-title">${house}の勢力 ― 全${total}議席（過半数 ${majority}）</div>
  <svg viewBox="0 0 400 172" role="img" aria-label="${house}の議席配分チャート">${paths}
  <line x1="${mx1.toFixed(1)}" y1="${my1.toFixed(1)}" x2="${mx2.toFixed(1)}" y2="${my2.toFixed(1)}" stroke="#b3271e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="${cx}" y="${(my1-3).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b3271e">過半数 ${majority}</text>
  ${labels}
  <text x="${cx}" y="${cy-16}" text-anchor="middle" font-size="21" font-weight="800" fill="currentColor">${house.replace("議院","")} ${sum}</text>
  <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.65">与党 ${kind==="hc"?totalGovHC():totalGovHR()}議席</text>
  </svg><div class="hemi-legend">${legend}</div>
  <div class="hemi-sub">赤い破線が過半数ライン。並びは左から与党（自党→連立相手）→野党（議席順）で、与党はひと続きになっている。党の色の広さが議席数に比例する${beforeMap?"（凡例の数字は前回からの増減）":""}。</div></div>`;
}

/* ---------------- 新党の登場判定 ----------------
   選挙ごとに、まだ登場していない新党テンプレートから1つが初議席を得ることがある。
   確率は控えめにし（登場しない周回も普通にある）、初議席は1〜4に抑える。
   すでに登場した新党の伸びも選挙ごとに最大+5議席までに抑え、現実的な動きにする */
function maybeEmergeNewParty(kind){
  ensureDynamicParties();
  if((S.hrSeats["np_jushin"]!=null)){} /* noop guard */
  const remaining = NEW_PARTY_TEMPLATES.filter(t=>!S.newPartyDefs[t.id]);
  if(!remaining.length) return null;
  /* 登場は立て続けに起きない：前回の登場から20か月は空け、その上で3回に1回程度の確率にする。
     短い周回では1つも登場しないことも普通にある */
  if(typeof S.lastEmergenceTurn==="number" && S.turn - S.lastEmergenceTurn < 20) return null;
  if(Math.random() >= 0.34) return null;
  return emergeNewPartyNow(pick(remaining));
}

let electionCtx = null;
/* 院の所属：議員は衆議院か参議院のどちらか一方にだけ所属する。
   タレント候補は当選した時点で、その選挙の院の議員になる（house="hr"|"hc"）。
   まだ当選していない候補は house=null で、どちらの院の選挙にも出られる（落選後の鞍替えも可）。 */
function houseName(kind){ return kind==="hc" ? "参議院" : "衆議院"; }
function houseMemberLabel(kind){ return kind==="hc" ? "参議院議員" : "衆議院議員"; }
function houseElectionLabel(kind){ return kind==="hc" ? "参院選" : "衆院選"; }
/* 旧セーブ互換：所属院が記録されていない現職は、自然な既定として衆議院側として扱う */
function normalizeTalentRoster(){
  if(!S) return;
  if(!Array.isArray(S.talentRoster)) S.talentRoster = [];
  S.talentRoster.forEach(r=>{ if(r && r.house!=="hr" && r.house!=="hc") r.house = "hr"; });
}
function makeFreshTalent(usedNames, kind){
  return makeFreshCandidate(usedNames, kind, null);
}
/* 新規候補を1人作る。category: "talent"|"commoner"|null（nullなら抽選）。
   一般人は知名度控えめ・実務高め・失言低めで、プロフィール（学歴・経歴・政策・理由）まで付ける */
function makeFreshCandidate(usedNames, kind, category){
  const cat = category || (Math.random() < 0.52 ? "commoner" : "talent");
  const t = cat==="commoner" ? pick(COMMONER_TYPES) : pick(TALENT_TYPES);
  const ageBase = t.age ? ri(t.age[0], t.age[1]) : ri(26,58);
  const name = genSaveFicName(usedNames, ageBase) || ("候補 太郎" + usedNames.size);
  usedNames.add(name);
  const cand = {name, ...t, category:cat, age: ageBase - (S.year-2026), terms:0, house:null, candidateHouse: kind};
  return ensureCandidateProfile(cand);
}
/* 復元された選挙コンテキストの候補を点検する：もう片方の院の現職が混ざっていたら、
   その枠は新しい候補に差し替える（旧セーブで所属院が無い現職は衆院側として判定する） */
function sanitizeElectionTalents(ctx){
  if(!ctx || !Array.isArray(ctx.talents)) return;
  normalizeTalentRoster();
  const kind = ctx.kind;
  const rosterHouse = {};
  (S.talentRoster||[]).forEach(r=>{ rosterHouse[r.name] = r.house; });
  const usedNames = new Set((S.talentRoster||[]).map(r=>r.name));
  ctx.talents.forEach(t=>{ if(t) usedNames.add(t.name); });
  ctx.talents = ctx.talents.map(t=>{
    if(!t) return makeFreshTalent(usedNames, kind);
    if(t.returning){
      const h = (t.house==="hr"||t.house==="hc") ? t.house : (rosterHouse[t.name] || "hr");
      if(h !== kind) return makeFreshTalent(usedNames, kind);
      t.house = h;
    } else if(t.house!=="hr" && t.house!=="hc"){
      t.house = null;
    } else if(t.house !== kind){
      /* 当選済みの人物が新規候補として混ざることはない。万一あれば差し替える */
      return makeFreshTalent(usedNames, kind);
    }
    t.candidateHouse = kind;
    return t;
  });
  /* talentSel のキーはインデックス依存なので、差し替えが起きても選択状態の形はそのまま保つ */
}
function genTalentCandidates(n, kind){
  const targetKind = (kind==="hc"||kind==="hr") ? kind : (electionCtx && electionCtx.kind) || "hr";
  normalizeTalentRoster();
  const out = [];
  const usedNames = new Set((S.talentRoster||[]).map(r=>r.name));
  (S.talentRoster||[]).filter(t=>t.house===targetKind).slice(0,2).forEach(t=>{ const c = {...t, house:targetKind, candidateHouse:targetKind, returning:true}; out.push(ensureCandidateProfile(c)); usedNames.add(c.name); });
  const goal = n || 5;
  /* 顔ぶれの型を保証する：タレント1人・一般人2人を最低限入れ、残りは抽選でバラけさせる */
  const plan = ["talent","commoner","commoner"];
  while(out.length + plan.length < goal) plan.push(null);
  shuffle(plan).forEach(cat=>{ if(out.length < goal) out.push(makeFreshCandidate(usedNames, targetKind, cat)); });
  while(out.length < goal) out.push(makeFreshCandidate(usedNames, targetKind, null));
  return shuffle(out);
}
/* 擁立中のタレント候補の年齢・当選回数構成が、世代別支持に与える見込み */
function chosenTalentsNow(){

}
function slateEffects(chosen){
  let youth=0, elderly=0, all=0; const notes=[];
  let young=0, vet=0, segHit=false;
  chosen.forEach(t=>{
    const a = ageOf(t), tr = termsOf(t);
    if(a!=null && a<=40) young++;
    if(tr>=2 || (a!=null && a>=55)) vet++;
    if(a!=null && a<=35) youth += 1.3; else if(a!=null && a<=45) youth += 0.6;
    if(tr===0) youth += 0.3; /* 新人の「刷新感」 */
    if(tr>=3) elderly += 1.0; else if(tr>=1) elderly += 0.5;
    /* タイプごとの「知名度が効く層」：得意な層の掘り起こしが見込める */
    if(t.seg==="youth"){ youth += 0.7; segHit=true; }
    else if(t.seg==="elderly"){ elderly += 0.7; segHit=true; }
    else if(t.seg==="all"){ all += 0.5; segHit=true; }
    else if(t.seg){ all += 0.35; segHit=true; }
  });
  if(segHit) notes.push("各候補の知名度が「効く層」の掘り起こしが期待できます（候補カードの注記参照）。");
  if(chosen.length>=2 && young===chosen.length){ elderly -= 1.0; notes.push("若手だけの顔ぶれは勢いがある一方、高齢層の安心感はやや下がります。"); }
  if(chosen.length>=2 && vet===chosen.length){ youth -= 0.8; notes.push("ベテラン中心の顔ぶれは信頼感がある反面、「刷新感」が薄く若年層は伸びにくくなります。"); }
  if(young>0 && vet>0){ all += 0.8; notes.push("若手とベテランがそろった構成で、幅広い世代に訴求できます。"); }
  if(youth>0.5) notes.push("若い候補者の擁立は、若年層・無党派層への浸透が期待できます。");
  if(elderly>0.5) notes.push("当選回数の多い候補者は、高齢層と支持基盤からの信頼を集めます。");
  const r = v => Math.round(v*10)/10;
  return { youth:r(youth), elderly:r(elderly), all:r(all), notes };
}

const ALLOC_DEFS = {
  focus:{name:"接戦区に集中", bonus:0.030, widthMult:1.8},
  even:{name:"全国均等", bonus:0.010, widthMult:1.0},
  base:{name:"地盤の固め直し", bonus:0.018, widthMult:0.8},
};
function allocDef(alloc){ return ALLOC_DEFS[alloc] || ALLOC_DEFS.even; }
/* kind: "hr"|"hc"。opts: {mode:"forecast"|"survey"|"result", strat, talentBonus, alloc,
   extraParties:[{id, support, ideo}]（予兆の中心議席を同じ計算で出すための仮置き）}
   戻り値: {shares:{pid:補正後シェア（未正規化）}, diag:{pid:{coreShare, floatNet}}, pull, attractorId} */
function electionShares(kind, opts){
  opts = opts || {};
  const mode = opts.mode || "forecast";
  const strat = opts.strat || 0, talentBonus = opts.talentBonus || 0;
  const alloc = opts.alloc || "even";
  ensureIdeo();
  const govIds = govPartyIds();
  const entries = [];
  PARTIES.forEach(p=>{ if(!isDormantParty(p.id)) entries.push({id:p.id, support: S.partySupport[p.id]||0, ideo: partyIdeo(p.id)}); });
  (opts.extraParties||[]).forEach(x=>{ entries.push({id:x.id, support:x.support||0, ideo:x.ideo||{cons:0,hawk:0,gov:0}, extra:true}); });
  const supportTotal = entries.reduce((s,e)=>s+e.support,0) || 1;
  /* (a) 岩盤と浮動に分割し、浮動票プールを作る */
  let floatPool = 0;
  entries.forEach(e=>{ e.core = e.support * coreRatioOf(e.id); floatPool += e.support - e.core; });
  /* (b) 流れの強さと吸引点を決め、浮動票の配分重みを作る */
  const pull = clamp((S.approval-45)/40, -1, 1);
  let attractorId = null, attractorVec = null;
  if(pull > 0.15){ attractorId = S.pmParty; attractorVec = partyIdeo(S.pmParty); }
  else if(pull < -0.15){
    let best = null;
    entries.forEach(e=>{ if(e.extra || e.id==="other" || govIds.includes(e.id)) return; if(!best || e.support > best.support) best = e; });
    if(best){ attractorId = best.id; attractorVec = best.ideo; }
  }
  let wSum = 0;
  entries.forEach(e=>{
    let w = e.support + 2;
    if(Math.abs(pull) > 0.15 && attractorVec){
      const d = ideoDist(e.ideo, attractorVec);
      const k = d * Math.abs(pull) / 1.5;
      w *= Math.exp(-(k*k));
      if(govIds.includes(e.id)) w *= (pull > 0 ? 1.35 : 0.55); /* 追い風では与党ブロック優遇、逆風では与党ブロックから離れる */
    }
    e.w = w; wSum += w;
  });
  if(wSum <= 0) wSum = 1;
  /* (c) 調整後支持率から基礎シェアを作り、診断情報（岩盤シェア・浮動票の純流入）を残す */
  const shares = {}, diag = {};
  entries.forEach(e=>{
    const adj = e.core + floatPool * e.w / wSum;
    shares[e.id] = adj / supportTotal;
    diag[e.id] = { coreShare: e.core / supportTotal, floatNet: (adj - e.support) / supportTotal };
  });
  /* (d) 既存補正：予測・調査と結果で従来どおり係数を変えて適用する */
  const ideoFc = (S.ideoCore-55)*0.00045 + (S.ideoCenter-50)*0.00035 - Math.max(0, ideoDist(govIdeoVec(),{cons:0,hawk:0,gov:0})-2.6)*0.008;
  let fatigue = 1 - Math.min(0.30, Math.max(0, S.turn-18) * 0.0035); /* 長期政権への飽き */
  if(alloc==="base") fatigue = 1 - (1-fatigue)/2; /* 地盤の固め直しは疲れ補正を半減する */
  const aBonus = allocDef(alloc).bonus;
  entries.forEach(e=>{
    if(e.extra) return;
    let share = shares[e.id];
    if(e.id===S.pmParty){
      if(mode==="result") share *= (1 + (S.approval-45)/88 + strat + talentBonus + aBonus) * fatigue;
      else share *= 1 + (S.approval-45)/160 + strat + talentBonus + ideoFc + aBonus;
    }
    if(e.id!==S.pmParty && govIds.includes(e.id)){
      share *= (mode==="result") ? (1.02 + strat*0.4) : 1.02; /* 連立パートナー優遇 */
    }
    if(mode==="result" && e.id==="cdp") share *= 1 + (42-S.approval)/300; /* 反政権の受け皿補正は浮動モデルと二重に効くため半減（従来は /150） */
    shares[e.id] = share;
  });
  if(mode==="result" && alloc==="focus"){
    /* 接戦区集中は当日のブレが大きい：結果でのみ自党シェアに ±0.045 の振れを足す（調査では中心＋幅で表現） */
    shares[S.pmParty] = Math.max(0.004, (shares[S.pmParty]||0) + rnd(-0.045, 0.045));
  }
  if(mode==="result") entries.forEach(e=>{ if(!e.extra) shares[e.id] = Math.max(shares[e.id], 0.004); });
  return { shares, diag, pull, attractorId };
}
/* 党別の「勢い／苦戦の理由」を、選挙計算の実数値（浮動票の純流入・岩盤率・党首の人気・
   政権の色との距離・長期政権の疲れ）から点数化し、上位1〜2件を文にして返す。
   情勢調査と選挙結果の新聞で同じ関数を使い、表示と数字が矛盾しないようにする */
function partyMomentumReasons(pid, diag, info){
  const d = diag && diag[pid]; if(!d) return [];
  info = info || {};
  const pull = info.pull || 0, attractorId = info.attractorId || null;
  const p = partyById(pid); if(!p) return [];
  const isGov = govPartyIds().includes(pid);
  const fn = d.floatNet || 0; /* シェア換算の浮動票純流入（0.01≒支持率1pt分） */
  const cands = [];
  if(pull > 0.15 && isGov && fn > 0.004) cands.push({s: 2 + fn*120, t:"政権への追い風で浮動票が流入している"});
  if(pull < -0.15 && pid===attractorId && fn > 0.004) cands.push({s: 2 + fn*120, t:"批判票の受け皿として浮動票を集めている"});
  if(fn > 0.006 && !isGov && pid!==attractorId) cands.push({s: 1 + fn*100, t:"浮動票の流れに乗り、支持を広げている"});
  if(fn < -0.004){
    const ap = attractorId ? partyById(attractorId) : null;
    cands.push({s: 2 + Math.abs(fn)*120, t: ap ? `浮動票が${ap.name}へ流出している` : "浮動票が流出している"});
  }
  if(coreRatioOf(pid) >= 0.70 && Math.abs(fn) <= 0.005) cands.push({s:1.6, t:"組織票の岩盤が厚く、底堅い戦いになっている"});
  /* 党首の人気：partyLeaderName で特定し、首相候補データに同じ人物がいれば pop を使う（取れない党では使わない） */
  const leaderName = partyLeaderName(pid);
  const cand = PM_CANDIDATES.find(c=>c.name===leaderName);
  if(cand){
    if(cand.pop >= 72) cands.push({s: 1.2 + (cand.pop-72)*0.05, t:`党首・${cand.name}氏の人気が強みになっている`});
    else if(cand.pop <= 52) cands.push({s: 1.2 + (52-cand.pop)*0.05, t:`党首・${cand.name}氏の人気が伸び悩み、足を引っ張っている`});
  }
  if(pid===S.pmParty){
    const fat = Math.min(0.30, Math.max(0, S.turn-18) * 0.0035);
    if(fat >= 0.10) cands.push({s: 1.4 + fat*3, t:"長期政権への飽きが重しになっている"});
  }
  if(!isGov && pid!=="other"){
    ensureIdeo();
    const dg = ideoDist(partyIdeo(pid), govIdeoVec());
    if(dg <= 1.2) cands.push({s:0.9, t:"政権の色と近く、無党派の一部を取り込んでいる"});
    else if(dg >= 3.0 && pull > 0.15) cands.push({s:1.1, t:"政権と立場が正反対で、追い風の波及が届かない"});
  }
  cands.sort((a,b)=>b.s-a.s);
  const out = cands.slice(0,2).map(c=>c.t);
  if(!out.length){
    if(fn > 0.0015) out.push("浮動票がわずかに流入している");
    else if(fn < -0.0015) out.push("浮動票がわずかに流出している");
    else out.push("大きな票の動きは見られず、岩盤どうしの勝負になっている");
  }
  return out;
}
/* ---------------- 情勢調査での「新党の予兆」 ----------------
   情勢調査のタイミングで、まだ登場していない新党が初議席をうかがう予兆が出ることがある。
   予兆が出ても投開票で実際に登場するのは55%で、45%は失速して議席獲得に至らない */
/* 新党を実際に登場させる共通処理（定義の登録・支持率・議員シード）。
   従来の選挙時登場（maybeEmergeNewParty）と予兆経由の登場で共用する */
function emergeNewPartyNow(tpl){
  S.lastEmergenceTurn = S.turn;
  /* 党首名は通常の氏名プールから生成する（氏名台帳で重複防止も効く）。生成できない場合だけテンプレートの既定名を使う */
  const genLeader = genSaveFicName(null, tpl.leaderAge || 50);
  const def = {id:tpl.id, name:tpl.name, short:tpl.short, color:tpl.color, leader: genLeader || tpl.leader, leaderTitle: tpl.leaderTitle || "", kindLabel:tpl.kindLabel, ideo:tpl.ideo, stance:tpl.stance, condField:tpl.condField, condLabel:tpl.condLabel, condDesc:tpl.condDesc, baseSupport:tpl.baseSupport};
  S.newPartyDefs[tpl.id] = def;
  S.emergedParties.push(tpl.id);
  ensureDynamicParties();
  S.partySupport[tpl.id] = tpl.baseSupport + rnd(0, 0.7);
  S.hrSeats[tpl.id] = 0; S.hcSeats[tpl.id] = 0;
  seedNewPartyMinisters(tpl.id);
  const msg = `${tpl.name}（${tpl.kindLabel}／党首・${def.leader}${def.leaderTitle?`＝${def.leaderTitle}`:""}）が結党後初めて国政選挙に挑み、議席獲得を目指す動きが報じられた。`;
  S.newPartyLog.push(msg);
  return Object.assign({}, tpl, {leader: def.leader, leaderTitle: def.leaderTitle});
}
function rollSurveyOmen(kind){
  if(S.surveyOmen) return; /* この選挙では既に判定済み */
  ensureDynamicParties();
  const remaining = NEW_PARTY_TEMPLATES.filter(t=>!S.newPartyDefs[t.id]);
  if(!remaining.length) return;
  if(typeof S.lastEmergenceTurn==="number" && S.turn - S.lastEmergenceTurn < 8) return; /* 前回の新党登場から8か月は空ける */
  if(Math.random() >= 0.45) return;
  const tpl = pick(remaining);
  /* 仮の支持率を与え、通常の情勢計算と同じ electionShares で中心議席を出す */
  const hypo = tpl.baseSupport * rnd(0.8, 1.3);
  const es = electionShares(kind, {mode:"survey", strat:0, talentBonus:0, alloc:(electionCtx&&electionCtx.alloc)||"even", extraParties:[{id:tpl.id, support:hypo, ideo:tpl.ideo}]});
  const shT = Object.values(es.shares).reduce((s,v)=>s+v,0) || 1;
  const total = kind==="hr" ? HR_TOTAL : HC_TOTAL;
  let center = (es.shares[tpl.id]||0)/shT * total * (kind==="hr" ? 1.12 : 0.5);
  center = Math.max(1, Math.round(center));
  const half = Math.max(2, Math.round(center/2));
  S.surveyOmen = { templateId: tpl.id, name: tpl.name, low: Math.max(0, center-half), high: center+half };
}
function forecastSeats(kind, stratBonus, talentBonus){
  const isHR = kind==="hr";
  const total = isHR? HR_TOTAL : HC_TOTAL;
  const cur = isHR? S.hrSeats : S.hcSeats;
  const es = electionShares(kind, {mode:"forecast", strat: stratBonus||0, talentBonus: talentBonus||0, alloc:(electionCtx&&electionCtx.alloc)||"even"});
  const shTotal = Object.values(es.shares).reduce((s,v)=>s+v,0) || 1;
  let govShare = 0;
  govPartyIds().forEach(pid=>{ govShare += (es.shares[pid]||0)/shTotal; });
  let govSeats = Math.round(govShare * total * (isHR? 1.12 : 1.0));
  if(!isHR){ /* 参院は半数改選：現有の半分は残る */
    const keep = Math.round(govPartyIds().reduce((s,pid)=>s+(cur[pid]||0),0)/2);
    govSeats = keep + Math.round(govSeats/2);
  }
  return { gov: clamp(govSeats, 10, total-20) };
}
/* 擁立候補への「周囲の声」：自党（選対・幹部）／連立パートナー／世間（SNS・メディア）。
   内容は候補の人気・実務・リスク・効く層・適性から決定的に組み立て、特性と矛盾しない
   範囲で、良い面と不安材料の両方が読み取れるようにする */
function candidateVoicesHtml(t){
  ensureCandidateProfile(t);
  const chief = S.electionChief;
  let partyVoice;
  if(t.pop>=80 && t.risk>=55) partyVoice = "「知名度は抜群。ただ失言だけは怖い。擁立するなら選対が脇を固める」と党幹部";
  else if(t.skill>=68) partyVoice = "「実務は申し分ない。地味でも、仕事で評価されるタイプだ」と党幹部";
  else if(t.risk<=24) partyVoice = "「派手さはないが堅実で、選挙中に足を引っ張る心配が小さい」と選対関係者";
  else if(t.pop>=70) partyVoice = "「浮動層への浸透力は本物。看板候補になりうる」と党幹部";
  else if(t.category==="commoner") partyVoice = "「現場の経歴は本物。知名度は選挙戦で補うしかない」と党幹部";
  else partyVoice = "「大きな武器はないが、バランスは悪くない」と党幹部";
  if(chief) partyVoice += `。${chief.name}選対委員長は「${t.skill>=60 ? "実務面は安心して任せられる" : t.pop>=70 ? "知名度で押し切る選挙になる" : "接戦区でどこまで伸びるかは未知数"}」と見る`;
  let coalVoice = "";
  const partners = coalitionPartnerIds();
  if(partners.length){
    const pp = partyById(partners[0]);
    const specField = {"厚生労働":"子育て・福祉","経済産業":"経済","総務":"地方・行政","財務":"財政","外務":"外交","防衛":"安全保障","官房":"国会対応"}[t.spec] || "政策";
    coalVoice = t.risk>=55
      ? `${pp.name}の関係者は「話題性はあるが、選挙中の失言は与党全体に響く」と慎重な見方`
      : `${pp.name}の関係者は「${specField}に強い候補なら、与党全体の訴えにも厚みが出る」と前向きな見方`;
  }
  const segName = {youth:"若年層", parents:"子育て世代", elderly:"高齢層", business:"ビジネス層", rural:"地方", urban:"都市部", all:"幅広い世代"}[t.seg] || "無党派層";
  const sns1 = t.pop>=75 ? `SNSでは「${t.type}が政治家に？」と話題が先行` : t.pop>=60 ? `SNSでは「${t.type}なら知っている」という声と「政治は未知数」という声が半々` : `SNSでは「正直、誰？」と知名度不足を心配する声も`;
  const sns2 = t.risk>=55 ? "一方で「また知名度頼みか」「失言が心配」と冷ややかな投稿も目立つ" : t.skill>=65 ? "一方で「経歴を見ると意外と堅実そうだ」と評価する投稿も" : "一方で「押しは強くないが、誠実そうだ」との声も";
  return `<div class="cand-voices"><div class="cv"><b>自党の声：</b>${esc(partyVoice)}</div>${coalVoice?`<div class="cv"><b>連立側の見方：</b>${esc(coalVoice)}</div>`:""}<div class="cv"><b>世間の声：</b>${esc(sns1+"。"+sns2+"。")} ${esc(segName)}への浸透が鍵とメディアは分析している</div></div>`;
}
/* ---------------- テレビ特番風・情勢調査（選挙前の見るだけのステップ） ----------------
   候補者・戦略を確定したあと、投開票の前に挟まる情勢調査画面。
   数字は既存の議席予測（forecastSeats）と同じ支持率・イデオロギーの計算式から
   党ごとの中心値を出し、調査らしく小さなブレと「幅」を付けて見せる。
   実際の結果（resolveElection）は戦略・タレントの事故などで多少ずれるが、
   調査が根拠なく真逆になることはない。 */
function captureElectionStrategy(){
  const ctx = electionCtx; if(!ctx) return;
  ctx.chosenTalents = ctx.talents.filter((t,i)=> ctx.talentSel && ctx.talentSel[i]);
  const ef = document.getElementById("elFocus"); if(ef) ctx.focus = ef.value;
  const ei = document.getElementById("elIssue"); if(ei) ctx.issue = ei.value;
  const et = document.getElementById("elTour"); if(et) ctx.tour = et.value;
  const ed = document.getElementById("elIdeo"); if(ed) ctx.ideoStrat = ed.value;
  if(!ctx.ideoStrat) ctx.ideoStrat = "balance";
  const etac = document.getElementById("elTactic"); if(etac) ctx.tactic = etac.value;
  if(!ctx.tactic) ctx.tactic = "standard";
  const ea = document.querySelector('input[name="elAlloc"]:checked'); if(ea) ctx.alloc = ea.value;
  if(!ctx.alloc) ctx.alloc = "even";
  ctx._cap = true;
}
/* ---------------- 選挙戦術（戦い方の軸） ----------------
   既存の「訴える層」「看板政策」「イデオロギー戦略」「応援演説」に加えて選ぶ、
   戦い方そのものの軸。効く条件が戦術ごとに違い（候補者の人気、選対委員長の能力、
   首相の答弁力、自党の強みとの一致、支持率の高低）、情勢調査の中心値と
   実際の結果の両方に同じ計算で反映される */
const TACTICS = {
  standard:{name:"王道・全方位"},
  sns:{name:"SNS・動画総力戦"},
  local:{name:"全国行脚・地域密着"},
  debate:{name:"テレビ討論・メディア決戦"},
  issue:{name:"看板政策の一点突破"},
  ground:{name:"地盤固め・組織総動員"},
  closing:{name:"終盤の追い込み重視"},
};
function tacticBonus(ctx){
  if(!ctx || !ctx.tactic || ctx.tactic==="standard") return {bonus:0, note:""};
  const chief = S.electionChief ? S.electionChief.skill : 60;
  const chosen = chosenTalentsNow();
  const maxPop = chosen.length ? Math.max.apply(null, chosen.map(t=>t.pop||0)) : 0;
  const returning = chosen.filter(t=>t.returning).length;
  switch(ctx.tactic){
    case "sns": {
      const b = (maxPop>=80 ? 0.022 : maxPop>=65 ? 0.010 : 0.002) + (S.seg.youth-50)/900;
      return {bonus:b, note: maxPop>=65 ? "SNS・動画総力戦で著名人候補の発信が拡散し、若年層への浸透が進んだ。" : "SNS・動画総力戦を敷いたが、拡散の担い手になる候補の知名度が伸び悩み、効果は限られた。"};
    }
    case "local": {
      const b = (chief-58)/260 + (S.seg.rural-50)/700;
      return {bonus:b, note: chief>=62 ? "全国行脚と地域密着の訴えが、地方の接戦区でじわりと効いた。" : "全国行脚を重ねたものの、選対の采配が追いつかず、地方での上積みは限られた。"};
    }
    case "debate": {
      const b = (S.pmDebate-66)/300 + (S.pmPop-60)/600;
      return {bonus:b, note: S.pmDebate>=70 ? "テレビ討論で首相の答弁が冴え、無党派層の評価が上がった。" : "テレビ討論では首相の答弁が精彩を欠き、メディア戦の効果は薄かった。"};
    }
    case "issue": {
      const stance = partyById(S.pmParty).stance;
      let match = false;
      if(ctx.issue==="defense" && stance.defense==="増強") match = true;
      if(ctx.issue==="welfare" && stance.welfare==="拡充") match = true;
      if(ctx.issue==="reform" && (stance.econ==="規制改革" || stance.welfare==="効率化")) match = true;
      if(ctx.issue==="econ" && S.econ>=55) match = true;
      return {bonus: match ? 0.026 : -0.008, note: match ? "看板政策の一点突破が自党の強みと重なり、訴えに説得力が生まれた。" : "看板政策の一点突破を狙ったが、自党の強みとずれて、訴えが響きにくかった。"};
    }
    case "ground": {
      const b = (S.partyRel-55)/450 + returning*0.007;
      return {bonus:b, note: returning>0 ? "現職候補の地盤固めと組織の総動員で、基礎票を手堅く積み上げた。" : "組織総動員で基礎票は固めたが、新しい層への広がりは限られた。"};
    }
    case "closing": {
      const b = (S.approval<45 ? 0.020 : S.approval<55 ? 0.008 : -0.004) + (chief-62)/500;
      return {bonus:b, note: S.approval<45 ? "終盤の追い込みが奏功し、接戦区で土壇場の逆転がいくつも起きた。" : "終盤の追い込みに力を割いたが、もともとの優位が大きく、効果は限定的だった。"};
    }
  }
  return {bonus:0, note:""};
}
function surveyProjection(kind){
  const isHR = kind==="hr";
  const total = isHR? HR_TOTAL : HC_TOTAL;
  const cur = isHR? S.hrSeats : S.hcSeats;
  const chosen = chosenTalentsNow();
  let tb = 0; chosen.forEach(t=>{ tb += t.pop/1600; });
  const se = slateEffects(chosen);
  const strat = (se.youth*0.20 + se.elderly*0.26 + se.all) * 0.01 + tacticBonus(electionCtx).bonus;
  /* 中心値は結果と同じ electionShares から出す（調査と結果の一貫性） */
  const alloc = (electionCtx && electionCtx.alloc) || "even";
  const es = electionShares(kind, {mode:"survey", strat, talentBonus: tb, alloc});
  const shTotal = Object.values(es.shares).reduce((s,v)=>s+v,0) || 1;
  const widthMult = allocDef(alloc).widthMult; /* 重点配分で予想幅が変わる */
  const rows = [];
  PARTIES.forEach(p=>{
    if(isDormantParty(p.id)) return;
    const share = (es.shares[p.id]||0)/shTotal;
    let center;
    if(isHR) center = share * total * 1.12;
    else center = Math.round((cur[p.id]||0)/2) + share * total / 2; /* 参院は半数改選：非改選の半分は残る */
    center = Math.max(0, Math.round(center * (1 + rnd(-0.05, 0.05)))); /* 調査のブレ */
    const half = Math.max(2, Math.round((Math.max(3, Math.round(center*0.16) + 2)) * widthMult));
    rows.push({ p, cur: cur[p.id]||0, center, lo: Math.max(0, center-half), hi: Math.min(total, center+half),
      reasons: partyMomentumReasons(p.id, es.diag, es) });
  });
  rows.sort((a,b)=> b.center - a.center);
  /* 表示の並びは勢力図と統一する：与党ブロック→野党（予想議席順） */
  const _cmap = {}; rows.forEach(r=>{ _cmap[r.p.id] = r.center; });
  const _rowById = {}; rows.forEach(r=>{ _rowById[r.p.id] = r; });
  const _orderedRows = dietOrderedParties(_cmap).map(p=>_rowById[p.id]).filter(Boolean);
  rows.length = 0; _orderedRows.forEach(r=>rows.push(r));
  const govIds = govPartyIds();
  const govCenter = rows.filter(r=>govIds.includes(r.p.id)).reduce((s,r)=>s+r.center,0);
  const govHalf = Math.max(4, Math.round(Math.max(6, Math.round(govCenter*0.10)) * widthMult));
  return { rows, govCenter, govLo: Math.max(0, govCenter-govHalf), govHi: Math.min(total, govCenter+govHalf),
    total, majority: Math.floor(total/2)+1, isHR, diag: es.diag, pull: es.pull, attractorId: es.attractorId };
}
function surveyComment(r){
  const d = r.center - r.cur;
  const scale = Math.max(6, r.cur*0.18);
  if(d >= scale) return {mom:"勢い", cls:"hot", base:"支持を大きく伸ばしており、議席増の勢いがある。"};
  if(d >= 3) return {mom:"堅調", cls:"good", base:"手堅く支持を広げ、議席増をうかがう。"};
  if(d > -3) return {mom:"接戦", cls:"flat", base:"横ばいで推移しており、接戦区の勝敗が鍵を握る。"};
  if(d > -scale) return {mom:"伸び悩み", cls:"warn", base:"支持の伸びが鈍く、現状維持も予断を許さない。"};
  return {mom:"苦戦", cls:"bad", base:"逆風が強く、大幅な議席減の恐れがある。"};
}
function surveyHeadline(proj){

    return {h:"与党、過半数割れの危機", s:"政権への逆風が強く、このままでは政権維持は困難な情勢だ。"};
  }
  if(g >= m+20) return {h:"参院でも与党が優位", s:"与党が参院でも勢力を伸ばす情勢で、政権基盤はさらに固まりそうだ。"};
  if(g >= m) return {h:"与党、参院の過半数維持へ", s:"政権の中間試験は、ひとまず合格ラインをうかがう情勢となっている。"};

}

function renderElectionResult(){

    const movers = PARTIES.map(p=>({p, d:(r.newSeats[p.id]||0)-(r.beforeSeats[p.id]||0)})).filter(x=>x.d!==0);

      S.cabinetGen = (S.cabinetGen||1) + 1;
      S.reshuffleCount = 0;
      setResume("main", {});
      showPaper({kicker:"速報", title:"政権継続が決定", sub:`内閣支持率は${S.approval}%`,
        body:`選挙を乗り切った政権は、改めて政策運営に臨む。総選挙後の総辞職と再指名を経て、新たに${esc(cabinetName())}が発足した。勝った選挙の勢いを、どこまで数字に変えられるか。`,
        btn:"政権運営に戻る", fn:"renderMain()"});
    } else if(r.afterGov >= r.majority - 45 && S.pmParty){
      /* 連立組み替えの選択肢 */
      const partners = PARTIES.filter(p=>p.id!==S.pmParty && p.id!=="other" && !isDormantParty(p.id) && !coalitionPartnerIds().includes(p.id) && coalitionPartnerIds().length<COALITION_MAX_PARTNERS && coalitionInvitable(p))
        .filter(p=> totalGovHR() + (S.hrSeats[p.id]||0) >= r.majority)
        .sort((a,b)=>((S.hrSeats[b.id]||0)+(S.hcSeats[b.id]||0))-((S.hrSeats[a.id]||0)+(S.hcSeats[a.id]||0)));
      if(partners.length){
        show(`
          <div class="newsflash mb"><div class="nf-k">政権の岐路</div><div class="nf-t">過半数割れ ― 連立組み替えか、退陣か</div></div>
          <div class="card">
            <p style="font-size:14.5px">与党は過半数を割った。新たなパートナーを迎えて政権を維持する道と、退陣する道がある。</p>
            ${partners.map(p=>`<button class="opt" onclick="regroupCoalition('${p.id}')"><div class="olab">${esc(p.name)}を連立に迎える</div><div class="odet">衆院${S.hrSeats[p.id]}議席・参院${S.hcSeats[p.id]||0}議席。条件：${esc(coalitionCondition(p.id).label)}</div></button>`).join("")}
            <button class="opt" onclick="gameOver('衆院選で過半数を割り込み、政権の維持を断念。首相は退陣を表明した。', true)"><div class="olab">退陣する</div><div class="odet">選挙結果の責任を取り、政権を明け渡す</div></button>
          </div>
        `);
        return;
      }
      gameOver("衆院選で過半数を割り込み、連立の組み替えも成立しなかった。首相は退陣を表明した。", true);
    } else {
      gameOver("衆院選で大敗し、政権は維持できなくなった。首相は選挙結果の責任を取り、退陣を表明した。", true);
    }
  } else {
    S.hcTermLeft = 36;
    const wasTwisted = S.twisted;
    S.twisted = r.afterGov < r.majority;
    if(S.twisted && !wasTwisted){
      setResume("main", {});
      showPaper({kicker:"速報", title:"ねじれ国会が誕生", sub:"法案成立には野党の協力が不可欠に",
        body:"参院で与党が過半数を割り、ねじれ国会となった。今後の法案は参院での修正や野党との妥協なしには成立しにくくなり、政策の効果にも影響が出る。退陣は免れたが、政権運営の難易度は跳ね上がった。",
        btn:"政権運営に戻る", fn:"renderMain()"});
    } else {
      if(!S.twisted && wasTwisted) applySegAll(2);
      setResume("main", {});
      showPaper({kicker:"速報", title: S.twisted? "参院選を乗り切るも、ねじれは継続":"参院選で与党が勝利", sub:`与党は参院で${r.afterGov}議席`,
        body: S.twisted? "ねじれ状態は続くが、政権は当面の危機を脱した。" : "両院で与党が基盤を固め、政権運営に余裕が生まれた。",
        btn:"政権運営に戻る", fn:"renderMain()"});
    }
  }
  electionCtx = null;
}
function regroupCoalition(partyId){
  const slot = addCoalitionPartner(partyId, coalitionStability(partyId), S.turn);
  if(!slot){ electionCtx = null; renderMain(); return; }
  if(slot==="second" || slot==="third" || slot==="fourth") S.coalitionHist.push(`選挙後、${partyById(partyId).name}も連立に加わった${coalitionFrameLabel(coalitionPartnerIds().length)}`);
  else S.coalitionHist.push(`選挙後、${partyById(partyId).name}と新たに連立を組んだ`);
  S.twisted = totalGovHC() < Math.floor(HC_TOTAL/2)+1;
  /* 衆院選を経て連立を組み替えての政権継続も、総辞職→再指名に当たるため内閣の代数が1つ進む */
  ensureCabinetFields();
  S.cabinetGen = (S.cabinetGen||1) + 1;
  S.reshuffleCount = 0;
  electionCtx = null;
  setResume("main", {});
  showPaper({kicker:"速報", title:"連立政権が再スタート", sub:`${esc(partyById(partyId).name)}が政権に参画`,
    body:`新しい連立の枠組みで政権は存続することになった。${esc(cabinetName())}の発足となる。パートナーの意向への配慮が、これまで以上に政権運営の鍵になる。${esc(partyById(partyId).name)}の議員は、これからの組閣・内閣改造で閣僚候補に加わる。`,
    btn:"政権運営に戻る", fn:"renderMain()"});
}

/* ---------------- 終了と評価 ---------------- */
function rankOf(){
  const m = S.turn;
  const avg = S.approvalHist.reduce((s,v)=>s+v,0)/Math.max(1,S.approvalHist.length);
  let score = m*0.8 + avg*0.5 + S.policiesDone.length*0.8 + S.elections.filter(e=>e.win).length*5;
  if(score>=125) return "S";
  if(score>=92) return "A";
  if(score>=62) return "B";
  if(score>=36) return "C";
  return "D";
}

const GAME_URL = "https://life-sim-games.github.io/prime-minister-sim/";
let lastShareText = "";
/* その政権の結果から共有テキストを自動生成する。body はURL抜き（X/LINEのURL欄と分ける用）、full はURL込み */
function buildShare(rank, days){

function shareViaSheet(){

  }

function copyShareText(btn){
  const done = ()=>{
    if(!btn) return;
    const t = btn.textContent;
    btn.textContent = "コピーしました";
    setTimeout(()=>{ btn.textContent = t; }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastShareText).then(done).catch(()=>fallbackCopyShare(done));
  } else {
    fallbackCopyShare(done);
  }
}
function fallbackCopyShare(done){
  try{
    const ta = document.createElement("textarea");
    ta.value = lastShareText;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){ /* コピーできない環境では何もしない（ボタンはそのまま） */ }
}

/* 政党の党首名（新党は leader、既存党は首相候補の筆頭＝党首級） */
function partyLeaderName(pid){
  const p = partyById(pid);
  if(!p) return "野党党首";
  if(p.leader) return p.leader;
  const cand = PM_CANDIDATES.find(c=>c.party===pid);
  return cand ? cand.name : `${p.short}党首`;
}
/* 衆院選敗北時：確定した議席（S.hrSeats）から、政権を奪う野党側の組み合わせを実際に計算する。
   野党第1党が単独過半数なら単独政権。届かなければ、第1党にイデオロギーの近い党から順に
   加えて過半数に達した時点で確定する。全野党でも届かない場合は "" を返し、演出を出さない */
function oppTakeoverText(){
  const majority = Math.floor(HR_TOTAL/2)+1;
  const govIds = govPartyIds();
  const opps = PARTIES.filter(p=> p.id!=="other" && !govIds.includes(p.id) && !isDormantParty(p.id) && (S.hrSeats[p.id]||0) > 0);
  if(!opps.length) return "";
  opps.sort((a,b)=> (S.hrSeats[b.id]||0) - (S.hrSeats[a.id]||0));
  const axis = opps[0];
  const axisSeats = S.hrSeats[axis.id]||0;
  const leader = partyLeaderName(axis.id);
  if(axisSeats >= majority){
    return `政権交代の受け皿は明確だ。${axis.name}は単独で${axisSeats}議席と過半数（${majority}議席）を確保しており、${leader}党首を首班とする単独政権が発足する見通しとなった。野党が単独で政権を担う構図に、永田町では「本格的な政権交代」との声が上がっている。`;
  }
  const rest = opps.slice(1).map(p=>({p:p, d:ideoDist(partyIdeo(axis.id), partyIdeo(p.id))}))
    .sort((a,b)=> (a.d - b.d) || ((S.hrSeats[b.p.id]||0) - (S.hrSeats[a.p.id]||0)));
  const members = [axis];
  let total = axisSeats, maxD = 0;
  for(const r of rest){
    if(total >= majority) break;
    members.push(r.p);
    total += S.hrSeats[r.p.id]||0;
    if(r.d > maxD) maxD = r.d;
  }
  if(total < majority) return "";
  const names = members.map(p=>`${p.name}（${S.hrSeats[p.id]||0}議席）`).join("、");
  const flavor = maxD >= 2.2
    ? "ただし参加党の政策の幅は広く、違いを棚上げにした「反・現政権」色の濃い連立で、先行きを不安視する声も出ている。"
    : "政策の近い党同士のまとまりのある連立で、政権運営の安定を期待する声も出ている。";
  const hist = members.length >= 5 ? "5党以上が手を組む構図は、1993年の非自民連立（細川連立政権）を思い起こさせるとの指摘もある。" : "";
  return `政権交代に向け、野党側の連立協議が急ピッチで進んでいる。軸となるのは${axis.name}で、${names}が手を組み、合計${total}議席で過半数（${majority}議席）に達する見通しだ。新首相には${axis.name}の${leader}党首が就く方向で調整が進んでいる。${flavor}${hist}`;
}
/* 選挙ごとの記録を行に整形する（記録サマリー・アーカイブ共通）。
   旧形式のエントリ（ownAfter 等の新フィールドなし）でも壊れないよう、欠けた項目は省略して出す */
function electionRecordRows(list){
  if(!Array.isArray(list) || !list.length) return "";
  return list.map((e,i)=>{
    const last = i === list.length-1;
    const kind = e.kind==="hr" ? "衆院選" : "参院選";
    const parts = [];
    if(typeof e.ownAfter==="number"){
      const d = typeof e.ownBefore==="number" ? e.ownAfter - e.ownBefore : null;
      parts.push(`自党 ${e.ownAfter}議席${d!==null?`（${d>=0?"+":""}${d}）`:""}`);
    }
    if(typeof e.gov==="number") parts.push(`与党合計 ${e.gov}`);
    if(typeof e.topOpp==="number" && e.topOpp>0) parts.push(`最大野党 ${e.topOppName?esc(e.topOppName)+" ":""}${e.topOpp}議席`);
    parts.push(e.win ? "勝利" : "敗北");
    if(e.dissolved) parts.push("解散総選挙");
    return `<div class="kv"><span>${e.year}年${e.month}月・${kind}${last?' <span class="tag red">最後の選挙</span>':""}</span><b>${parts.join("｜")}</b></div>`;
  }).join("");
}

  show(`

      <p>${esc(reason)}</p>
      ${oppTakeover?`<p>${esc(oppTakeover)}</p>`:""}
      <p>在任期間は約${days.toLocaleString()}日。内閣支持率は最高${S.maxApproval}%、最低${S.minApproval}%を記録した。
      実現した政策は${S.policiesDone.length}件、選挙は${S.elections.length}回経験し${wins}勝${S.elections.length-wins}敗だった。</p>
    </div>
    <div class="card center mb">
      <div class="mini">総合評価ランク</div>
      <div class="rank-badge">${rank}</div>
      <div class="mini">${rank==="S"?"歴史に残る長期政権だった":rank==="A"?"安定した政権運営で長く続いた":rank==="B"?"一定の実績を残した政権":rank==="C"?"短命に終わったが爪痕は残した":"厳しい政権運営となった"}</div>
    </div>
    <div class="card mb">
      <h3 style="font-size:16px">記録サマリー</h3>

/* 過去政権アーカイブ（pm-sim-archive-v1）とはキーを分け、進行中の1周回分だけを保持する */
const SAVE_KEY = "pm-sim-save-v1";
let resumeScreen = null; /* {name, ctx}：再読み込み時に復元すべき画面 */
function setResume(name, ctx){
  resumeScreen = {name: name, ctx: ctx || {}};
  saveGame();
}
function saveGame(){
  try{
    if(!S || S.over || !resumeScreen) return;
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, savedAt: Date.now(), screen: resumeScreen, S: S, history: undoStack, uidSeq: undoSeq}));
  }catch(e){ /* 保存できない環境ではセーブなしで通常通り続行 */ }
}

/* ---------------- 党構成アップデートへのセーブ移行（2026年11月） ----------------
   2025年時点の党構成で作られた旧セーブ（pm-sim-save-v1）を、現在の国会に合わせた
   党ラインアップでも壊さずに続けるための読み替え。
   ・旧「れいわ新選組」（党ID "rei"+"wa"）は、党名変更した「いのちの党」（inochi）へ読み替える。
     首相・連立・内閣・議席・支持率・議員プールの所属はすべてそのまま引き継がれる。
   ・今回増えた政党（民主改革の会・チームみらい・日本保守党・社会民主党など）が
     セーブ内に無い場合は、議席は0・支持率は初期値で補う。在任中の議席合計は
     旧セーブのまま変えない（合計が465／248からずれないようにするため）。
     新しい党は、その後の選挙で議席を得れば通常の党として機能する。 */
const LEGACY_PARTY_ID_MAP = { ["rei"+"wa"]: "inochi" };
function migratePartyId(id){ return LEGACY_PARTY_ID_MAP[id] || id; }
function migrateSaveData(s){
  if(!s || typeof s !== "object") return s;
  if(s.pmParty) s.pmParty = migratePartyId(s.pmParty);
  if(s.coalition){
    if(s.coalition.partyId) s.coalition.partyId = migratePartyId(s.coalition.partyId);
    if(s.coalition.partner2) s.coalition.partner2 = migratePartyId(s.coalition.partner2);
    if(s.coalition.partner3) s.coalition.partner3 = migratePartyId(s.coalition.partner3);
    if(s.coalition.partner4) s.coalition.partner4 = migratePartyId(s.coalition.partner4);
  }
  ["hrSeats","hcSeats","partySupport","oppRel","coalitionTerms"].forEach(k=>{
    const o = s[k];
    if(o && typeof o === "object"){
      Object.keys(o).forEach(id=>{
        const nid = migratePartyId(id);
        if(nid !== id){ if(o[nid] == null) o[nid] = o[id]; delete o[id]; }
      });
    }
  });
  const fixMember = m => {
    if(!m || typeof m !== "object") return;
    if(m.party) m.party = migratePartyId(m.party);
    if(typeof m.note === "string") m.note = m.note.split("れいわ新選組").join("いのちの党");
  };
  if(Array.isArray(s.rosterNew)) s.rosterNew.forEach(fixMember);
  if(Array.isArray(s.talentRoster)) s.talentRoster.forEach(fixMember);
  if(s.cabinet && typeof s.cabinet === "object") Object.values(s.cabinet).forEach(fixMember);
  if(s.electionChief) fixMember(s.electionChief);
  if(s.pendingOffer && s.pendingOffer.partyId) s.pendingOffer.partyId = migratePartyId(s.pendingOffer.partyId);
  if(s.pendingCoop && s.pendingCoop.partyId) s.pendingCoop.partyId = migratePartyId(s.pendingCoop.partyId);
  if(s.pendingNegotiate && s.pendingNegotiate.partyId) s.pendingNegotiate.partyId = migratePartyId(s.pendingNegotiate.partyId);
  if(s.pendingNegotiate && s.pendingNegotiate.ctx && s.pendingNegotiate.ctx.eff && s.pendingNegotiate.ctx.eff.rel){
    const o = s.pendingNegotiate.ctx.eff.rel, no = {};
    Object.keys(o).forEach(id=>{ no[migratePartyId(id)] = o[id]; });
    s.pendingNegotiate.ctx.eff.rel = no;
  }
  if(Array.isArray(s.dormantParties)) s.dormantParties = [...new Set(s.dormantParties.map(migratePartyId))];
  if(Array.isArray(s.emergedParties)) s.emergedParties = s.emergedParties.map(migratePartyId);
  /* 新しい党のデフォルト補完：議席は0（在任中の合計を変えない）、支持率は初期値 */
  if(s.hrSeats && typeof s.hrSeats === "object" && s.hcSeats && typeof s.hcSeats === "object" && s.partySupport && typeof s.partySupport === "object"){
    PARTIES.forEach(p=>{
      if(s.hrSeats[p.id] == null) s.hrSeats[p.id] = 0;
      if(s.hcSeats[p.id] == null) s.hcSeats[p.id] = 0;
      if(s.partySupport[p.id] == null) s.partySupport[p.id] = p.support;
    });
  }
  return s;
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.v!==1 || !d.S || typeof d.S!=="object") return null;
    const s = d.S;
    /* 形式が合わない・壊れているセーブは無視して通常スタートできるようにする */
    if(typeof s.pmName!=="string" || !s.pmName) return null;
    if(!s.seg || typeof s.seg!=="object" || !s.cabinet || typeof s.cabinet!=="object") return null;
    if(typeof s.approval!=="number" || typeof s.year!=="number" || typeof s.month!=="number" || typeof s.turn!=="number") return null;
    if(s.over) return null;
    if(!d.screen || typeof d.screen.name!=="string") d.screen = {name:"main", ctx:{}};
    /* 党構成アップデート（2026年11月）への移行：旧党IDの読み替えと新党の補完を、
       本体と「一つ前に戻る」履歴のスナップショットの両方に適用する（冪等なので何度呼んでも安全） */
    migrateSaveData(s);
    if(Array.isArray(d.history)) d.history.forEach(e=>{ if(e && e.S) migrateSaveData(e.S); });
    return d;
  }catch(e){ return null; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* noop */ }
}
function resumeGame(){
  const d = loadSave();
  if(!d){ showTitle(); return; }
  S = d.S;
  /* 「一つ前に戻る」の履歴も復元する（旧セーブには無いので空でよい。セーブ自体は壊れない） */
  undoStack = Array.isArray(d.history) ? d.history : [];
  undoSeq = typeof d.uidSeq === "number" ? d.uidSeq : undoStack.reduce((m,e)=>Math.max(m, (e && e.uid) || 0), 0);
  currentUndoUid = null;
  /* 旧バージョンのセーブにも不足フィールドを補い、そのまま続けられるようにする */
  S.fieldUsed = S.fieldUsed || {};
  S.policyVariant = S.policyVariant || {};
  /* 政策拡充より前のセーブ：実施済み政策の状態を policiesDone から復元する（実施済みが初回判断として再出題されなくなる） */
  if(typeof normalizePolicyState==="function") normalizePolicyState();
  if(S.tariffDone===undefined) S.tariffDone = false;
  if(S.tariffDoneTurn===undefined) S.tariffDoneTurn = -99;
  S.restrictPolicy = !!S.restrictPolicy;
  if(S.pendingRecovery===undefined) S.pendingRecovery = null;
  if(S.eventDisaster===undefined) S.eventDisaster = null;
  /* 経歴機能より前のセーブには経歴がないのでデフォルトで補う（実在首相と同じ扱い） */
  if(S.pmCareer===undefined) S.pmCareer = null;
  if(!Array.isArray(S.pmSpecFields)) S.pmSpecFields = [];
  /* イデオロギー機能より前のセーブは、自党の位置から政権の色を初期化してそのまま続けられるようにする */
  ensureIdeo();
  /* 不祥事履歴・ロスター新陳代謝より前のセーブには、新フィールドをデフォルトで補ってそのまま続けられるようにする */
  ensureRosterFields();
  /* 16ポスト化・内閣の代数より前のセーブには、新ポストを空席として補い、代数まわりもデフォルトで補う */
  if(typeof ensureCabinetFields==="function") ensureCabinetFields();
  /* 不祥事クールダウンより前のセーブには、発生月の記録をデフォルトで補う */
  if(typeof S.lastScandalTurn!=="number") S.lastScandalTurn = -100;
  /* 連立の見直し・三党連立より前のセーブには、連立まわりの新フィールドをデフォルトで補ってそのまま続けられるようにする */
  if(typeof ensureCoalitionFields==="function") ensureCoalitionFields();
  /* 実額予算より前のセーブ（%配分の S.budget）は、比率を保ったまま実額（兆円）へ自動変換してそのまま続けられるようにする */
  if(typeof ensureBudgetState==="function") ensureBudgetState();
  /* 財政の変動記録より前のセーブには、記録フィールドをデフォルトで補ってそのまま続けられるようにする（過去の変動理由は遡れないが、今月分から記録が始まる） */
  if(typeof ensureFiscFields==="function") ensureFiscFields();
  /* 支持率の理由表示・国民と各党の声・野党との政策協力／連立打診より前のセーブには、新フィールドをデフォルトで補ってそのまま続けられるようにする */
  if(typeof ensureApprovalFields==="function") ensureApprovalFields();
  /* 時間差政策・野党取引より前のセーブには、新フィールドをデフォルトで補ってそのまま続けられるようにする */
  if(typeof ensureGrowthFields==="function") ensureGrowthFields();
  /* 出生率システムより前のセーブには、出生率フィールドをデフォルトで補ってそのまま続けられるようにする */
  if(typeof ensureBirthFields==="function") ensureBirthFields();
  /* 補正予算より前のセーブ（すでに進行中の政権）では、さかのぼって補正予算を出さない。
     suppPending が無い旧セーブは「対象外」として倒し、補正予算つきセーブはそのまま値を保持する */
  if(S.suppPending===undefined && S.suppDone===undefined){ S.suppPending = false; S.suppDone = true; S.suppBudget = null; }
  else if(typeof ensureSuppFields==="function") ensureSuppFields();
  /* 衆参の所属院より前のセーブ：現職ロスターに所属院が無ければ衆議院側として補い、
     巻き戻し履歴の中のスナップショットも同じ扱いでそろえる（矛盾なくそのまま続けられる） */
  /* 新党より前のセーブには新党フィールドをデフォルトで補い、登場済み新党は党リストへ復元する */
  if(typeof ensureDynamicParties==="function") ensureDynamicParties();
  normalizeTalentRoster();
  undoStack.forEach(e=>{ if(e && e.S && Array.isArray(e.S.talentRoster)) e.S.talentRoster.forEach(r=>{ if(r && r.house!=="hr" && r.house!=="hc") r.house="hr"; }); });
  const sc = d.screen;
  const ctx = sc.ctx || {};
  restoringUI = true; /* 復元描画ではチェックポイントを積み直さない */
  try{
    switch(sc.name){
      case "coalition": coalitionStep(); break;
      case "coalReview": renderCoalitionReview(); break;
      case "coalOffer": if(ctx.partyId) renderCoalitionOffer(ctx.partyId); else renderCoalitionReview(); break;
      case "coalRemove": if(ctx.partyId) renderCoalitionRemove(ctx.partyId); else renderCoalitionReview(); break;
      case "cabinet": restoreCabinet(ctx); break;
      case "suppBudget":
        if(S.suppPending && !S.suppDone){ suppMode = ctx.mode || "balanced"; suppDraft = ctx.draft ? normalizeSuppDraft(ctx.draft, suppMode) : suppDefaults(suppMode); renderSuppBudget(); }
        else renderMain();
        break;
      case "poll": showPoll(ctx.policyMsg, ctx.eventMsg); break;
      case "coopOffer": if(S.pendingCoop) renderCoopOffer(); else renderMain(); break;
      case "negotiateOffer": if(S.pendingNegotiate) renderNegotiateOffer(); else renderMain(); break;
      case "offer": if(S.pendingOffer) renderIncomingOffer(); else renderMain(); break;
      case "event": {
        const ev = EVENTS.find(e=>e.id===ctx.evId);
        if(ev) renderEvent(ev, ctx.policyMsg); else renderMain();
        break;
      }
      case "postCrisis": postCrisisCheck(); break;
      case "electionSetup":
        electionCtx = ctx.ctx || null;
        if(electionCtx) startElection(electionCtx.kind, electionCtx.dissolved); else renderMain();
        break;
      case "electionResult":
        electionCtx = ctx.ctx || null;
        if(electionCtx && electionCtx.result) renderElectionResult(); else renderMain();
        break;
      default: renderMain();
    }
  }catch(e){ renderMain(); }
  restoringUI = false;
}
function restoreCabinet(ctx){
  cabinetFirstFlag = !!ctx.first;
  cabinetDraft = ctx.draft || {};
  cabinetNotice = ctx.notice || "";
  cabinetAutoNote = "";
  POSTS.forEach(p=>{ if(!(p.id in cabinetDraft)) cabinetDraft[p.id] = S.cabinet[p.id] || null; });
  if(!("chief" in cabinetDraft)) cabinetDraft.chief = S.electionChief || null;
  renderCabinet(cabinetFirstFlag);
}

/* ---------------- アーカイブ ---------------- */
function loadArchive(){
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "[]"); } catch(e){ return []; }
}
function saveArchive(rank){
  try {
    const arc = loadArchive();
    arc.unshift({ pmName:S.pmName, partyName: partyById(S.pmParty).name, months:S.turn, rank,
      cabinet: (typeof cabinetName==="function" ? cabinetName() : ""),
      endType:S.endType||"", endLabel:S.endReasonLabel||"",
      maxApproval:S.maxApproval, minApproval:S.minApproval, policies:S.policiesDone.length,
      career: S.pmCareer ? S.pmCareer.summary : "",
      elections:S.elections.length, electionList: deepCopy(S.elections||[]),
      birthStart: typeof S.birthStart==="number" ? S.birthStart : null, birthEnd: typeof S.birthRate==="number" ? S.birthRate : null,
      date: new Date().toISOString().slice(0,10) });
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc.slice(0,30)));
  } catch(e){ /* 保存できない環境では記録のみで続行 */ }
}

/* ---------------- 起動 ---------------- */
showTitle();
</script>
