<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>首相シミュレーション 〜政権運営と支持率〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --bg2:#ece7db; --card:#fffdf8; --card2:#f8f4ec;
  --ink:#1c1a16; --ink2:#5a554b; --ink3:#8a8378;
  --line:#d8d0bf; --line2:#c4bba6;
  --navy:#1d3557; --navy2:#2a4a73; --red:#b3271e; --red2:#8f1d16;
  --gold:#a07d2c; --green:#2e6b3e; --blue:#2456a6;
  --good:#2e6b3e; --bad:#b3271e;
  --shadow:0 2px 10px rgba(40,32,18,.10);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17150f; --bg2:#100e0a; --card:#221f18; --card2:#2a271e;
    --ink:#efe9dc; --ink2:#c9c0ab; --ink3:#9a917c;
    --line:#3d382c; --line2:#57503e;
    --navy:#7fa3d0; --navy2:#a8c2e2; --red:#e0655c; --red2:#e0655c;
    --gold:#cfa64e; --green:#7cc48e; --blue:#8db1e8;
    --good:#7cc48e; --bad:#e0655c;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
h1,h2,h3{font-family:"Shippori Mincho",serif;margin:0}
.hidden{display:none!important}

/* ---------- 共通 ---------- */
.btn{
  display:inline-block;border:1.5px solid var(--navy);background:var(--navy);color:#fff;
  padding:11px 20px;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:.02em;
  transition:transform .08s, opacity .15s;text-align:center;
}
.btn:active{transform:scale(.97)}
.btn.sub{background:transparent;color:var(--navy)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
.tag.red{background:var(--red);color:#fff;border-color:var(--red)}
.tag.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini{font-size:12px;color:var(--ink2)}
.tiny{font-size:11px;color:var(--ink3)}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.flex{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1}

/* ---------- タイトル ---------- */
.masthead{padding:34px 0 6px;text-align:center;border-bottom:3px double var(--ink);margin-bottom:6px}
.masthead .date-line{font-size:12px;color:var(--ink2);letter-spacing:.15em}
.masthead h1{font-size:clamp(30px,7.5vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.25;margin:8px 0 4px}
.masthead .sub{font-family:"Shippori Mincho",serif;font-size:clamp(14px,3.6vw,19px);color:var(--red);font-weight:700;letter-spacing:.3em}
.rule{border-top:1px solid var(--ink);margin:4px 0 18px}
.title-lead{font-size:14px;color:var(--ink2);text-align:center;max-width:620px;margin:0 auto 18px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr}}
.mode-card{cursor:pointer;text-align:left;padding:18px}
.mode-card:hover{border-color:var(--navy)}
.mode-card h3{font-size:19px;margin-bottom:6px}
.mode-card p{font-size:13px;color:var(--ink2);margin:0}
.fiction-note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:22px;line-height:1.7}

/* ---------- 選択リスト ---------- */
.pick-list{display:flex;flex-direction:column;gap:10px}
.pick{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);color:var(--ink);
}
.pick:hover{border-color:var(--navy)}
.pick.sel{border-color:var(--red);background:var(--card2)}
.pick .avatar{
  flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"Shippori Mincho",serif;font-weight:800;font-size:19px;color:#fff;background:var(--navy);
}
.pick h4{margin:0 0 2px;font-size:16px}
.pick .desc{font-size:12.5px;color:var(--ink2)}
.stat-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2)}
.chip b{color:var(--ink)}
.chip.warn b{color:var(--red)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:10px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hud-date{font-family:"Shippori Mincho",serif;font-weight:800;font-size:19px}
.hud-pm{font-size:13px;color:var(--ink2)}
.approval-box{display:flex;align-items:center;gap:14px;margin-top:8px}
.approval-num{font-family:"Shippori Mincho",serif;font-size:44px;font-weight:800;line-height:1;color:var(--navy)}
.approval-num.low{color:var(--red)}
.approval-lab{font-size:11px;color:var(--ink2);letter-spacing:.1em}
.delta{font-weight:700;font-size:14px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.gauge{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.gauge>i{display:block;height:100%;background:var(--navy);transition:width .6s}
.gauge>i.low{background:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat-cell .k{font-size:11px;color:var(--ink2)}
.stat-cell .v{font-size:17px;font-weight:900}
.stat-cell .v small{font-size:11px;font-weight:500;color:var(--ink2)}
.countdown{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cd{flex:1;min-width:150px;background:var(--navy);color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.cd b{font-size:16px}
.cd.urgent{background:var(--red)}
.twist-banner{background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-top:8px;text-align:center}

/* ---------- 勢力図 ---------- */
.party-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.party-dot{flex:0 0 10px;width:10px;height:10px;border-radius:3px}
.party-name{flex:0 0 108px;font-weight:700;white-space:nowrap;overflow:hidden}
.party-bar{flex:1;height:9px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.party-bar>i{display:block;height:100%}
.party-num{flex:0 0 74px;text-align:right;color:var(--ink2);font-size:11.5px}
.gov-mark{font-size:10px;color:var(--red);font-weight:900}

/* ---------- 政策カード ---------- */
.policy-card{border:1.5px solid var(--line2)}
.policy-card .field{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--red)}
.policy-card h3{font-size:19px;margin:3px 0 6px}
.policy-card .pdesc{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.opt{
  display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:8px;padding:11px 13px;margin-top:8px;color:var(--ink);
}
.opt:hover{border-color:var(--navy)}
.opt .olab{font-weight:800;font-size:15px}
.opt .odet{font-size:12.5px;color:var(--ink2);margin-top:2px}
.opt .ocost{font-size:11.5px;margin-top:5px;color:var(--gold);font-weight:700}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.procon{grid-template-columns:1fr}}
.procon div{border-radius:8px;padding:8px 10px;font-size:12px}
.procon .pro{background:rgba(46,107,62,.10);border:1px solid rgba(46,107,62,.35)}
.procon .con{background:rgba(179,39,30,.08);border:1px solid rgba(179,39,30,.3)}
.procon b{display:block;font-size:11px;letter-spacing:.08em;margin-bottom:2px}

/* ---------- 新聞・速報 ---------- */
.newsflash{
  background:var(--red);color:#fff;border-radius:var(--radius);padding:14px 16px;text-align:center;
  box-shadow:var(--shadow);
}
.newsflash .nf-k{font-size:12px;letter-spacing:.4em;font-weight:900}
.newsflash .nf-t{font-family:"Shippori Mincho",serif;font-size:clamp(20px,5.4vw,28px);font-weight:800;margin-top:4px;line-height:1.35}
.paper{background:#fffdf6;color:#1c1a16;border:1px solid #c9c0aa;padding:18px 16px;box-shadow:0 4px 18px rgba(40,32,18,.18)}
@media (prefers-color-scheme: dark){.paper{background:#efe9dc}}
.paper .p-head{display:flex;justify-content:space-between;font-size:11px;color:#6b6353;border-bottom:2px solid #1c1a16;padding-bottom:4px}
.paper h2{font-size:clamp(24px,6.4vw,36px);line-height:1.3;margin:10px 0 6px;color:#14120e}
.paper .p-sub{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;color:#8f1d16;margin-bottom:8px}
.paper p{font-size:13.5px;color:#33302a;line-height:1.8;margin:6px 0}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.paper th,.paper td{border-bottom:1px solid #d8d0bf;padding:5px 6px;text-align:right}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper .win{font-weight:900;color:#8f1d16}

/* ---------- モーダル ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,12,8,.62);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 10px 40px}
.sheet{width:100%;max-width:680px}
.sheet .card{max-height:none}
.seg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2.5px 0}
.seg-row .sn{flex:0 0 84px;font-weight:700}
.seg-row .sb{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.seg-row .sb>i{display:block;height:100%;background:var(--blue)}
.seg-row .sv{flex:0 0 66px;text-align:right;color:var(--ink2);font-size:11.5px}

/* ---------- 予算 ---------- */
.budget-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.budget-row .br-top{display:flex;justify-content:space-between;align-items:baseline}
.budget-row .br-name{font-weight:800;font-size:15px}
.budget-row .br-val{font-weight:900;font-size:16px;color:var(--navy)}
.budget-row input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--navy)}
.budget-row .br-note{font-size:11.5px;color:var(--ink2)}
.budget-total{display:flex;justify-content:space-between;font-weight:900;font-size:16px;padding:10px 0}
.budget-total .over{color:var(--red)}

/* ---------- ログ ---------- */
.log-item{border-left:3px solid var(--line2);padding:6px 0 6px 12px;margin-top:8px;font-size:13px}
.log-item .lt{font-weight:800}
.log-item .ld{color:var(--ink2);font-size:12.5px}
.reaction{font-size:12.5px;padding:7px 10px;border-radius:8px;margin-top:6px;background:var(--card2);border:1px solid var(--line)}
.reaction b{font-size:11px;letter-spacing:.06em}

.section-title{font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.section-title small{font-size:12px;color:var(--ink2);font-family:"Noto Sans JP",sans-serif;font-weight:500}
.rank-badge{font-family:"Shippori Mincho",serif;font-size:74px;font-weight:800;line-height:1;color:var(--gold)}
input[type=text]{font-family:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
select{font-family:inherit;font-size:15px;padding:10px;border:1.5px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.footer-note{text-align:center;font-size:11px;color:var(--ink3);margin-top:30px;line-height:1.7}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv b{text-align:right}
</style>
</head>

<script>

   能力値・発言・出来事はすべてゲーム用に創作したものです。

function partyById(id){ return PARTIES.find(p=>p.id===id); }

/* ---------------- 首相候補（実在） ---------------- */

/* ---------------- 閣僚候補プール（実在＋架空） ---------------- */

function hashName(s){ let h=7; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return h; }
function fillBio(list, minAge, maxAge){
  list.forEach(p=>{
    if(p.age==null) p.age = minAge + hashName(p.name) % (maxAge-minAge+1);

      if(p.age>=48 && p.terms<2) p.terms = 2 + hashName(p.name+"#u") % 3;
    }
  });
}

    }
    let trait;
    if(p.pop==null){ /* 選対委員長など能力が選挙skillのみの人物 */
      trait = p.skill>=80 ? "選挙実務に通じた参謀タイプ" : p.skill>=70 ? "堅実な選挙運びに定評がある" : "大胆な選挙戦術を好むタイプ";
    }
    else if(p.risk>=30) trait = "発言が注目を集めやすい個性派";
    else if(p.skill>=78) trait = "政策に通じた実務派";
    else if((p.debate||0)>=70) trait = "国会答弁に強い論客タイプ";
    else if(p.pop>=60) trait = "知名度と親しみやすさが武器";
    else if((p.terms||0)>=8) trait = "地元の信頼が厚いベテラン";
    else trait = "堅実な仕事ぶりの実務派";
    const groups = {ldp:["保守派","実務派","改革派","地方重視派"], gomei:["福祉・平和重視"], cdp:["リベラル派","社会保障重視","実務派"],
      ishin:["改革派"], dpfp:["中道・現実派"], reiwa:["積極財政派"], jcp:["革新派"], sansei:["保守・草の根派"], civilian:["専門家（無派閥）"]};
    const gpool = groups[p.party] || ["実務派"];
    const group = gpool[h % gpool.length];
    let elec;
    if(p.civilian) elec = "専門家型（選挙区なし）";
    else if(p.pop==null) elec = p.skill>=80 ? "選挙実務のベテラン型" : p.skill>=70 ? "組織戦に堅実な着実型" : "読みの外れることもある大胆型";
    else if((p.terms||0)>=8) elec = "地盤の固いベテラン型";
    else if(p.pop>=62) elec = "知名度で押し切る人気者型";
    else if((p.terms||0)<=2) elec = "風に乗る挑戦者型";
    else if(p.pop<=48) elec = "組織票が堅い着実型";
    else elec = "バランス型";
    pr = {bg, trait, group, elec};
  }
  p._prof = pr;
  return pr;
}
function profileLine(p){ const pr = profileOf(p); return `${pr.bg} ― ${pr.trait}`; }
function profileChips(p){ const pr = profileOf(p); return `<span class="chip">${esc(pr.group)}</span><span class="chip">選挙 <b>${esc(pr.elec)}</b></span>`; }

function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function totalGovHR(){ let t = S.hrSeats[S.pmParty]||0; if(S.coalition){ t += S.hrSeats[S.coalition.partyId]||0; if(S.coalition.partner2) t += S.hrSeats[S.coalition.partner2]||0; } return t; }
function totalGovHC(){ let t = S.hcSeats[S.pmParty]||0; if(S.coalition){ t += S.hcSeats[S.coalition.partyId]||0; if(S.coalition.partner2) t += S.hcSeats[S.coalition.partner2]||0; } return t; }
function overallFromSeg(){
  let s=0,w=0; SEGMENTS.forEach(g=>{ s += S.seg[g.id]*g.w; w+=g.w; }); return s/w;
}

let pendingNewMode = null;
function requestNewGame(mode){
  if(loadSave()){ pendingNewMode = mode; showNewGameConfirm(); return; }
  if(mode==="real") startRealFlow(); else startFictionFlow();
}
function showNewGameConfirm(){
  const d = document.createElement("div");
  d.className = "overlay"; d.id = "newGameConfirm";
  d.innerHTML = `<div class="sheet"><div class="card center">
    <p style="font-weight:700;font-size:16px">プレイ中のセーブデータがあります</p>
    <p class="mini">新しく始めると、進行中の政権のセーブデータは消去され、元に戻せません。よろしいですか？</p>
    <div class="flex mt">
      <button class="btn red grow" onclick="confirmNewGame()">セーブを消して新しく始める</button>
      <button class="btn ghost grow" onclick="cancelNewGame()">やめる</button>
    </div></div></div>`;
  document.body.appendChild(d);
}
function confirmNewGame(){
  clearSave();
  const m = pendingNewMode; pendingNewMode = null;
  const d = document.getElementById("newGameConfirm"); if(d) d.remove();
  if(m==="real") startRealFlow(); else startFictionFlow();
}
function cancelNewGame(){
  pendingNewMode = null;
  const d = document.getElementById("newGameConfirm"); if(d) d.remove();
}

function careerOrigin(id){ return CAREER_ORIGINS.find(o=>o.id===id); }
function careerPost(id){ return CAREER_POSTS.find(p=>p.id===id); }
function careerSpec(id){ return CAREER_SPECS.find(s=>s.id===id); }
/* 経歴から現在の年齢を逆算する：初当選年齢＋（当選回数−1）×4年＋首長経験などの年数 */
function careerAge(d){
  let age = d.firstAge + Math.max(0, d.terms-1)*4;
  d.posts.forEach(pid=>{ const p = careerPost(pid); if(p) age += p.ageAdd||0; });
  return clamp(age, 32, 82);
}
/* 経歴全体から能力値・初期支持の素を組み立てる */
function computeCareerStats(d){
  const o = careerOrigin(d.origin);
  const st = {skill:66, pop:60, debate:66, risk:22, base:50};
  const seg = {};
  const addD = (dd)=>{ if(!dd) return; ["skill","pop","debate","risk","base"].forEach(k=>{ if(dd[k]) st[k]+=dd[k]; }); };
  const addSeg = (ss)=>{ if(!ss) return; Object.keys(ss).forEach(k=>{ seg[k]=(seg[k]||0)+ss[k]; }); };
  addD(o.d); addSeg(o.seg);
  d.posts.forEach(pid=>{ const p = careerPost(pid); if(p){ addD(p.d); addSeg(p.seg); } });
  st.skill = clamp(Math.round(st.skill), 35, 96);
  st.pop = clamp(Math.round(st.pop), 35, 96);
  st.debate = clamp(Math.round(st.debate), 35, 96);
  st.risk = clamp(Math.round(st.risk), 5, 70);
  st.base = clamp(Math.round(st.base), 44, 60);
  return {stats:st, seg, age:careerAge(d)};
}
/* 経歴の要約（記録サマリー・アーカイブ用の一文） */
function careerSummaryText(c){
  if(!c) return "";
  const posts = (c.posts||[]).map(pid=>{ const p = careerPost(pid); return p?p.name:""; }).filter(Boolean);
  return `${c.originName}／初当選${c.firstAge}歳・当選${c.terms}回${posts.length?"／"+posts.join("・"):""}／得意分野：${c.specName}`;
}
/* 新聞の人物紹介風プロフィール本文 */
function careerProfileBody(){
  const c = S.pmCareer; if(!c) return "";
  const o = careerOrigin(c.originId);
  const st = computeCareerStats({origin:c.originId, firstAge:c.firstAge, terms:c.terms, posts:c.posts});
  const posts = (c.posts||[]).map(pid=>{ const p = careerPost(pid); return p?p.name:""; }).filter(Boolean);
  const segNames = {youth:"若年層", parents:"子育て世代", elderly:"高齢層", business:"ビジネス層", rural:"地方", urban:"都市部"};
  const segSorted = Object.keys(st.seg).sort((a,b)=>st.seg[b]-st.seg[a]);
  const strongSeg = segSorted.filter(k=>st.seg[k]>0).slice(0,2).map(k=>segNames[k]).join("・");
  const weakSeg = segSorted.filter(k=>st.seg[k]<0).slice(-1).map(k=>segNames[k])[0];
  return `【人物】${esc(S.pmName)}首相は${esc(c.originName)}。${esc(o?o.catch:"")}。`
    + `${c.firstAge}歳で初当選し、当選${c.terms}回。${posts.length?`これまでに${posts.join("、")}を歴任し、`:"華々しい役職歴こそないものの、"}着実に階段を上って首相の座をつかんだ。現在${S.pmAge}歳。`
    + `得意分野は${esc(c.specName)}で、この分野の政策では人一倍の手応えを発揮するとされる。`
    + `${strongSeg?`${strongSeg}からの期待が厚い一方、`:""}${weakSeg?`${weakSeg}の支持をどう広げるかが課題だ。`:"幅広い層への浸透が課題だ。"}`
    + `${o?`長所は「${esc(o.strong)}」。弱点として「${esc(o.weak)}」が挙げられる。`:""}`
    + `この経歴が政権運営の追い風になるか、それとも足かせになるかは、これからの判断次第だ。`;
}

    skill:stats.skill, pop:stats.pop, debate:stats.debate, risk:stats.risk, base:stats.base,
    age, terms:d.terms, fictional:true,
    career, specFields:spec.fields.slice(), segFx:seg,

/* ---------------- セットアップ共通 ---------------- */
function beginSetup(pm){
  S = newState();
  resumeScreen = null;
  PARTIES.forEach(p=>{ S.hrSeats[p.id]=p.hr; S.hcSeats[p.id]=p.hc; S.partySupport[p.id]=p.support; });
  S.pmName = pm.name; S.pmParty = pm.party; S.pmSkill = pm.skill; S.pmPop = pm.pop;
  S.pmDebate = pm.debate; S.pmRisk = pm.risk; S.fictional = pm.fictional;
  S.pmAge = pm.age||0; S.pmTerms = pm.terms||0;
  S.pmCareer = pm.career || null;
  S.pmSpecFields = pm.specFields || [];
  const base = pm.base;
  SEGMENTS.forEach(g=>{ S.seg[g.id] = clamp(base + ri(-6,6) + (g.id==="youth"? (pm.pop-65)/4 : 0), 15, 90); });
  /* 経歴（出発点・役職）による層別の第一印象 */
  if(pm.segFx){ Object.keys(pm.segFx).forEach(k=>{ if(S.seg[k]!=null) S.seg[k] = clamp(S.seg[k] + pm.segFx[k], 15, 90); }); }
  /* 首相自身の年齢も世代別の第一印象に効く：若い首相は若年層に、ベテラン首相は高齢層に安心感 */
  if(S.pmAge && S.pmAge<=50){ S.seg.youth = clamp(S.seg.youth+3, 15, 90); S.seg.elderly = clamp(S.seg.elderly-1, 15, 90); }
  else if(S.pmAge && S.pmAge>=65){ S.seg.elderly = clamp(S.seg.elderly+2, 15, 90); S.seg.youth = clamp(S.seg.youth-1, 15, 90); }
  S.approval = Math.round(overallFromSeg()); S.prevApproval = S.approval;
  S.maxApproval = S.approval; S.minApproval = S.approval;
  S.approvalHist = [S.approval];
  /* 衆院は直近選挙後という設定で残り任期をランダム化、参院選も */
  S.hrTermLeft = ri(10, 44);
  S.hcTermLeft = ri(8, 34);
  coalitionStep();
}

/* ---------------- 連立選択 ---------------- */
function coalitionStep(){
  const own = S.hrSeats[S.pmParty];
  const need = Math.floor(HR_TOTAL/2)+1;
  const pmParty = partyById(S.pmParty);
  if(own >= need){
    S.coalitionHist.push("単独政権で発足");
    cabinetStep(true);
    return;
  }
  const candidates = PARTIES.filter(p=>p.id!==S.pmParty && p.id!=="other" && (S.hrSeats[p.id]||0) >= 8)
    .sort((a,b)=>S.hrSeats[b.id]-S.hrSeats[a.id]);
  show(`
    <h2 class="section-title">連立協議 <small>${esc(pmParty.name)}は衆院${own}議席で過半数（${need}）に届かない</small></h2>
    <p class="mini mb">政権を発足させるには連立相手が必要だ。相手には「協力の条件」があり、重視する政策を無視し続けると関係が悪化し、連立離脱の危機になる。相手に渡す閣僚ポストも安定度に影響する。</p>
    <div class="pick-list">
    ${candidates.map(p=>{
      const tot = own + S.hrSeats[p.id];

      return `<button class="pick" onclick="chooseCoalition('${p.id}')">
        <div class="avatar" style="background:${p.color}">${esc(p.short[0])}</div>
        <div class="grow"><h4>${esc(p.name)} と連立を組む</h4>
        <div class="desc">衆院${S.hrSeats[p.id]}議席 ／ 連立後の合計 ${tot}議席（${tot>=need?"過半数":"過半数に届かない"}）</div>
        <div class="desc">協力の条件：<b>${cond.label}</b> ― ${cond.desc}</div>
        <div class="stat-chips"><span class="chip">安定度 <b>${coalitionStability(p.id)}</b></span><span class="chip">政策の自由度 <b>${100-coalitionStability(p.id)+ri(0,10)}</b></span></div>
        </div></button>`;
    }).join("")}
    <button class="pick" onclick="chooseCoalition(null)">
      <div class="avatar" style="background:#666">少</div>
      <div class="grow"><h4>連立を組まず少数与党で発足</h4>
      <div class="desc">法案ごとに野党の協力が必要になる、綱渡りの政権運営。政策の自由度は最大だが、法案成立率は大きく下がる。</div></div>
    </button>
    </div>
  `);
  setResume("coalition", {});
}
function coalitionCondition(partyId){
  const map = {
    gomei:{field:"child", label:"子育て・福祉の拡充", desc:"子育て支援と社会保障の後退は認めない姿勢"},
    ishin:{field:"reform", label:"行財政改革の推進", desc:"改革に後ろ向きな政策が続くと不満が高まる"},
    dpfp:{field:"tax", label:"手取りを増やす減税路線", desc:"増税や負担増の政策には強く反発する"},
    cdp:{field:"energy", label:"原発に慎重なエネルギー政策", desc:"再稼働の強行は連立の継続を難しくする"},
    ldp:{field:"defense", label:"安全保障政策の着実な推進", desc:"防衛力強化の後退は認めない姿勢"},
    sansei:{field:"local", label:"地方と農業の保護", desc:"地方・農業を軽視する政策には反発する"},
    reiwa:{field:"welfare", label:"積極財政と給付の拡充", desc:"緊縮路線とは相容れない"},
    jcp:{field:"defense", label:"防衛費抑制と平和外交", desc:"防衛増強の推進は連立の継続を難しくする"},
  };
  return map[partyId] || {field:"econ", label:"経済政策での協力", desc:"経済運営での協力を求める"};
}
function coalitionStability(partyId){
  const a = partyById(S.pmParty).stance, b = partyById(partyId).stance;
  let same = 0, keys = Object.keys(a);
  keys.forEach(k=>{ if(a[k]===b[k]) same++; });
  return clamp(40 + same*9 + ri(0,10), 30, 92);
}
function chooseCoalition(partyId){
  if(partyId){
    S.coalition = {partyId, rel: coalitionStability(partyId), since: 0};
    S.coalitionHist.push(`${partyById(partyId).name}と連立を組んで発足`);
  } else {
    S.coalitionHist.push("少数与党で発足");
  }
  cabinetStep(true);
}

/* 与党の党ID一覧：首相の所属政党＋現在の連立パートナー（主パートナーと追加パートナー） */

}

function ministerCandidates(post){
  const spec = POST_SPEC[post.id];
  /* 候補は与党（自党＋現在の連立パートナー）の議員だけ。野党議員は一切含めない */
  let pool = MINISTER_POOL.filter(m=>isGovParty(m.party));
  pool.sort((a,b)=>{
    const as = (a.spec===spec?2:0) + (a.party!==S.pmParty?0.6:0) + a.skill/100;
    const bs = (b.spec===spec?2:0) + (b.party!==S.pmParty?0.6:0) + b.skill/100;
    return bs-as;
  });
  /* 官房長官は答弁・人気重視で並べる */
  if(post.id==="kanbo") pool.sort((a,b)=>((b.debate+b.pop) - (a.debate+a.pop)));
  return pool;
}
function civilianCandidates(post){
  const spec = POST_SPEC[post.id];
  let pool = CIVILIAN_POOL.slice();
  pool.sort((a,b)=>{
    const as = (a.spec===spec?2:0) + a.skill/100;
    const bs = (b.spec===spec?2:0) + b.skill/100;
    return bs-as;
  });
  if(post.id==="kanbo") pool.sort((a,b)=>((b.debate+b.pop) - (a.debate+a.pop)));
  /* 別枠は各ポスト最大2人まで（専門一致を優先） */
  return pool.slice(0,2);
}

/* 内閣の年齢・当選回数構成が世代別支持に与える小さな影響と、新聞向けの反応文 */
function cabinetGenEffect(){
  const ms = POSTS.map(p=>S.cabinet[p.id]).filter(Boolean);
  if(!ms.length) return {eff:{}, note:""};
  const youngN = ms.filter(m=>ageOf(m)!=null && ageOf(m)<=52).length;
  const vetN = ms.filter(m=>!m.civilian && termsOf(m)>=8).length;
  const eff = {}; let note = "";
  if(youngN>=3){ eff.youth = 2; eff.elderly = -0.7; note = "若手の抜擢が目立つ布陣に、若年層から期待の声が上がる一方、高齢層には「経験不足」との不安も出た。"; }
  else if(youngN===2){ eff.youth = 1; note = "若手閣僚の登用が、政権の新鮮な印象につながったとの見方が出ている。"; }
  if(vetN>=4){ eff.elderly = (eff.elderly||0) + 2; eff.youth = (eff.youth||0) - 0.7; note = "ベテラン中心の堅実な布陣に高齢層は安心感を示したが、若年層には「刷新感に欠ける」との声もあった。"; }
  if(youngN>=1 && vetN>=1 && youngN<3 && vetN<4){ eff.all = 0.7; if(!note) note = "若手とベテランのバランスが取れた布陣と評価された。"; }
  Object.keys(eff).forEach(k=>{ if(!eff[k]) delete eff[k]; });
  return {eff, note};
}

/* ---------------- 支持率計算 ---------------- */
function applySeg(eff){
  if(!eff) return;
  if(eff.all) SEGMENTS.forEach(g=>{ S.seg[g.id]=clamp(S.seg[g.id]+eff.all, 3, 97); });
  SEGMENTS.forEach(g=>{ if(eff[g.id]) S.seg[g.id]=clamp(S.seg[g.id]+eff[g.id], 3, 97); });
}
function applySegAll(v){ SEGMENTS.forEach(g=>{ S.seg[g.id]=clamp(S.seg[g.id]+v, 3, 97); }); }
function recalcApproval(){
  S.prevApproval = S.approval;
  /* 官房長官の下支え：人気と答弁が高いと下振れを緩和 */
  let target = overallFromSeg();
  const kanbo = S.cabinet.kanbo;
  if(kanbo) target += (kanbo.pop-55)/22 + (kanbo.debate-60)/40;
  target += (S.econ-50)/9 + (S.fisc-45)/14 + (50-S.infl)/20;
  if(S.twisted) target -= 1.2;
  if(!S.coalition && totalGovHR() < HR_TOTAL/2) target -= 0.8;
  S.approval = clamp(Math.round(target + rnd(-1.2,1.2)), 2, 96);
  S.maxApproval = Math.max(S.maxApproval, S.approval);
  S.minApproval = Math.min(S.minApproval, S.approval);
  S.approvalHist.push(S.approval);
  if(S.approval < 25) S.lowStreak++; else if(S.approval >= 30) S.lowStreak = 0;
  /* 党支持率の連動 */
  PARTIES.forEach(p=>{
    let drift = rnd(-0.7,0.7);
    if(p.id===S.pmParty) drift += (S.approval-42)/26;
    if(S.coalition && p.id===S.coalition.partyId) drift += (S.approval-45)/40;
    if(p.id==="cdp") drift += (38-S.approval)/30;
    S.partySupport[p.id] = clamp(S.partySupport[p.id]+drift, 1, 55);
  });
}

  {id:"child", name:"子育て・教育", note:"子育て支援と教育投資。子育て世代と若者に効く", seg:"parents"},
  {id:"econ", name:"経済対策", note:"成長戦略と産業支援。ビジネス層と全体の景気に効く", seg:"business"},

];
let budgetDraft = null;
function showBudget(){
  budgetDraft = {};
  const def = {welfare:34, public:8, defense:6, child:8, econ:10, science:5, local:9, disaster:5};
  BUDGET_FIELDS.forEach(f=>{ budgetDraft[f.id] = (S.budget && S.budget[f.id]!=null)? S.budget[f.id] : def[f.id]; });
  renderBudget();
}
function budgetTotalNow(){ return BUDGET_FIELDS.reduce((s,f)=>s+(budgetDraft[f.id]||0),0); }
function renderBudget(){
  const total = budgetTotalNow();
  const over = total > 100;
  show(`
    <h2 class="section-title">${S.year}年度 予算配分 <small>合計100%に収める（超過分は国債＝財政悪化）</small></h2>
    <div class="card">
      ${BUDGET_FIELDS.map(f=>`
      <div class="budget-row">
        <div class="br-top"><span class="br-name">${esc(f.name)}</span><span class="br-val" id="bv-${f.id}">${budgetDraft[f.id]}%</span></div>
        <input type="range" min="0" max="45" step="1" value="${budgetDraft[f.id]}" oninput="setBudget('${f.id}', this.value)">
        <div class="br-note">${esc(f.note)}</div>
      </div>`).join("")}
      <div class="budget-total"><span>合計</span><span class="${over?"over":""}" id="budgetTotal">${total}% ${over?"（超過：財政が悪化する）":""}</span></div>
      <p class="mini">財源の裏付けなく配分を膨らませると、財政の健全さが下がり、将来の政策の自由度を奪う。削った分野では関係する層の不満がたまる。</p>
      <button class="btn big" onclick="confirmBudget()">この予算で決定する</button>
    </div>
  `);
  const el = document.getElementById("budgetTotal");
}
function setBudget(id, v){
  budgetDraft[id] = parseInt(v,10);
  document.getElementById("bv-"+id).textContent = v+"%";
  const total = budgetTotalNow();
  const t = document.getElementById("budgetTotal");
  t.innerHTML = `${total}% ${total>100?"（超過：財政が悪化する）":""}`;
  t.className = total>100 ? "over" : "";
}
function confirmBudget(){
  const total = budgetTotalNow();
  const prev = S.budget;
  S.budget = {...budgetDraft};
  S.budgetDone = true;
  /* 効果：各分野の増減が対応層の満足に、超過は財政に */
  let notes = [];
  BUDGET_FIELDS.forEach(f=>{
    const before = prev ? (prev[f.id]||0) : {welfare:34,public:8,defense:6,child:8,econ:10,science:5,local:9,disaster:5}[f.id];
    const d = S.budget[f.id]-before;
    if(f.seg && d!==0){ S.seg[f.seg] = clamp(S.seg[f.seg] + d*0.55, 3, 97); }
    if(f.id==="econ") S.econ = clamp(S.econ + d*0.5, 5, 97);
    if(f.id==="science") S.econ = clamp(S.econ + d*0.25, 5, 97);
    if(f.id==="defense") S.seg.elderly = clamp(S.seg.elderly + d*0.2, 3, 97);
  });
  if(total>100){ S.fisc = clamp(S.fisc - (total-100)*0.9, 3, 97); notes.push(`歳出超過（${total}%）で財政が悪化した`); }
  else if(total<=96){ S.fisc = clamp(S.fisc + (96-total)*0.35 + 1, 3, 97); notes.push("緊縮気味の編成で財政は改善した"); }
  else { S.fisc = clamp(S.fisc + 0.6, 3, 97); }
  S.policyLog.push({title:`${S.year}年度予算を決定`, text:`配分の柱：${BUDGET_FIELDS.slice().sort((a,b)=>S.budget[b.id]-S.budget[a.id]).slice(0,2).map(f=>f.name).join("・")}。${notes.join("。")||"大きな波紋はなかった。"}`});
  setResume("main", {});
  showPaper({
    kicker:"速報", title:`${S.year}年度予算が成立へ`, sub: total>100?"歳出膨張への懸念も":"配分の重点は "+BUDGET_FIELDS.slice().sort((a,b)=>S.budget[b.id]-S.budget[a.id])[0].name,
    body:`政府は${S.year}年度予算の配分を決定した。社会保障${S.budget.welfare}%、防衛${S.budget.defense}%、子育て・教育${S.budget.child}%など。
    ${notes.length?notes.join("。")+"。":"財政とのバランスに配慮した編成との評価がある。"}
    ${S.twisted?"ただし参院はねじれ国会のため、審議の行方には不透明感が残る。":""}`,
    btn:"政権運営に戻る", fn:"renderMain()"
  });
}

/* ---------------- 政策フェーズ ---------------- */
let policyChoices = [];
function availablePolicies(){
  const avail = POLICIES.filter(p=>{
    if(p.id==="tariff" && S.tariffDone) return false; /* 関税交渉は合意で終了。通常候補には出ない */
    if(p.stages) return !(S.usedPolicies[p.id]!=null && S.turn - S.usedPolicies[p.id] < 14);
    return !(S.usedPolicies[p.id]!=null && S.turn - S.usedPolicies[p.id] < 9);
  });
  /* 分野クールダウン：最近取り上げた分野はしばらく候補に出にくくする */
  const fresh = avail.filter(p=> !(S.fieldUsed && S.fieldUsed[p.field]!=null && S.turn - S.fieldUsed[p.field] < 4));
  return fresh.length >= 3 ? fresh : avail;
}
function startPolicyPhase(){
  if(S.activePolicy){ renderActivePolicy(); return; }
  if(S.restrictPolicy){
    /* 災害の現地視察と復旧対応に追われ、今月は政策判断の時間が取れない */
    show(`
      <div class="newsflash mb"><div class="nf-k">災害対応</div><div class="nf-t">復旧対応を優先し、今月の政策判断は見送り</div></div>
      <div class="card">
        <p style="font-size:14.5px">先月の災害で首相が現地視察と復旧の陣頭指揮に当たったため、今月は政策判断に割く時間が取れない。官邸は復旧の進捗管理と被災自治体との調整に追われている。</p>
        <p class="mini">被災地の復旧は着実に進んでいるが、通常の政策運営はひと月止まることになる。これも現地へ行く判断の代償だ。</p>
        <button class="btn big mt" onclick="finishRestrictedMonth()">復旧対応に専念して月を終える</button>
        <button class="btn ghost big mt" onclick="renderMain()">政権運営に戻る</button>
      </div>`);
    return;
  }
  policyChoices = shuffle(availablePolicies()).slice(0,3);
  if(!policyChoices.length){ policyChoices = shuffle(POLICIES.filter(p=>!(p.id==="tariff"&&S.tariffDone))).slice(0,3); }
  show(`
    <h2 class="section-title">今月の政策判断 <small>取り組む課題を1つ選ぶ</small></h2>
    <div class="pick-list">
    ${policyChoices.map((p,i)=>`
      <button class="pick" onclick="choosePolicy(${i})">
        <div class="grow"><span class="tag">${esc(p.field)}</span> ${p.stages?'<span class="tag navy">継続交渉（数か月）</span>':""}
        <h4 class="mt" style="margin-top:6px">${esc(p.title)}</h4>

/* 同じ分野でも、前回と違う中身（バリエーション）が出るように選ぶ */
function pickVariant(p){
  const sets = [{desc:p.desc, opts:p.opts}].concat(p.alts||[]);
  if(sets.length===1) return p;
  S.policyVariant = S.policyVariant || {};
  const last = S.policyVariant[p.id];
  let idx; do { idx = ri(0, sets.length-1); } while(idx===last);
  S.policyVariant[p.id] = idx;
  const v = sets[idx];
  return Object.assign({}, p, {desc:v.desc, opts:v.opts});
}
function choosePolicy(i){

function applyPolicyOption(pid, idx, isStaged){
  const p = POLICIES.find(x=>x.id===pid);
  const opt = isStaged ? p.stages[S.activePolicy.stage].opts[idx] : (window._policyOpts||p.opts)[idx];
  let eff = JSON.parse(JSON.stringify(opt.eff||{}));
  /* 担当大臣の能力で効果を補正 */
  if(opt.needPost || p.needPost){
    const post = opt.needPost || p.needPost;
    const m = S.cabinet[post];
    if(m){
      const bonus = (m.skill-68)/28;
      if(eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k]>0) eff.seg[k]=Math.round(eff.seg[k]*(1+bonus)); });
      if(eff.econ) eff.econ = Math.round(eff.econ*(1+bonus));
    }
  }
  /* 財務大臣の能力で財政ダメージを軽減 */
  const fiscHit = (eff.fisc||0) + (opt.cost? -opt.cost*0.4 : 0);
  if(fiscHit < 0 && S.cabinet.zaimu) { eff.fisc = fiscHit * (1 - (S.cabinet.zaimu.skill-65)/160); }
  else if(fiscHit) eff.fisc = fiscHit;
  if(opt.cost && !eff.fisc) eff.fisc = -opt.cost*0.4;
  /* 首相の得意分野の政策は効果が少し強くなる（プラスの効果を3割増し） */
  let specNote = "";
  if(S.pmSpecFields && S.pmSpecFields.includes(p.field)){
    if(eff.seg) Object.keys(eff.seg).forEach(k=>{ if(eff.seg[k]>0) eff.seg[k]=Math.round(eff.seg[k]*1.3); });
    if(eff.econ>0) eff.econ = Math.round(eff.econ*1.3);
    specNote = " 首相の得意分野とあって、政策の手応えはひときわ大きかった。";
  }
  applyEffects(eff, opt);
  /* 連立条件チェック */
  checkCoalitionReaction(p, opt);
  /* ねじれ国会：法案系政策は効果が薄まることがある */
  let twistNote = "";
  if(S.twisted && Math.random()<0.35){
    applySegAll(-1);
    twistNote = "ただし参院のねじれで関連法案の審議が難航し、効果は一部にとどまった。";
  }
  twistNote += specNote;
  S.usedPolicies[p.id] = S.turn;
  S.fieldUsed = S.fieldUsed || {};
  S.fieldUsed[p.field] = S.turn;
  S.policiesDone.push({title:p.title, choice:opt.label, when:`${S.year}年${S.month}月`});
  S.policyLog.push({title:`${p.title}：${opt.label}`, text:opt.msg + twistNote});
  if(isStaged){
    S.activePolicy.stage++;
    if(S.activePolicy.stage >= p.stages.length){
      S.activePolicy = null;
      if(p.id==="tariff"){
        /* 関税交渉は合意で決着。以後は通常の政策候補に出てこない */
        S.tariffDone = true; S.tariffDoneTurn = S.turn;
        window._tariffMsg = `「${p.title}」は合意に達し、決着した。${opt.msg}${twistNote}`;
        showPaper({
          kicker:"一面", title:"日米関税交渉、合意が成立", sub:"数か月に及んだ交渉に決着",
          body:`米国との関税交渉が最終合意に達した。${esc(opt.msg)} 首相は会見で「国益を守り抜いた合意だ」と強調し、産業界からは安堵の声が広がった。市場も合意を好感している。今後よほどのことがない限り、この交渉が再び政策の俎上に上ることはない見通しだ。`,
          btn:"政権運営に戻る", fn:"afterTariffPaper()"
        });
        return;
      }
      finishMonth(`「${p.title}」の交渉が決着した。${opt.msg}${twistNote}`);
    } else {
      finishMonth(`「${p.title}」は第${S.activePolicy.stage}回交渉を終え、継続中（残り${p.stages.length - S.activePolicy.stage}回）。${opt.msg}`);
    }
  } else {
    finishMonth(`${opt.msg}${twistNote}`);
  }
}
function afterTariffPaper(){

}
function applyEffects(eff, opt){
  if(eff.seg) applySeg(eff.seg);
  if(eff.all) applySegAll(eff.all);
  if(opt && opt.eff && opt.eff.all) applySegAll(0); /* applySeg済み */
  if(eff.econ) S.econ = clamp(S.econ + eff.econ, 5, 97);
  if(eff.fisc) S.fisc = clamp(S.fisc + eff.fisc, 3, 97);
  if(eff.infl) S.infl = clamp(S.infl - eff.infl, 5, 97);
  if(eff.rel) Object.keys(eff.rel).forEach(pid=>{ S.partySupport[pid] = clamp(S.partySupport[pid] + eff.rel[pid]*0.5, 1, 55); });
  if(eff.partyRel) S.partyRel = clamp(S.partyRel + eff.partyRel, 0, 100);
  if(eff.coalRel && S.coalition) S.coalition.rel = clamp(S.coalition.rel + eff.coalRel, 0, 100);
}
function checkCoalitionReaction(p, opt){
  if(!S.coalition) return;
  const cond = coalitionCondition(S.coalition.partyId);
  const text = (p.id + " " + opt.label);
  let hit = 0;
  if(cond.field==="child" && p.id==="child" && (opt.eff.fisc||0) >= 0 && opt.cost===0) hit = -6;
  if(cond.field==="child" && p.id==="child" && opt.cost>=2) hit = +7;
  if(cond.field==="energy" && p.id==="nuclear" && opt.label.includes("進める") && !opt.label.includes("慎重")) hit = -10;
  if(cond.field==="tax" && p.id==="tax" && opt.label.includes("減税")) hit = +7;
  if(cond.field==="tax" && p.id==="tax" && opt.label.includes("行わず")) hit = -6;
  if(cond.field==="defense" && p.id==="defense" && opt.label.includes("抑え")) hit = -8;
  if(cond.field==="defense" && p.id==="defense" && opt.cost>=3) hit = +6;
  if(cond.field==="local" && p.id==="local" && opt.cost>=2) hit = +6;
  if(cond.field==="reform" && (opt.eff.fisc||0) >= 2) hit = +5;
  if(cond.field==="welfare" && (opt.cost||0)>=2) hit = +5;
  if(hit) S.coalition.rel = clamp(S.coalition.rel + hit, 0, 100);
}
function skipPolicy(){

/* ---------------- 月末処理 ---------------- */
function finishMonth(policyMsg){
  S.eventCulprit = null;
  /* ランダムイベント判定 */
  const ev = rollEvent();
  if(ev){ renderEvent(ev, policyMsg); return; }
  endMonth(policyMsg, null);

function rollEvent(){
  /* 災害の翌月以降は、復旧のフォローイベントが優先的に起こる */
  if(S.pendingRecovery && Math.random() < 0.65){
    const rec = EVENTS.find(e=>e.id==="recovery");
    if(rec) return rec;
  }
  const ministers = POSTS.map(p=>S.cabinet[p.id]).filter(Boolean);
  const avgRisk = ministers.length? ministers.reduce((s,m)=>s+m.risk,0)/ministers.length : 20;
  for(const ev of shuffle(EVENTS)){
    if(ev.coalitionOnly && !S.coalition) continue;
    if(ev.recovery) continue; /* 復旧イベントは上の優先判定でのみ発生 */
    if(ev.months && !ev.months.includes(S.month)) continue; /* 季節に寄せる（台風は夏〜秋、豪雪は冬など） */
    if(ev.tariffReopen && !(S.tariffDone && S.turn - (S.tariffDoneTurn||0) >= 18)) continue; /* 合意後は長期間あけて、稀にだけ */
    let p = ev.prob;
    if(ev.scandal) p *= (0.55 + avgRisk/38 + S.pmRisk/160);
    if(ev.party && S.approval>45) p *= 0.5;
    if(Math.random() < p) return ev;
  }
  return null;
}
/* 災害の発生地域・規模を決め、見出しと本文を組み立てる（再開時も同じ内容になるよう状態に保持） */
function disasterInfo(ev){
  if(S.eventDisaster && S.eventDisaster.id===ev.id) return S.eventDisaster;

  else if(ev.id==="typhoon"){ headline = `大型台風が${region}に上陸`; text = `大型で強い台風が${region}に上陸し、暴風と大雨で交通機関が大きく乱れている。河川の増水と土砂災害への警戒も続いている。`; }
  else if(ev.id==="flood"){ headline = `記録的豪雨、${region}で水害相次ぐ`; text = `${region}で線状降水帯による記録的な豪雨となり、河川の氾濫と浸水、土砂災害が相次いでいる。避難と救助が急がれる。`; }
  else if(ev.id==="snow"){ headline = `${region}で記録的な豪雪`; text = `${region}を中心に記録的な大雪となり、交通の寸断と家屋の倒壊、孤立する集落が出ている。除雪と生活支援が急務だ。`; }
  else if(ev.id==="volcano"){ headline = `${region}の火山が噴火`; text = `${region}の火山が噴火し、周辺住民の避難が始まっている。噴火の推移と降灰の影響はまだ見通せない。`; }
  else if(ev.id==="heat"){ headline = `全国で記録的な猛暑`; text = `全国各地で猛烈な暑さが続き、熱中症による救急搬送が急増している。電力需給も綱渡りの状況だ。`; }
  else { headline = ev.title; text = ev.text; }
  S.eventDisaster = {id:ev.id, region:region, headline:headline, text:text, kindName:ev.kindName||"災害"};

/* 問題を起こした閣僚を、現閣僚の中からリスクの高い人ほど選ばれやすく決める */
function chooseCulprit(){
  const ms = POSTS.map(p=>({postId:p.id, postName:p.name, m:S.cabinet[p.id]})).filter(x=>x.m);
  if(!ms.length) return null;
  let tot = 0; ms.forEach(x=>{ tot += (x.m.risk||10) + 6; });
  let r = Math.random()*tot;
  for(const x of ms){ r -= (x.m.risk||10) + 6; if(r<=0) return {postId:x.postId, postName:x.postName, name:x.m.name}; }
  const last = ms[ms.length-1];
  return {postId:last.postId, postName:last.postName, name:last.m.name};
}

    </div>

function applyEvent(evid, idx){
  const ev = EVENTS.find(e=>e.id===evid);

  const eff = o.eff || {};

  let extraMsg = "";
  if(o.debate){
    const score = S.pmDebate + rnd(-14,14);
    if(score>=78){ applySegAll(2); extraMsg="首相の答弁が的確で、論戦を制したとの評価が広がった。"; }
    else if(score<58){ applySegAll(-3); extraMsg="首相の答弁が迷走し、野党の追及をかわせなかった。"; }
  }
  if(o.kanbo && S.cabinet.kanbo){
    const k = S.cabinet.kanbo;
    if(k.debate>=72){ applySegAll(2); extraMsg=`官房長官の${k.name}氏の答弁が安定し、政権へのダメージを防いだ。`; }
    else if(k.debate<58){ applySegAll(-2); extraMsg=`官房長官の${k.name}氏の答弁が不安定で、批判を招いた。`; }
  }
  applySeg(eff);
  if(o.fisc) S.fisc = clamp(S.fisc + o.fisc, 3, 97);
  if(o.econ) S.econ = clamp(S.econ + o.econ, 5, 97);
  if(o.partyRel) S.partyRel = clamp(S.partyRel + o.partyRel, 0, 100);
  if(o.coalRel && S.coalition) S.coalition.rel = clamp(S.coalition.rel + o.coalRel, 0, 100);
  const msg = o.msg + (extraMsg? " "+extraMsg : "");
  const culprit = (ev.scandal && S.eventCulprit) ? S.eventCulprit : null;
  /* 災害対応：現地視察は翌月の政策判断を制限し、翌月以降に復旧フォローイベントへつながる */
  let logTitle = ev.title;
  if(ev.disaster){
    const di = S.eventDisaster;
    if(di) logTitle = di.headline;
    if(ev.id!=="heat"){
      S.pendingRecovery = {region: di?di.region:"被災地", kindName: di?di.kindName:(ev.kindName||"災害"), visited: !!o.visit};
    }
    if(o.visit) S.restrictPolicy = true;
    S.eventDisaster = null;
  }

    S.pendingRecovery = null;
  }

  if(o.reopenTariff){
    S.tariffDone = false;
    S.usedPolicies["tariff"] = S.turn - 99;
    if(S.fieldUsed) delete S.fieldUsed["外交・通商"];
  }
  S.policyLog.push({title: logTitle + (culprit?`（${culprit.postName}・${culprit.name}氏）`:""), text:msg});
  if(o.reshuffle){
    S.pendingReshuffle = true;
    /* 更迭対象を記録し、直後の内閣改造でそのポストの交代を必須にする */
    if(culprit) S.pendingDismissal = {postId: culprit.postId, postName: culprit.postName, name: culprit.name, reason: ev.id==="gaffe" ? "失言" : "不適切な言動"};
  }

}
function endMonth(policyMsg, eventMsg){
  /* 月次の自然変動：予算配分の持続効果 */
  if(S.budget){
    if(S.budget.welfare>=36) S.seg.elderly = clamp(S.seg.elderly+0.3,3,97);
    if(S.budget.welfare<=28) S.seg.elderly = clamp(S.seg.elderly-0.4,3,97);
    if(S.budget.child>=11){ S.seg.parents = clamp(S.seg.parents+0.3,3,97); S.seg.youth = clamp(S.seg.youth+0.15,3,97); }
    if(S.budget.child<=5) S.seg.parents = clamp(S.seg.parents-0.35,3,97);
    if(S.budget.defense>=9 && Math.random()<0.3) S.seg.elderly = clamp(S.seg.elderly+0.2,3,97);
    if(S.budget.local>=12) S.seg.rural = clamp(S.seg.rural+0.3,3,97);
    if(S.budget.econ>=13) S.econ = clamp(S.econ+0.3,5,97);
  }
  /* 支持率の自然な回帰と「政権への飽き」：長く続くほど下押し圧力が強まる */
  SEGMENTS.forEach(g=>{ S.seg[g.id] = clamp(S.seg[g.id] + (40 - S.seg[g.id]) * 0.09 + rnd(-0.9,0.9), 3, 97); });
  if(S.turn > 6) applySegAll(-Math.min(2.3, (S.turn - 6) * 0.055));
  /* 景気の急変ショック */
  if(Math.random() < 0.055){ S.econ = clamp(S.econ - ri(4,8), 5, 97); S.policyLog.push({title:"景気後退の兆し", text:"経済指標が悪化し、政権の経済運営への不安が広がった。"}); }
  if(Math.random() < 0.04){ S.infl = clamp(S.infl - ri(4,7), 5, 97); S.policyLog.push({title:"物価上昇が加速", text:"生活必需品の値上がりが家計を直撃している。"}); }
  /* 経済・物価の自然変動 */
  S.econ = clamp(S.econ + rnd(-1.6,1.8) + (S.fisc<30? -0.5:0), 5, 97);
  S.infl = clamp(S.infl + rnd(-1.8,1.8), 5, 97);
  if(S.infl<38) { S.seg.elderly = clamp(S.seg.elderly-0.7,3,97); S.seg.parents = clamp(S.seg.parents-0.5,3,97); }
  /* スキャンダル余波 */
  if(S.scandalHeat>0){ applySegAll(-S.scandalHeat*0.4); S.scandalHeat--; }
  /* 連立関係の自然減衰＆ポスト配分チェック */
  if(S.coalition){
    S.coalition.rel = clamp(S.coalition.rel - rnd(0.5,2.2), 0, 100);
    const hasPartnerMinister = POSTS.some(p=>S.cabinet[p.id] && S.cabinet[p.id].party===S.coalition.partyId);
    if(!hasPartnerMinister) S.coalition.rel = clamp(S.coalition.rel - 1.2, 0, 100);
  }
  recalcApproval();
  /* 時間を進める */
  S.turn++;
  S.month++; if(S.month>12){ S.month=1; S.year++; }
  if(S.month===4) S.budgetDone = false;
  S.hrTermLeft--; S.hcTermLeft--;
  showPoll(policyMsg, eventMsg);
}

function afterPoll(){
  /* 連立離脱チェック */
  if(S.coalition && S.coalition.rel <= 8){
    const leaving = S.coalition.partyId;
    const leavingPartner2 = S.coalition.partner2;
    S.coalitionHist.push(`${partyById(leaving).name}が連立を離脱`);
    S.coalition = null;
    /* 離脱した党出身の閣僚は与党外になるため退任させ、後任人事（内閣改造）へつなぐ。
       追加パートナー（partner2）が残る場合も、主パートナーの離脱で枠組みは解消する扱いにする */
    const vacated = [];
    POSTS.forEach(p=>{
      const m = S.cabinet[p.id];
      if(m && !m.civilian && (m.party===leaving || (leavingPartner2 && m.party===leavingPartner2))){
        vacated.push(`${p.name}の${m.name}氏`);
        S.cabinet[p.id] = null;
      }
    });
    if(vacated.length) S.pendingReshuffle = true;
    const gov = totalGovHR();
    setResume("postCrisis", {});
    showPaper({
      kicker:"号外", title:`${esc(partyById(leaving).name)}が連立離脱`, sub:"政権は少数与党に転落",
      body:`連立パートナーだった${esc(partyById(leaving).name)}が、政策運営への不満を理由に連立離脱を通告した。
      与党の衆院議席は${gov}議席となり、過半数を割り込んだ。今後の法案審議は野党の協力なしには進まない。
      ${vacated.length?`${vacated.join("、")}は与党を離れた党の出身のため閣僚を退任した。後任の人事を行う。`:""}
      政権の立て直しには、新たな協力関係の構築か、解散・総選挙での信を問う判断が求められる。`,
      btn: vacated.length? "後任の人事へ" : "政権運営に戻る", fn:"postCrisisCheck()"
    });
    return;
  }
  /* 更迭した閣僚の補充 */
  if(S.pendingReshuffle){
    S.pendingReshuffle = false;
    cabinetStep(false);
    return;
  }
  postCrisisCheck();
}
function postCrisisCheck(){
  /* 空席ポストの補充（更迭・連立離脱で閣僚が退任した場合） */
  if(S.pendingReshuffle){
    S.pendingReshuffle = false;
    cabinetStep(false);
    return;
  }
  /* 選挙の到来チェック */
  if(S.hcTermLeft <= 0){ startElection("hc"); return; }
  if(S.hrTermLeft <= 0){ startElection("hr", false); return; }
  /* 終了条件：支持率低迷の継続 → 退陣圧力 */
  if(S.lowStreak >= 3 || (S.approval < 18 && S.lowStreak>=2)){
    gameOver("支持率の低迷が続き、党内から公然と退陣を求める声が上がった。首相は「責任を取る」として辞意を表明した。");
    return;
  }
  if(S.partyRel < 12){
    gameOver("党内基盤が崩壊し、総裁の座を維持できなくなった。首相は辞意を表明した。");
    return;
  }
  /* 党内基盤の自然変動：支持率が低いと確実に蝕まれる */
  if(S.approval < 36) S.partyRel = clamp(S.partyRel + rnd(-3.6,-0.8), 0, 100);
  else if(S.approval < 45) S.partyRel = clamp(S.partyRel + rnd(-1.4,0.7), 0, 100);
  else S.partyRel = clamp(S.partyRel + rnd(-0.2,1.6), 0, 100);
  renderMain();
}

let electionCtx = null;
function genTalentCandidates(n){
  const out = [];
  const usedNames = new Set();
  /* 過去の選挙で当選したタレント議員は「現職」として再登場し、当選回数を重ねてベテラン化する */
  (S.talentRoster||[]).slice(0,2).forEach(t=>{ out.push({...t, returning:true}); usedNames.add(t.name); });
  while(out.length < (n||3)){
    const t = pick(TALENT_TYPES);
    let name; do { name = pick(FICTIONAL_SURNAMES)+" "+pick(FICTIONAL_GIVEN); } while(usedNames.has(name));
    usedNames.add(name);
    /* ageは2026年時点の値として保持し、表示時に経過年数を加算する。年齢層はタイプごとに変える */
    const ageBase = t.age ? ri(t.age[0], t.age[1]) : ri(26,58);
    out.push({name, ...t, age: ageBase - (S.year-2026), terms:0});
  }
  return out;
}

function chosenTalentsNow(){

}
function slateEffects(chosen){
  let youth=0, elderly=0, all=0; const notes=[];
  let young=0, vet=0, segHit=false;
  chosen.forEach(t=>{
    const a = ageOf(t), tr = termsOf(t);
    if(a!=null && a<=40) young++;
    if(tr>=2 || (a!=null && a>=55)) vet++;
    if(a!=null && a<=35) youth += 1.3; else if(a!=null && a<=45) youth += 0.6;
    if(tr===0) youth += 0.3; /* 新人の「刷新感」 */
    if(tr>=3) elderly += 1.0; else if(tr>=1) elderly += 0.5;
    /* タイプごとの「知名度が効く層」：得意な層の掘り起こしが見込める */
    if(t.seg==="youth"){ youth += 0.7; segHit=true; }
    else if(t.seg==="elderly"){ elderly += 0.7; segHit=true; }
    else if(t.seg==="all"){ all += 0.5; segHit=true; }
    else if(t.seg){ all += 0.35; segHit=true; }
  });
  if(segHit) notes.push("各候補の知名度が「効く層」の掘り起こしが期待できます（候補カードの注記参照）。");
  if(chosen.length>=2 && young===chosen.length){ elderly -= 1.0; notes.push("若手だけの顔ぶれは勢いがある一方、高齢層の安心感はやや下がります。"); }
  if(chosen.length>=2 && vet===chosen.length){ youth -= 0.8; notes.push("ベテラン中心の顔ぶれは信頼感がある反面、「刷新感」が薄く若年層は伸びにくくなります。"); }
  if(young>0 && vet>0){ all += 0.8; notes.push("若手とベテランがそろった構成で、幅広い世代に訴求できます。"); }
  if(youth>0.5) notes.push("若い候補者の擁立は、若年層・無党派層への浸透が期待できます。");
  if(elderly>0.5) notes.push("当選回数の多い候補者は、高齢層と支持基盤からの信頼を集めます。");
  const r = v => Math.round(v*10)/10;
  return { youth:r(youth), elderly:r(elderly), all:r(all), notes };
}
function slatePanelHtml(){

function forecastSeats(kind, stratBonus, talentBonus){
  const isHR = kind==="hr";
  const total = isHR? HR_TOTAL : HC_TOTAL;
  const cur = isHR? S.hrSeats : S.hcSeats;
  const supportTotal = PARTIES.reduce((s,p)=>s+S.partySupport[p.id],0);
  let govShare = 0;
  PARTIES.forEach(p=>{
    let share = S.partySupport[p.id]/supportTotal;
    if(p.id===S.pmParty) share *= 1 + (S.approval-45)/160 + stratBonus + talentBonus;
    if(S.coalition && p.id===S.coalition.partyId) share *= 1.02;
    if(p.id===S.pmParty || (S.coalition&&p.id===S.coalition.partyId)) govShare += share;
  });
  let govSeats = Math.round(govShare * total * (isHR? 1.12 : 1.0));
  if(!isHR){ /* 参院は半数改選：現有の半分は残る */
    const keep = Math.round(((cur[S.pmParty]||0) + (S.coalition?(cur[S.coalition.partyId]||0):0))/2);
    govSeats = keep + Math.round(govSeats/2);
  }
  return { gov: clamp(govSeats, 10, total-20) };
}

function runElection(){
  const ctx = electionCtx;
  ctx.chosenTalents = ctx.talents.filter((t,i)=> ctx.talentSel && ctx.talentSel[i]);
  ctx.focus = document.getElementById("elFocus").value;
  ctx.issue = document.getElementById("elIssue").value;
  ctx.tour = document.getElementById("elTour").value;
  const isHR = ctx.kind==="hr";
  const chief = S.electionChief ? S.electionChief.skill : 60;
  /* 戦略ボーナス */
  let strat = (chief-62)/160;
  if(ctx.tour==="swing") strat += (chief-60)/120;
  if(ctx.tour==="base") strat += 0.015;
  if(ctx.tour==="media") strat += (S.pmPop-60)/300;
  if(ctx.focus==="youth") strat += (S.seg.youth-50)/500;
  if(ctx.focus==="elderly") strat += (S.seg.elderly-50)/500;
  if(ctx.focus==="rural") strat += (S.seg.rural-50)/500;
  if(ctx.focus==="urban") strat += (S.seg.urban-50)/500;
  const stance = partyById(S.pmParty).stance;
  if(ctx.issue==="defense" && stance.defense==="増強") strat += 0.02;
  if(ctx.issue==="welfare" && stance.welfare==="拡充") strat += 0.02;
  if(ctx.issue==="reform" && (stance.econ==="規制改革"||stance.welfare==="効率化")) strat += 0.02;
  if(ctx.issue==="econ" && S.econ>=55) strat += 0.02;
  /* タレント候補ボーナス＆事故 */
  let talentBonus = 0, talentMsg = "";
  ctx.chosenTalents.forEach(t=>{
    talentBonus += t.pop/1600;
    S.talentUsed++;
    if(Math.random() < t.risk/220){
      talentBonus -= 0.02;
      talentMsg += `${t.name}候補（${t.type}）の発言が物議を醸し、選挙戦の足を引っ張った。`;
    } else {
      talentMsg += `${t.name}候補（${t.type}）の知名度が無党派層に浸透した。`;
    }
  });
  /* タレント候補の「効く層」は、その層の支持そのものも少し押し上げる */
  ctx.chosenTalents.forEach(t=>{
    if(t.seg==="all") applySegAll(0.3);
    else if(t.seg && S.seg[t.seg]!=null) S.seg[t.seg] = clamp(S.seg[t.seg] + 0.7, 3, 97);
  });
  /* 候補者構成（年齢・当選回数）の世代別効果：議席にも小さく効かせる */
  const se = slateEffects(ctx.chosenTalents);
  ctx.slateEff = se;
  strat += (se.youth*0.20 + se.elderly*0.26 + se.all) * 0.01;
  if(se.youth >= 1.5) talentMsg += "若手中心の擁立が若年層の関心を集めた。";
  if(se.elderly >= 1.5) talentMsg += "ベテラン候補の存在が支持基盤に安心感を与えた。";
  if(se.all > 0) talentMsg += "世代のバランスが取れた候補者構成が幅広く評価された。";
  /* 閣僚スキャンダルの飛び火 */
  if(Math.random() < 0.10){ strat -= 0.015; talentMsg += "選挙期間中に閣僚の言動が報じられ、逆風となった。"; }
  resolveElection(ctx, strat, talentBonus, talentMsg);
}
function resolveElection(ctx, strat, talentBonus, talentMsg){
  const isHR = ctx.kind==="hr";
  const total = isHR? HR_TOTAL : HC_TOTAL;
  const cur = isHR? S.hrSeats : S.hcSeats;
  const supportTotal = PARTIES.reduce((s,p)=>s+S.partySupport[p.id],0) || 1;
  const newSeats = {};
  let shares = {};
  PARTIES.forEach(p=>{
    let share = S.partySupport[p.id]/supportTotal;
    const fatigue = 1 - Math.min(0.30, Math.max(0, S.turn-18) * 0.0035); /* 長期政権への飽き */
    if(p.id===S.pmParty) share *= (1 + (S.approval-45)/88 + strat + talentBonus) * fatigue;
    if(S.coalition && p.id===S.coalition.partyId) share *= 1.02 + strat*0.4;
    if(p.id==="cdp") share *= 1 + (42-S.approval)/150;
    shares[p.id] = Math.max(share, 0.004);
  });
  const shTotal = Object.values(shares).reduce((s,v)=>s+v,0);
  if(isHR){
    PARTIES.forEach(p=>{ newSeats[p.id] = Math.round(shares[p.id]/shTotal * total * 1.06); });
  } else {
    /* 参院：半数改選。非改選の半分は維持し、改選分を配分 */
    PARTIES.forEach(p=>{
      const keep = Math.round((cur[p.id]||0)/2);
      const win = Math.round(shares[p.id]/shTotal * (total/2) * 1.04);
      newSeats[p.id] = keep + win;
    });
  }
  /* 合計を総数に調整 */
  let diff = total - Object.values(newSeats).reduce((s,v)=>s+v,0);
  const sorted = PARTIES.slice().sort((a,b)=>(newSeats[b.id]||0)-(newSeats[a.id]||0));
  let i=0;
  while(diff!==0 && i<200){ const p=sorted[i%sorted.length]; if(diff>0){newSeats[p.id]++; diff--;} else if(newSeats[p.id]>1){newSeats[p.id]--; diff++;} i++; }
  const beforeGov = isHR? totalGovHR() : totalGovHC();
  const beforeSeats = {}; PARTIES.forEach(p=>{ beforeSeats[p.id] = cur[p.id]||0; });
  if(isHR) PARTIES.forEach(p=>{ S.hrSeats[p.id]=newSeats[p.id]; });
  else PARTIES.forEach(p=>{ S.hcSeats[p.id]=newSeats[p.id]; });
  const afterGov = isHR? totalGovHR() : totalGovHC();
  const majority = Math.floor(total/2)+1;
  S.elections.push({kind:ctx.kind, year:S.year, month:S.month, gov:afterGov, win: afterGov>=majority, dissolved: ctx.dissolved});
  /* 候補者構成による世代別支持の変化を実際に反映 */
  if(ctx.slateEff){
    if(ctx.slateEff.youth || ctx.slateEff.elderly) applySeg({youth:ctx.slateEff.youth, elderly:ctx.slateEff.elderly});
    if(ctx.slateEff.all) applySegAll(ctx.slateEff.all);
  }
  /* 当選回数の更新：首相・現職閣僚・選対委員長は再選で+1回 */
  S.termBonus[S.pmName] = (S.termBonus[S.pmName]||0) + 1;
  POSTS.forEach(p=>{ const m = S.cabinet[p.id]; if(m && !m.civilian) S.termBonus[m.name] = (S.termBonus[m.name]||0) + 1; });
  if(S.electionChief) S.termBonus[S.electionChief.name] = (S.termBonus[S.electionChief.name]||0) + 1;
  /* 擁立したタレント候補は当選したものとして記録し、次回は現職（ベテラン側）として再登場する */
  ctx.chosenTalents.forEach(t=>{
    const ex = (S.talentRoster||[]).find(r=>r.name===t.name);
    if(ex){ ex.terms = (ex.terms||0) + 1; ex.skill = Math.min(72, ex.skill+4); ex.risk = Math.max(18, ex.risk-4); }
    else S.talentRoster.push({name:t.name, type:t.type, pop:t.pop, skill:Math.min(70,(t.skill||34)+8), risk:Math.max(20,(t.risk||50)-8), age:t.age, terms:1, seg:t.seg||null, segNote:t.segNote||""});
  });
  /* 支持率・関係への反映 */
  S.partyRel = clamp(S.partyRel + (afterGov>=majority? 6 : -8), 0, 100);
  const tableRows = PARTIES.slice().sort((a,b)=>(newSeats[b.id]||0)-(newSeats[a.id]||0)).map(p=>{
    const d = newSeats[p.id] - beforeSeats[p.id];
    const gov = p.id===S.pmParty || (S.coalition&&p.id===S.coalition.partyId);
    return `<tr><td class="${gov?"win":""}">${esc(p.name)}${gov?"（与党）":""}</td><td>${beforeSeats[p.id]}</td><td class="${gov?"win":""}">${newSeats[p.id]}</td><td>${d>0?"+"+d:d}</td></tr>`;
  }).join("");
  const headline = isHR
    ? (afterGov>=majority ? (afterGov-beforeGov>=15?"与党が大勝、政権に信任":"与党が過半数を維持") : (afterGov>=majority-40?"与党、過半数を割り込む":"与党が大敗"))
    : (afterGov>=majority ? "参院選、与党が過半数を維持" : "参院選で与党が敗北 ― ねじれ国会に");
  electionCtx.result = {isHR, afterGov, beforeGov, majority, tableRows, headline, talentMsg};
  setResume("electionResult", {ctx: electionCtx});
  renderElectionResult();
}
function renderElectionResult(){
  const r = electionCtx.result;
  showPaper({
    kicker:"選挙特報", title: r.headline, sub:`与党は ${r.beforeGov} → ${r.afterGov} 議席（過半数ライン ${r.majority}）`,
    body: `${r.talentMsg?esc(r.talentMsg)+" ":""}${r.isHR?"衆院選":"参院選"}の投開票が行われた。
    ${r.afterGov>=r.majority? "与党は過半数を確保し、政権運営の基盤は維持された。" : "与党は過半数を割り込んだ。"}
    内閣支持率${S.approval}%の政権に対する有権者の審判が下された形だ。`,
    extra:`<table><tr><th>政党</th><th>改選前</th><th>獲得</th><th>増減</th></tr>${r.tableRows}</table>`,
    btn:"結果を受け止める", fn:"afterElection()"
  });
}
function afterElection(){
  const r = electionCtx.result;
  if(r.isHR){
    S.hrTermLeft = 48;
    if(r.afterGov >= r.majority){
      S.twisted = totalGovHC() < Math.floor(HC_TOTAL/2)+1;
      applySegAll(2);
      recalcApproval();
      setResume("main", {});
      showPaper({kicker:"速報", title:"政権継続が決定", sub:`内閣支持率は${S.approval}%`,
        body:"選挙を乗り切った政権は、改めて政策運営に臨む。勝った選挙の勢いを、どこまで数字に変えられるか。",
        btn:"政権運営に戻る", fn:"renderMain()"});
    } else if(r.afterGov >= r.majority - 45 && S.pmParty){
      /* 連立組み替えの選択肢 */
      const partners = PARTIES.filter(p=>p.id!==S.pmParty && p.id!=="other" && (!S.coalition || p.id!==S.coalition.partyId) && (S.hrSeats[p.id]||0)>=10)
        .filter(p=> (S.hrSeats[S.pmParty]||0) + (S.hrSeats[p.id]||0) + (S.coalition?(S.hrSeats[S.coalition.partyId]||0):0) >= r.majority)
        .sort((a,b)=>S.hrSeats[b.id]-S.hrSeats[a.id]);
      if(partners.length){
        show(`
          <div class="newsflash mb"><div class="nf-k">政権の岐路</div><div class="nf-t">過半数割れ ― 連立組み替えか、退陣か</div></div>
          <div class="card">
            <p style="font-size:14.5px">与党は過半数を割った。新たなパートナーを迎えて政権を維持する道と、退陣する道がある。</p>
            ${partners.map(p=>`<button class="opt" onclick="regroupCoalition('${p.id}')"><div class="olab">${esc(p.name)}を連立に迎える</div><div class="odet">衆院${S.hrSeats[p.id]}議席。条件：${esc(coalitionCondition(p.id).label)}</div></button>`).join("")}
            <button class="opt" onclick="gameOver('衆院選で過半数を割り込み、政権の維持を断念。首相は退陣を表明した。')"><div class="olab">退陣する</div><div class="odet">選挙結果の責任を取り、政権を明け渡す</div></button>
          </div>
        `);
        return;
      }
      gameOver("衆院選で過半数を割り込み、連立の組み替えも成立しなかった。首相は退陣を表明した。");
    } else {
      gameOver("衆院選で大敗し、政権は維持できなくなった。首相は選挙結果の責任を取り、退陣を表明した。");
    }
  } else {
    S.hcTermLeft = 36;
    const wasTwisted = S.twisted;
    S.twisted = r.afterGov < r.majority;
    if(S.twisted && !wasTwisted){
      setResume("main", {});
      showPaper({kicker:"速報", title:"ねじれ国会が誕生", sub:"法案成立には野党の協力が不可欠に",
        body:"参院で与党が過半数を割り、ねじれ国会となった。今後の法案は参院での修正や野党との妥協なしには成立しにくくなり、政策の効果にも影響が出る。退陣は免れたが、政権運営の難易度は跳ね上がった。",
        btn:"政権運営に戻る", fn:"renderMain()"});
    } else {
      if(!S.twisted && wasTwisted) applySegAll(2);
      setResume("main", {});
      showPaper({kicker:"速報", title: S.twisted? "参院選を乗り切るも、ねじれは継続":"参院選で与党が勝利", sub:`与党は参院で${r.afterGov}議席`,
        body: S.twisted? "ねじれ状態は続くが、政権は当面の危機を脱した。" : "両院で与党が基盤を固め、政権運営に余裕が生まれた。",
        btn:"政権運営に戻る", fn:"renderMain()"});
    }
  }
  electionCtx = null;
}
function regroupCoalition(partyId){
  if(S.coalition){
    S.coalition = {partyId: S.coalition.partyId, rel: S.coalition.rel};
    S.coalitionHist.push(`選挙後、${partyById(partyId).name}も連立に加わった`);
    /* 簡易実装：既存連立に加え、新パートナーを主連立として扱う（議席計算は合計で既に成立） */
    S.coalition.partner2 = partyId;
  } else {
    S.coalition = {partyId, rel: coalitionStability(partyId), since: S.turn};
    S.coalitionHist.push(`選挙後、${partyById(partyId).name}と新たに連立を組んだ`);
  }
  S.twisted = totalGovHC() < Math.floor(HC_TOTAL/2)+1;
  electionCtx = null;
  setResume("main", {});
  showPaper({kicker:"速報", title:"連立政権が再スタート", sub:`${esc(partyById(partyId).name)}が政権に参画`,
    body:`新しい連立の枠組みで政権は存続することになった。パートナーの意向への配慮が、これまで以上に政権運営の鍵になる。${esc(partyById(partyId).name)}の議員は、これからの組閣・内閣改造で閣僚候補に加わる。`,
    btn:"政権運営に戻る", fn:"renderMain()"});
}

/* ---------------- 終了と評価 ---------------- */
function rankOf(){
  const m = S.turn;
  const avg = S.approvalHist.reduce((s,v)=>s+v,0)/Math.max(1,S.approvalHist.length);
  let score = m*0.8 + avg*0.5 + S.policiesDone.length*0.8 + S.elections.filter(e=>e.win).length*5;
  if(score>=125) return "S";
  if(score>=92) return "A";
  if(score>=62) return "B";
  if(score>=36) return "C";
  return "D";
}
function gameOver(reason){
  S.over = true; S.gameOverReason = reason;
  /* 政権が終了したら、その周回の途中セーブは消去する（過去政権アーカイブは別途残る） */
  resumeScreen = null;
  clearSave();
  const rank = rankOf();
  const days = S.turn*30 + ri(5,28);
  saveArchive(rank);
  const wins = S.elections.filter(e=>e.win).length;
  const histRows = HISTORICAL_PM.slice().sort((a,b)=>b.days-a.days).map(h=>{
    const you = days > h.days;
    return `<div class="kv"><span>${esc(h.name)}</span><b>${h.days.toLocaleString()}日 ${you?"← あなたはこれより長期":""}</b></div>`;
  }).join("");
  show(`
    <div class="newsflash mb"><div class="nf-k">号外</div><div class="nf-t">${esc(S.pmName)}首相が退陣を表明</div></div>
    <div class="paper mb">
      <div class="p-head"><span>政権日報（フィクション）</span><span>${S.year}年${S.month}月</span><span>号外</span></div>
      <h2>政権、幕を閉じる</h2>
      <div class="p-sub">在任 ${S.turn}か月 ― 支持率の推移が政権の命運を分けた</div>
      <p>${esc(reason)}</p>
      <p>在任期間は約${days.toLocaleString()}日。内閣支持率は最高${S.maxApproval}%、最低${S.minApproval}%を記録した。
      実現した政策は${S.policiesDone.length}件、選挙は${S.elections.length}回経験し${wins}勝${S.elections.length-wins}敗だった。</p>
    </div>
    <div class="card center mb">
      <div class="mini">総合評価ランク</div>
      <div class="rank-badge">${rank}</div>
      <div class="mini">${rank==="S"?"歴史に残る長期政権だった":rank==="A"?"安定した政権運営で長く続いた":rank==="B"?"一定の実績を残した政権":rank==="C"?"短命に終わったが爪痕は残した":"厳しい政権運営となった"}</div>
    </div>
    <div class="card mb">
      <h3 style="font-size:16px">記録サマリー</h3>
      <div class="kv"><span>在任期間</span><b>${S.turn}か月（約${days.toLocaleString()}日）</b></div>
      <div class="kv"><span>最高／最低 支持率</span><b>${S.maxApproval}% ／ ${S.minApproval}%</b></div>
      <div class="kv"><span>実現した政策</span><b>${S.policiesDone.length}件</b></div>
      <div class="kv"><span>選挙の戦績</span><b>${S.elections.length}戦 ${wins}勝 ${S.elections.length-wins}敗</b></div>
      <div class="kv"><span>連立の変遷</span><b>${esc(S.coalitionHist.join(" → ")||"なし")}</b></div>
      <div class="kv"><span>最終的な経済／財政</span><b>${Math.round(S.econ)} ／ ${Math.round(S.fisc)}</b></div>
      ${S.pmCareer?`<div class="kv"><span>首相の経歴</span><b>${esc(S.pmCareer.summary)}</b></div>`:""}
      ${S.policiesDone.slice(0,10).map(p=>`<div class="kv"><span>${esc(p.when)}</span><b>${esc(p.title)}：${esc(p.choice)}</b></div>`).join("")}
    </div>
    <div class="card mb">
      <h3 style="font-size:16px">歴代政権の在任期間と比較</h3>
      <div class="kv"><span><b>あなた（${esc(S.pmName)}政権）</b></span><b>約${days.toLocaleString()}日</b></div>
      ${histRows}
      <p class="tiny mt">歴代の在任日数は公知の記録に基づきます。</p>
    </div>
    <button class="btn big" onclick="showTitle()">タイトルに戻る（記録はアーカイブに保存済み）</button>
  `);
}

/* ---------------- 途中セーブ（自動保存）と再開 ---------------- */
/* 過去政権アーカイブ（pm-sim-archive-v1）とはキーを分け、進行中の1周回分だけを保持する */
const SAVE_KEY = "pm-sim-save-v1";
let resumeScreen = null; /* {name, ctx}：再読み込み時に復元すべき画面 */
function setResume(name, ctx){
  resumeScreen = {name: name, ctx: ctx || {}};
  saveGame();
}
function saveGame(){
  try{
    if(!S || S.over || !resumeScreen) return;
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, savedAt: Date.now(), screen: resumeScreen, S: S}));
  }catch(e){ /* 保存できない環境ではセーブなしで通常通り続行 */ }
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.v!==1 || !d.S || typeof d.S!=="object") return null;
    const s = d.S;
    /* 形式が合わない・壊れているセーブは無視して通常スタートできるようにする */
    if(typeof s.pmName!=="string" || !s.pmName) return null;
    if(!s.seg || typeof s.seg!=="object" || !s.cabinet || typeof s.cabinet!=="object") return null;
    if(typeof s.approval!=="number" || typeof s.year!=="number" || typeof s.month!=="number" || typeof s.turn!=="number") return null;
    if(s.over) return null;
    if(!d.screen || typeof d.screen.name!=="string") d.screen = {name:"main", ctx:{}};
    return d;
  }catch(e){ return null; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* noop */ }
}
function resumeGame(){
  const d = loadSave();
  if(!d){ showTitle(); return; }
  S = d.S;
  /* 旧バージョンのセーブにも不足フィールドを補い、そのまま続けられるようにする */
  S.fieldUsed = S.fieldUsed || {};
  S.policyVariant = S.policyVariant || {};
  if(S.tariffDone===undefined) S.tariffDone = false;
  if(S.tariffDoneTurn===undefined) S.tariffDoneTurn = -99;
  S.restrictPolicy = !!S.restrictPolicy;
  if(S.pendingRecovery===undefined) S.pendingRecovery = null;
  if(S.eventDisaster===undefined) S.eventDisaster = null;
  /* 経歴機能より前のセーブには経歴がないのでデフォルトで補う（実在首相と同じ扱い） */
  if(S.pmCareer===undefined) S.pmCareer = null;
  if(!Array.isArray(S.pmSpecFields)) S.pmSpecFields = [];
  const sc = d.screen;
  const ctx = sc.ctx || {};
  try{
    switch(sc.name){
      case "coalition": coalitionStep(); break;
      case "cabinet": restoreCabinet(ctx); break;
      case "poll": showPoll(ctx.policyMsg, ctx.eventMsg); break;
      case "event": {
        const ev = EVENTS.find(e=>e.id===ctx.evId);
        if(ev) renderEvent(ev, ctx.policyMsg); else renderMain();
        break;
      }
      case "postCrisis": postCrisisCheck(); break;
      case "electionSetup":
        electionCtx = ctx.ctx || null;
        if(electionCtx) startElection(electionCtx.kind, electionCtx.dissolved); else renderMain();
        break;
      case "electionResult":
        electionCtx = ctx.ctx || null;
        if(electionCtx && electionCtx.result) renderElectionResult(); else renderMain();
        break;
      default: renderMain();
    }
  }catch(e){ renderMain(); }
}
function restoreCabinet(ctx){
  cabinetFirstFlag = !!ctx.first;
  cabinetDraft = ctx.draft || {};
  cabinetNotice = ctx.notice || "";
  POSTS.forEach(p=>{ if(!(p.id in cabinetDraft)) cabinetDraft[p.id] = S.cabinet[p.id] || null; });
  if(!("chief" in cabinetDraft)) cabinetDraft.chief = S.electionChief || null;
  renderCabinet(cabinetFirstFlag);
}

/* ---------------- アーカイブ ---------------- */
function loadArchive(){
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "[]"); } catch(e){ return []; }
}
function saveArchive(rank){
  try {
    const arc = loadArchive();
    arc.unshift({ pmName:S.pmName, partyName: partyById(S.pmParty).name, months:S.turn, rank,
      maxApproval:S.maxApproval, minApproval:S.minApproval, policies:S.policiesDone.length,
      career: S.pmCareer ? S.pmCareer.summary : "",
      elections:S.elections.length, date: new Date().toISOString().slice(0,10) });
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc.slice(0,30)));
  } catch(e){ /* 保存できない環境では記録のみで続行 */ }
}

/* ---------------- 起動 ---------------- */
showTitle();
</script>
